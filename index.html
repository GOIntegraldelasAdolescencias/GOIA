function descargarResumenWord(){
  const f = resumenFiltros;
  let filtradas = (resumenResultados||[]).filter(a => resumenSeleccion.has(a.id));

  const periodoLabel = f.periodoTipo === "dia" ? f.dia : (f.periodoTipo === "semana" ? etiquetaSemanaResumen(f.semana) : `${MESES[parseInt(f.mes)-1]} ${f.anio}`);
  const programaLabel = f.programaId === "todos" ? "Todos los programas" : (programaById(f.programaId)||{}).nombre || f.programaId;
  const tipoLabel = f.tipo === "todos" ? "Único y Jornada normal" : (f.tipo === "unica" ? "Evento único" : "Jornada normal");

  let body = [];
  body.push(`<h1>Resumen de actividades — Agenda GOPIA</h1>`);
  body.push(`<p><b>Programa:</b> ${programaLabel}<br/><b>Período:</b> ${periodoLabel}<br/><b>Tipo:</b> ${tipoLabel}${f.suspendidas==="excluir" ? "<br/><b>Suspendidas:</b> no incluidas" : ""}</p>`);

  if(filtradas.length === 0){
    body.push(`<p><i>No hay actividades cargadas que coincidan con estos filtros.</i></p>`);
  } else {
    filtradas.forEach(a => {
      const progs = (a.programaIds||[a.programaId]).map(id => (programaById(id)||{}).corto || id).join(", ");
      body.push(`<h3>${escapeHtml(a.titulo||"(sin título)")}${a.suspendida?" — ACTIVIDAD SUSPENDIDA":""}</h3>`);
      body.push(`<p>`
        + `<b>Fecha:</b> ${a.fecha}${a.fechaHasta ? " a " + a.fechaHasta : ""}<br/>`
        + (a.horaInicio ? `<b>Horario:</b> ${a.horaInicio}${a.horaFin ? " a " + a.horaFin : ""}<br/>` : "")
        + `<b>Programa/s:</b> ${progs}<br/>`
        + (a.organizacion ? `<b>Organización:</b> ${escapeHtml(a.organizacion)}<br/>` : "")
        + (a.sede ? `<b>Sede:</b> ${escapeHtml(a.sede)}<br/>` : "")
        + (a.personas ? `<b>Cantidad de personas:</b> ${escapeHtml(String(a.personas))}<br/>` : "")
        + (a.micros ? `<b>Micros:</b> ${escapeHtml(String(a.micros))}<br/>` : "")
        + (a.refrigerios ? `<b>Refrigerios:</b> ${escapeHtml(String(a.refrigerios))}<br/>` : "")
        + (a.tramiteEstado ? `<b>Trámite:</b> ${(ESTADOS_TRAMITE.find(e=>e.id===a.tramiteEstado)||{}).label||a.tramiteEstado}<br/>` : "")
        + (a.observaciones ? `<b>Observaciones:</b> ${escapeHtml(a.observaciones)}` : "")
        + `</p>`);
    });
  }

  const htmlDoc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>Resumen Agenda GOPIA</title>
<style>
  body{font-family:Calibri,Arial,sans-serif; font-size:11pt; color:#22262B;}
  h1{font-size:18pt; color:#2D5F5A;}
  h3{font-size:12.5pt; color:#2D5F5A; margin-top:16pt; border-top:1pt solid #DEDCD3; padding-top:10pt;}
  p{line-height:1.5;}
</style></head>
<body>${body.join("\n")}</body></html>`;

  const blob = new Blob(['\ufeff', htmlDoc], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `Resumen_Agenda_GOPIA_${f.periodoTipo==="dia" ? f.dia : (f.periodoTipo==="semana" ? "semana_"+rangoSemana(f.semana).desde : f.anio+"-"+f.mes)}.doc`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  cerrarModal();
}

/* ===================== Resumen: otros formatos de descarga =====================
   Usan la misma búsqueda y selección que el Word: período (mes / semana / día), programa, tipo y suspendidas. */
function resumenDatos(){
  const f = resumenFiltros;
  const filtradas = (resumenResultados||[]).filter(a => resumenSeleccion.has(a.id));
  const periodoLabel = f.periodoTipo === "dia" ? f.dia : (f.periodoTipo === "semana" ? etiquetaSemanaResumen(f.semana) : `${MESES[parseInt(f.mes)-1]} ${f.anio}`);
  const programaLabel = f.programaId === "todos" ? "Todos los programas" : (programaById(f.programaId)||{}).nombre || f.programaId;
  const tipoLabel = f.tipo === "todos" ? "Único y Jornada normal" : (f.tipo === "unica" ? "Evento único" : "Jornada normal");
  const sufijo = f.periodoTipo==="dia" ? f.dia : (f.periodoTipo==="semana" ? "semana_"+rangoSemana(f.semana).desde : f.anio+"-"+f.mes);
  return { f, filtradas, periodoLabel, programaLabel, tipoLabel, sufijo };
}
function descargarBlob(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const DIAS_LARGO = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fechaLinda = k => { const [y,m,d] = k.split("-"); return `${d}/${m}/${y}`; };
const diaSemanaDe = k => DIAS_LARGO[parseKey(k).getDay()];
function detallesActividad(a){
  const progs = (a.programaIds||[a.programaId]).map(id => (programaById(id)||{}).corto || id).join(", ");
  const viandas = (a.viandasLista||[]).filter(v => v.cantidad!=="" && v.cantidad!=null).map(v => `${v.cantidad}${v.tipo?" "+v.tipo:""}`).join(", ");
  const tramite = a.tramiteEstado ? ((ESTADOS_TRAMITE.find(e=>e.id===a.tramiteEstado)||{}).label || a.tramiteEstado) : "";
  return [
    ["Horario", a.horaInicio ? `${a.horaInicio}${a.horaFin ? " a "+a.horaFin : ""}` : ""],
    ["Programa", progs],
    ["Organización", a.organizacion||""],
    ["Sede", a.sede||""],
    ["Dirección", (a.direcciones||[]).filter(Boolean).join(" / ")],
    ["Responsable", a.personas ? String(a.personas) : ""],
    ["Micros", a.micros ? String(a.micros) : ""],
    ["Viandas", viandas],
    ["Refrigerios", a.refrigerios ? String(a.refrigerios) : ""],
    ["Trámite", tramite + (tramite && a.proximoPaso ? " — "+a.proximoPaso : "")],
    ["Observaciones", a.observaciones||""],
  ].filter(([,v]) => v);
}

/* ---------- Word moderno (.docx) ---------- */
const xmlEsc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
async function descargarResumenDocx(){
  if(typeof JSZip === "undefined"){ alert("No se pudo cargar el generador de Word (.docx). Revisá la conexión a internet y probá de nuevo."); return; }
  const d = resumenDatos();
  const run = (txt, o={}) => `<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>${o.b?"<w:b/>":""}${o.i?"<w:i/>":""}${o.strike?"<w:strike/>":""}${o.color?`<w:color w:val="${o.color}"/>`:""}<w:sz w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(txt)}</w:t></w:r>`;
  const par = (runs, o={}) => `<w:p><w:pPr>${o.keepNext?"<w:keepNext/>":""}${o.borderTop?'<w:pBdr><w:top w:val="single" w:sz="6" w:space="6" w:color="DEDCD3"/></w:pBdr>':""}<w:spacing w:before="${o.before||0}" w:after="${o.after==null?60:o.after}"/></w:pPr>${runs}</w:p>`;
  const cuerpo = [];
  cuerpo.push(par(run("Resumen de actividades — Agenda GOPIA", {b:true, sz:36, color:"2D5F5A"}), {after:120}));
  cuerpo.push(par(run("Programa: ",{b:true}) + run(d.programaLabel), {after:0}));
  cuerpo.push(par(run("Período: ",{b:true}) + run(d.periodoLabel), {after:0}));
  cuerpo.push(par(run("Tipo: ",{b:true}) + run(d.tipoLabel), {after:0}));
  if(d.f.suspendidas==="excluir") cuerpo.push(par(run("Suspendidas: ",{b:true}) + run("no incluidas"), {after:0}));
  cuerpo.push(par(run(`${d.filtradas.length} actividad${d.filtradas.length===1?"":"es"}`, {i:true, color:"5B6470"}), {before:60, after:200}));
  if(d.filtradas.length===0){
    cuerpo.push(par(run("No hay actividades cargadas que coincidan con estos filtros.", {i:true})));
  } else {
    let diaActual = "";
    d.filtradas.forEach(a => {
      if(a.fecha !== diaActual){
        diaActual = a.fecha;
        const t = diaSemanaDe(a.fecha); 
        cuerpo.push(par(run(`${t.charAt(0).toUpperCase()+t.slice(1)} ${fechaLinda(a.fecha)}`, {b:true, sz:28, color:"22262B"}), {before:280, after:100, keepNext:true, borderTop:true}));
      }
      const color = ((programaById(a.programaId)||{}).color||"#2D5F5A").replace("#","");
      cuerpo.push(par(run(a.titulo||"(sin título)", {b:true, sz:24, color, strike:!!a.suspendida}), {before:140, after:20, keepNext:true}));
      if(a.suspendida) cuerpo.push(par(run("⛔ ACTIVIDAD SUSPENDIDA", {b:true, sz:20, color:"B3261E"}), {after:20, keepNext:true}));
      detallesActividad(a).forEach(([k,v]) => cuerpo.push(par(run(k+": ",{b:true}) + run(v), {after:10})));
    });
  }
  const documento = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${cuerpo.join("")}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const zip = new JSZip();
  zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/document.xml", documento);
  const blob = await zip.generateAsync({ type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  descargarBlob(blob, `Resumen_Agenda_GOPIA_${d.sufijo}.docx`);
}

/* ---------- Archivo de calendario (.ics) para Google Calendar / Outlook / celular ---------- */
function descargarResumenIcs(){
  const d = resumenDatos();
  if(!d.filtradas.length) return;
  const esc = t => String(t==null?"":t).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const plegar = linea => { const out = []; while(linea.length > 60){ out.push(linea.slice(0,60)); linea = " " + linea.slice(60); } out.push(linea); return out.join("\r\n"); };
  const ymd = k => k.replace(/-/g,"");
  const hms = h => h.replace(":","") + "00";
  const sumaDia = (k, n) => { const dt = parseKey(k); dt.setDate(dt.getDate()+n); return dateKey(dt); };
  const ahora = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//GOPIA//Agenda multisectorial//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Agenda GOPIA"];
  d.filtradas.forEach(a => {
    const ev = ["BEGIN:VEVENT", `UID:${a.id}@agenda-gopia`, `DTSTAMP:${ahora}`];
    if(a.horaInicio){
      ev.push(`DTSTART:${ymd(a.fecha)}T${hms(a.horaInicio)}`);
      let fin;
      if(a.horaFin && a.horaFin > a.horaInicio) fin = `${ymd(a.fecha)}T${hms(a.horaFin)}`;
      else { const [h,m] = a.horaInicio.split(":").map(Number); const t = h*60+m+60; fin = t >= 1440 ? `${ymd(a.fecha)}T235900` : `${ymd(a.fecha)}T${String(Math.floor(t/60)).padStart(2,"0")}${String(t%60).padStart(2,"0")}00`; }
      ev.push(`DTEND:${fin}`);
    } else {
      ev.push(`DTSTART;VALUE=DATE:${ymd(a.fecha)}`, `DTEND;VALUE=DATE:${ymd(sumaDia(a.fecha,1))}`);
    }
    ev.push(`SUMMARY:${esc((a.suspendida ? "SUSPENDIDA — " : "") + (a.titulo||"(sin título)"))}`);
    const lugar = [a.sede, ...(a.direcciones||[]).filter(Boolean)].filter(Boolean).join(" — ");
    if(lugar) ev.push(`LOCATION:${esc(lugar)}`);
    const desc = detallesActividad(a).filter(([k]) => k!=="Horario" && k!=="Sede" && k!=="Dirección").map(([k,v]) => `${k}: ${v}`);
    if(a.suspendida) desc.unshift("ACTIVIDAD SUSPENDIDA");
    if(desc.length) ev.push(`DESCRIPTION:${esc(desc.join("\n"))}`);
    const prog = (programaById(a.programaId)||{}).corto; if(prog) ev.push(`CATEGORIES:${esc(prog)}`);
    ev.push("END:VEVENT");
    ev.forEach(l => L.push(l));
  });
  L.push("END:VCALENDAR");
  descargarBlob(new Blob([L.map(plegar).join("\r\n") + "\r\n"], { type:"text/calendar;charset=utf-8" }), `Agenda_GOPIA_${d.sufijo}.ics`);
}

/* ---------- Grilla imprimible (días en columnas; se imprime o se guarda como PDF desde el navegador) ---------- */
function abrirGrillaImprimible(){
  const d = resumenDatos();
  const f = d.f;
  // Días a dibujar, ordenados en filas de lunes a domingo
  let columnas, filas = [];
  if(f.periodoTipo === "dia"){ columnas = 1; filas = [[f.dia]]; }
  else {
    columnas = 7;
    let desde, hasta;
    if(f.periodoTipo === "semana"){ const r = rangoSemana(f.semana); desde = r.desde; hasta = r.hasta; }
    else {
      const ultimo = new Date(parseInt(f.anio), parseInt(f.mes), 0).getDate();
      const ini = dateKey(inicioSemana(new Date(parseInt(f.anio), parseInt(f.mes)-1, 1)));
      const fin = new Date(parseInt(f.anio), parseInt(f.mes)-1, ultimo); const finSem = new Date(fin); finSem.setDate(fin.getDate() + (7 - ((fin.getDay()+6)%7) - 1));
      desde = ini; hasta = dateKey(finSem);
    }
    let cur = parseKey(desde); const stop = parseKey(hasta);
    let fila = [];
    while(cur <= stop){ fila.push(dateKey(cur)); if(fila.length===7){ filas.push(fila); fila = []; } cur.setDate(cur.getDate()+1); }
    if(fila.length) filas.push(fila);
  }
  const porFecha = {};
  d.filtradas.forEach(a => { (porFecha[a.fecha] = porFecha[a.fecha] || []).push(a); });
  Object.values(porFecha).forEach(l => l.sort((a,b) => (a.horaInicio||"99").localeCompare(b.horaInicio||"99")));
  const enPeriodo = k => f.periodoTipo !== "mes" || k.slice(0,7) === `${f.anio}-${f.mes}`;
  const celda = k => {
    const acts = porFecha[k] || [];
    const chips = acts.map(a => {
      const p = programaById(a.programaId) || {color:"#999", corto:""};
      return `<div class="act${a.suspendida?" susp":""}" style="border-left-color:${p.color}; background:${p.color}14;">
        <div class="hora">${a.horaInicio ? escapeHtml(a.horaInicio) + (a.horaFin ? "–" + escapeHtml(a.horaFin) : "") : "&nbsp;"}<span class="prog" style="color:${p.color};"> ${escapeHtml(p.sigla || p.corto)}</span></div>
        <div class="tit">${escapeHtml(a.titulo||"(sin título)")}</div>
        ${a.suspendida ? `<div class="avisosusp">⛔ SUSPENDIDA</div>` : ""}
        ${a.sede ? `<div class="sub">📍 ${escapeHtml(a.sede)}</div>` : ""}
        ${a.organizacion ? `<div class="sub">${escapeHtml(a.organizacion)}</div>` : ""}
      </div>`;
    }).join("");
    const dt = parseKey(k);
    return `<td class="${enPeriodo(k)?"":"fuera"}"><div class="num">${columnas===1 ? diaSemanaDe(k)+" " : ""}${dt.getDate()}${columnas===7 && dt.getDate()===1 ? " "+MESES[dt.getMonth()].slice(0,3) : ""}</div>${enPeriodo(k)?chips:""}</td>`;
  };
  const leyenda = PROGRAMAS.map(p => `<span><i style="background:${p.color};"></i>${escapeHtml(p.corto)}</span>`).join("");
  const encabezado = columnas===7 ? `<tr>${["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"].map(n=>`<th>${n}</th>`).join("")}</tr>` : "";
  const html = `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Agenda GOPIA — ${escapeHtml(d.periodoLabel)}</title>
<style>
  @page { size: A4 landscape; margin: 9mm; }
  *{ box-sizing:border-box; }
  body{ font-family: Calibri, Arial, sans-serif; color:#22262B; margin:0; padding:12px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .barra{ display:flex; gap:10px; align-items:center; margin-bottom:10px; }
  .barra button{ background:#2D5F5A; color:#fff; border:0; border-radius:8px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; }
  h1{ font-size:17pt; margin:0 0 2px 0; color:#2D5F5A; }
  .meta{ font-size:10pt; color:#5B6470; margin-bottom:8px; }
  table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  th{ background:#2D5F5A; color:#fff; font-size:9.5pt; padding:4px; border:1px solid #2D5F5A; }
  td{ vertical-align:top; border:1px solid #BDBBB1; padding:3px; ${columnas===7 ? "height:"+(filas.length===1?"150mm":"28mm")+";" : ""} }
  tr{ page-break-inside:avoid; }
  td.fuera{ background:#F1F0EB; }
  .num{ font-weight:700; font-size:10pt; color:#22262B; margin-bottom:3px; }
  td.fuera .num{ color:#A9A79C; }
  .act{ border-left:4px solid #999; border-radius:3px; padding:2px 4px; margin-bottom:3px; font-size:8pt; line-height:1.2; page-break-inside:avoid; }
  .act .hora{ font-weight:700; font-size:7.5pt; color:#22262B; }
  .act .prog{ font-weight:700; letter-spacing:.02em; }
  .act .tit{ font-weight:700; }
  .act .sub{ color:#5B6470; font-size:7pt; }
  .act.susp{ opacity:.5; } .act.susp .tit{ text-decoration:line-through; }
  .avisosusp{ color:#B3261E; font-weight:800; font-size:7pt; }
  .leyenda{ margin-top:8px; font-size:8.5pt; display:flex; flex-wrap:wrap; gap:14px; color:#5B6470; }
  .leyenda i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  @media print{ .barra{ display:none; } body{ padding:0; } }
</style></head><body>
<div class="barra"><button onclick="window.print()">🖨 Imprimir / Guardar como PDF</button><span style="font-size:12px; color:#5B6470;">En el cuadro de impresión elegí “Guardar como PDF” si querés un archivo.</span></div>
<h1>Agenda GOPIA — ${escapeHtml(d.periodoLabel)}</h1>
<div class="meta">${escapeHtml(d.programaLabel)} · ${escapeHtml(d.tipoLabel)}${f.suspendidas==="excluir" ? " · sin suspendidas" : ""} · ${d.filtradas.length} actividad${d.filtradas.length===1?"":"es"}</div>
<table>${encabezado}${filas.map(fila => `<tr>${fila.map(celda).join("")}</tr>`).join("")}</table>
<div class="leyenda">${leyenda}</div>
</body></html>`;
  const w = window.open("", "_blank");
  if(!w){ alert("El navegador bloqueó la ventana de la grilla. Permití las ventanas emergentes para esta página y probá de nuevo."); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

        ` : ""}
        ` : `
        <div style="margin-bottom:10px;"><label class="fieldLabel">Programa *</label>
          <select class="inputStyle" onchange="updateForm('programaId', this.value)">
            ${PROGRAMAS.map(p=>`<option value="${p.id}" ${form.programaId===p.id?"selected":""}>${p.nombre}</option>`).join("")}
          </select>
        </div>

        <div class="stack-mobile" style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Fecha *</label>
            <input type="date" class="inputStyle" value="${form.fecha}" oninput="updateForm('fecha', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Hora inicio</label>
            <input type="time" class="inputStyle" value="${form.horaInicio}" oninput="updateForm('horaInicio', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Hora fin</label>
            <input type="time" class="inputStyle" value="${form.horaFin}" oninput="updateForm('horaFin', this.value)" /></div>
        </div>
        `}

        <div class="stack-mobile" style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1; position:relative;">
            <label class="fieldLabel">Organización</label>
            <input id="campo-organizacion" class="inputStyle" value="${escapeHtml(form.organizacion)}" autocomplete="off"
              oninput="onOrgInput(this.value); mostrarSugerencias('organizacion', this.value)"
              onfocus="mostrarSugerencias('organizacion', this.value)"
              onblur="setTimeout(()=>ocultarSugerencias('organizacion'), 150)" />
            <div id="sugerencias-organizacion" style="display:none; position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:7px; margin-top:4px; z-index:60; max-height:160px; overflow-y:auto; box-shadow:0 4px 10px rgba(0,0,0,0.08);"></div>
          </div>
          <div style="margin-bottom:10px; flex:1; position:relative;">
            <label class="fieldLabel">Sede</label>
            <input id="campo-sede" class="inputStyle" value="${escapeHtml(form.sede)}" autocomplete="off"
              oninput="onSedeInput(this.value); mostrarSugerencias('sede', this.value)"
              onfocus="mostrarSugerencias('sede', this.value)"
              onblur="setTimeout(()=>ocultarSugerencias('sede'), 150)" />
            <div id="sugerencias-sede" style="display:none; position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:7px; margin-top:4px; z-index:60; max-height:160px; overflow-y:auto; box-shadow:0 4px 10px rgba(0,0,0,0.08);"></div>
          </div>
        </div>

        <div style="margin-bottom:10px;">
          <label class="fieldLabel">Direcciones</label>
          ${form.direcciones.map((d,i)=>`
            <div style="display:flex; gap:6px; margin-bottom:6px;">
              <input class="inputStyle" value="${escapeHtml(d)}" oninput="actualizarDireccion(${i}, this.value)" placeholder="Calle y número" />
              ${form.direcciones.length>1 ? `<button type="button" onclick="quitarDireccion(${i})" style="width:32px; flex-shrink:0; color:#B3413A; border:1px solid var(--line); border-radius:7px;">✕</button>` : ""}
            </div>
          `).join("")}
          <button type="button" onclick="agregarDireccion()" style="font-size:12px; font-weight:600; color:var(--accent);">+ Agregar otra dirección</button>
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Personas (responsable / referente)</label>
          <input class="inputStyle" value="${escapeHtml(form.personas)}" oninput="updateForm('personas', this.value)" />
        </div>

        <div class="stack-mobile" style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Micros (cantidad)</label>
            <input type="number" min="0" class="inputStyle" value="${form.micros}" oninput="updateForm('micros', this.value)" placeholder="0" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Refrigerios (cantidad)</label>
            <input type="number" min="0" class="inputStyle" value="${form.refrigerios}" oninput="updateForm('refrigerios', this.value)" placeholder="0" /></div>
        </div>

        <div style="margin-bottom:10px;">
          <label class="fieldLabel">Viandas</label>
          ${form.viandasLista.map((v,i)=>`
            <div class="stack-mobile" style="display:flex; gap:6px; margin-bottom:6px;">
              <select class="inputStyle" style="flex:1;" onchange="actualizarViandaTipo(${i}, this.value)">
                <option value="" ${v.tipo===""?"selected":""}>Tipo —</option>
                ${VIANDAS_TIPOS.map(t=>`<option value="${t}" ${v.tipo===t?"selected":""}>${t}</option>`).join("")}
              </select>
              <input type="number" min="0" class="inputStyle" style="flex:1;" value="${v.cantidad}" oninput="actualizarViandaCantidad(${i}, this.value)" placeholder="Cantidad" />
              ${form.viandasLista.length>1 ? `<button type="button" onclick="quitarVianda(${i})" style="width:32px; flex-shrink:0; color:#B3413A; border:1px solid var(--line); border-radius:7px;">✕</button>` : ""}
            </div>
          `).join("")}
          <button type="button" onclick="agregarVianda()" style="font-size:12px; font-weight:600; color:var(--accent);">+ Agregar otro tipo de vianda</button>
        </div>

        <div style="display:flex; align-items:center; gap:8px; margin:10px 0;">
          <input type="checkbox" id="tramite" ${form.tramiteActivo?"checked":""} onchange="toggleTramite(this.checked)" />
          <label for="tramite" style="font-size:13px; font-weight:600;">Incluir seguimiento de trámite (opcional)</label>
        </div>

        ${form.tramiteActivo ? `
          <div style="margin-bottom:10px;"><label class="fieldLabel">Estado del trámite</label>
            <select class="inputStyle" onchange="updateForm('tramiteEstado', this.value)">
              ${ESTADOS_TRAMITE.map(e=>`<option value="${e.id}" ${form.tramiteEstado===e.id?"selected":""}>${e.icon} ${e.label}</option>`).join("")}
            </select>
          </div>
          <div style="margin-bottom:10px;"><label class="fieldLabel">Próximo paso</label>
            <input class="inputStyle" value="${escapeHtml(form.proximoPaso)}" oninput="updateForm('proximoPaso', this.value)" />
          </div>
        ` : ""}

        <div style="margin-bottom:10px;"><label class="fieldLabel">Observaciones</label>
          <textarea class="inputStyle" rows="2" oninput="updateForm('observaciones', this.value)">${escapeHtml(form.observaciones)}</textarea>
        </div>

        ${(form.id && form.grupoId) ? `
        <div style="margin:14px 0; padding:12px; background:var(--accent-soft); border-radius:8px;">
          <div style="display:flex; align-items:flex-start; gap:8px;">
            <input type="checkbox" id="aplicar-grupo" style="margin-top:2px;" ${form.aplicarATodoElGrupo?"checked":""} onchange="toggleAplicarGrupo(this.checked)" />
            <label for="aplicar-grupo" style="font-size:13px; font-weight:600; color:var(--accent);">Aplicar estos cambios a todas las fechas de esta actividad (${actividades.filter(a=>a.grupoId===form.grupoId).length} en total)</label>
          </div>
          <div style="font-size:11px; color:var(--ink-soft); margin-top:5px; margin-left:26px;">La fecha y el programa de cada copia no se tocan — se actualiza el resto (título, sede, horario, dirección, etc.) en todas a la vez.</div>
        </div>
        ` : ""}

        ${form.id ? `
        <div style="margin:14px 0; padding-top:14px; border-top:1px solid var(--line);">
          <label class="fieldLabel">Repetir esta actividad en otra fecha puntual</label>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <input type="date" class="inputStyle" value="${nuevaFechaCopia}" oninput="nuevaFechaCopia=this.value" />
            <button type="button" onclick="duplicarEnFecha()" style="white-space:nowrap; background:var(--accent-soft); color:var(--accent); border-radius:7px; padding:0 14px; font-weight:700; font-size:13px;">+ Duplicar</button>
          </div>
          <div style="font-size:11px; color:var(--ink-soft); margin-top:5px;">Crea una copia idéntica de esta actividad en la fecha elegida, en el mismo programa.</div>
        </div>
        ` : ""}

        <div style="display:flex; justify-content:space-between; margin-top:16px;">
          ${form.id ? `<button class="navbtn" style="width:auto; color:#B3413A; border-color:#EAB9B2; padding:8px 12px;" onclick="eliminarActividad('${form.id}')">Eliminar</button>` : "<span></span>"}
          <button onclick="guardarActividad()" style="background:var(--accent); color:#fff; border-radius:8px; padding:9px 18px; font-weight:700; font-size:14px;">Guardar</button>
        </div>
      </div>
    </div>
  `;
}

function viewTareaModalHtml(){
  const t = tareaForm;
  const pr = prioridadById(t.prioridad);
  const es = estadoTareaById(t.estado);
  return `
    <div onclick="cerrarModal()" style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="position:relative; background:#fff; border-radius:14px; padding:22px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span style="font-size:11px; font-weight:700;">${pr.icon} ${pr.label}</span>
          <button onclick="cerrarModal()" style="font-size:18px;">✕</button>
        </div>
        <h2 style="font-size:18px; font-weight:700; margin:0 0 10px 0; ${t.estado==="completada"?"text-decoration:line-through;":""}">${escapeHtml(t.titulo)}</h2>
        <div style="font-size:13px; color:var(--ink-soft); display:flex; flex-direction:column; gap:5px;">
          <div>${es.icon} ${es.label}</div>
          ${t.responsable?`<div>👤 ${escapeHtml(t.responsable)}</div>`:""}
          ${t.fechaLimite?`<div class="mono">📅 ${t.fechaLimite}</div>`:""}
          ${t.observaciones?`<div style="font-style:italic;">${escapeHtml(t.observaciones)}</div>`:""}
        </div>
        <button style="width:100%; margin-top:18px; background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:9px; font-weight:700; font-size:13px;" onclick="${currentUser ? 'toggleModoEditor()' : 'abrirLogin()'}">${currentUser ? 'Activar modo editor' : 'Iniciar sesión para editar'}</button>
      </div>
    </div>
  `;
}

function formTareaModalHtml(){
  const t = tareaForm;
  // El fondo NO cierra el cuadro: se cierra solo con ✕ o al guardar.
  return `
    <div style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="background:#fff; border-radius:14px; padding:22px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h2 style="font-size:17px; font-weight:700; margin:0;">${t.id ? "Editar tarea" : "Nueva tarea"}</h2>
          <button onclick="cerrarModal()" style="font-size:18px;">✕</button>
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Tarea *</label>
          <input class="inputStyle" value="${escapeHtml(t.titulo)}" oninput="updateTareaForm('titulo', this.value)" placeholder="Ej: Firmar convenio con..." />
        </div>

        <div class="stack-mobile" style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Prioridad</label>
            <select class="inputStyle" onchange="updateTareaForm('prioridad', this.value)">
              ${PRIORIDADES.map(p=>`<option value="${p.id}" ${t.prioridad===p.id?"selected":""}>${p.icon} ${p.label}</option>`).join("")}
            </select>
          </div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Estado</label>
            <select class="inputStyle" onchange="updateTareaForm('estado', this.value)">
              ${ESTADOS_TAREA.map(e=>`<option value="${e.id}" ${t.estado===e.id?"selected":""}>${e.icon} ${e.label}</option>`).join("")}
            </select>
          </div>
        </div>

        <div class="stack-mobile" style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Responsable</label>
            <input class="inputStyle" value="${escapeHtml(t.responsable)}" oninput="updateTareaForm('responsable', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Fecha límite</label>
            <input type="date" class="inputStyle" value="${t.fechaLimite}" oninput="updateTareaForm('fechaLimite', this.value)" /></div>
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Observaciones</label>
          <textarea class="inputStyle" rows="2" oninput="updateTareaForm('observaciones', this.value)">${escapeHtml(t.observaciones)}</textarea>
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:16px;">
          ${t.id ? `<button class="navbtn" style="width:auto; color:#B3413A; border-color:#EAB9B2; padding:8px 12px;" onclick="eliminarTarea('${t.id}')">Eliminar</button>` : "<span></span>"}
          <button onclick="guardarTarea()" style="background:var(--accent); color:#fff; border-radius:8px; padding:9px 18px; font-weight:700; font-size:14px;">Guardar</button>
        </div>
      </div>
    </div>
  `;
}

/* ===================== Init ===================== */
render();
</script>
</body>
</html>
