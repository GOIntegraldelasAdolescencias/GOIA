<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agenda GOIA — Gerencia Operativa Integral de Adolescencias</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --ink:#22262B; --ink-soft:#5B6470; --paper:#F6F6F3; --paper-raised:#FFFFFF;
    --line:#DEDCD3; --accent:#2D5F5A; --accent-soft:#E4EEEC;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--paper); color:var(--ink);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{cursor:pointer; font-family:inherit; border:none; background:none;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  #app{max-width:1100px; margin:0 auto; padding:20px;}
  .navbtn{width:32px; height:32px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:14px;}
  .chip{transition:transform .12s ease;}
  .chip:hover{transform:translateY(-1px);}
  .daycell:hover{background:#FBFAF7;}
  .inputStyle{width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--line); font-size:13.5px; background:#fff; color:var(--ink);}
  .fieldLabel{font-size:11.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-container"></div>

<!-- Librería cliente de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ============================================================
   CONFIGURACIÓN DE SUPABASE — completá con tus propios valores
   (Project Settings → API → Project URL / anon public key)
   ============================================================ */
const SUPABASE_URL = "https://ijxtiyuycscgdcwdujei.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xeBJoFIP_PRF83ttj63jLw_RNjeY4O2";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===================== Configuración fija de la agenda ===================== */
const PROGRAMAS = [
  { id:"adolescencias", nombre:"Programa Adolescencias", corto:"Adolescencias", color:"#3B6EA8" },
  { id:"lazos", nombre:"Reconstruyendo Lazos", corto:"Lazos", color:"#C15C4A" },
  { id:"lideres", nombre:"Líderes Recreativos y Comunitarios", corto:"Líderes", color:"#4C8C5B" },
  { id:"coopa", nombre:"COOPA", corto:"COOPA", color:"#C79A3B" },
  { id:"bajoflores", nombre:"Talleres para Adolescentes — Bajo Flores", corto:"Bajo Flores", color:"#7A5CA8" },
  { id:"turismo", nombre:"Turismo Social", corto:"Turismo Social", color:"#2F8C86" },
];
const ESTADOS_TRAMITE = [
  { id:"completo", label:"Completo", icon:"🟢" },
  { id:"pendiente", label:"Pendiente", icon:"🟡" },
  { id:"observado", label:"Observado", icon:"🟠" },
  { id:"vencido", label:"Vencido", icon:"🔴" },
  { id:"no_corresponde", label:"No corresponde", icon:"⚪" },
  { id:"en_tramite", label:"En trámite", icon:"🔵" },
];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_SEMANA = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

/* ===================== Helpers ===================== */
const pad = n => String(n).padStart(2,"0");
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const programaById = id => PROGRAMAS.find(p=>p.id===id);
const estadoById = id => ESTADOS_TRAMITE.find(e=>e.id===id);
const emptyForm = () => ({
  id:null, titulo:"", programaId:PROGRAMAS[0].id, organizacion:"", sede:"",
  fecha:dateKey(new Date()), horaInicio:"", horaFin:"", personas:"",
  tramiteActivo:false, tramiteEstado:"pendiente", proximoPaso:"", observaciones:"",
});
const escapeHtml = s => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Conversión entre el formulario (camelCase, como usa el resto del código) y las columnas de la tabla (snake_case, como las creamos en el SQL)
function toRow(f){
  return {
    titulo: f.titulo,
    programa_id: f.programaId,
    organizacion: f.organizacion || null,
    sede: f.sede || null,
    fecha: f.fecha,
    hora_inicio: f.horaInicio || null,
    hora_fin: f.horaFin || null,
    personas: f.personas || null,
    tramite_estado: f.tramiteActivo ? f.tramiteEstado : null,
    proximo_paso: f.tramiteActivo ? (f.proximoPaso || null) : null,
    observaciones: f.observaciones || null,
  };
}
function fromRow(r){
  return {
    id: r.id,
    titulo: r.titulo || "",
    programaId: r.programa_id,
    organizacion: r.organizacion || "",
    sede: r.sede || "",
    fecha: r.fecha,
    horaInicio: r.hora_inicio ? String(r.hora_inicio).slice(0,5) : "",
    horaFin: r.hora_fin ? String(r.hora_fin).slice(0,5) : "",
    personas: r.personas || "",
    tramiteEstado: r.tramite_estado || null,
    proximoPaso: r.proximo_paso || "",
    observaciones: r.observaciones || "",
  };
}

/* ===================== Estado ===================== */
let currentUser = null;
let loginError = "";

let actividades = [];
let dataLoaded = false;
let view = "mes";
let cursor = new Date();
let selectedDay = dateKey(new Date());
let filtro = new Set(PROGRAMAS.map(p=>p.id));
let detailDay = dateKey(new Date());
let form = emptyForm();
let modalOpen = false;
let modalMode = "form"; // "form" | "view" | "login"

/* ===================== Autenticación ===================== */
sb.auth.onAuthStateChange((_event, session) => {
  currentUser = session ? session.user : null;
  renderRoot();
});
sb.auth.getSession().then(({ data }) => {
  currentUser = data.session ? data.session.user : null;
  renderRoot();
});

async function attemptLogin(email, password){
  loginError = "";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    loginError = "Email o contraseña incorrectos, o el usuario no existe.";
    renderModal();
  } else {
    modalOpen = false;
    renderModal();
  }
}
function logout(){ sb.auth.signOut(); }
function abrirLogin(){ modalMode = "login"; loginError = ""; modalOpen = true; renderModal(); }
window.__submitLogin = () => {
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-pass").value;
  attemptLogin(email, pass);
};

/* ===================== Datos: carga inicial + tiempo real ===================== */
async function cargarActividades(){
  const { data, error } = await sb.from("actividades").select("*").order("fecha", { ascending: true });
  if(error){
    console.error(error);
    alert("No se pudo conectar con la base de datos. Revisá SUPABASE_URL / SUPABASE_ANON_KEY y las políticas de la tabla.");
    return;
  }
  actividades = data.map(fromRow);
  dataLoaded = true;
  renderRoot();
}
cargarActividades();

sb.channel("actividades-realtime")
  .on("postgres_changes", { event: "*", schema: "public", table: "actividades" }, () => {
    cargarActividades();
  })
  .subscribe();

/* ===================== Acciones sobre actividades ===================== */
function toggleProgramaFiltro(id){ filtro.has(id)?filtro.delete(id):filtro.add(id); renderRoot(); }
function setSoloUno(id){ filtro = new Set([id]); renderRoot(); }
function setTodos(){ filtro = new Set(PROGRAMAS.map(p=>p.id)); renderRoot(); }
function setView(v){ view = v; renderRoot(); }
function irHoy(){ cursor = new Date(); selectedDay = dateKey(cursor); detailDay = dateKey(cursor); renderRoot(); }
function navegar(delta){
  const c = new Date(cursor);
  if(view==="mes") c.setMonth(c.getMonth()+delta);
  else if(view==="anio") c.setFullYear(c.getFullYear()+delta);
  else if(view==="dia") c.setDate(c.getDate()+delta);
  cursor = c;
  if(view==="dia") selectedDay = dateKey(c);
  renderRoot();
}
function irAMes(year, mIdx){ cursor = new Date(year, mIdx, 1); setView("mes"); }
function setDetailDay(key){ detailDay = key; renderRoot(); }

function abrirNueva(fechaKey){
  if(!currentUser){ abrirLogin(); return; }
  form = {...emptyForm(), fecha: fechaKey || dateKey(cursor)};
  modalMode = "form"; modalOpen = true; renderModal();
}
function abrirEdicion(id){
  const act = actividades.find(a=>a.id===id);
  if(!act) return;
  form = {...emptyForm(), ...act, tramiteActivo: !!act.tramiteEstado};
  modalMode = currentUser ? "form" : "view";
  modalOpen = true; renderModal();
}
function cerrarModal(){ modalOpen = false; renderModal(); }
function updateForm(field, value){ form[field] = value; }
function toggleTramite(checked){ form.tramiteActivo = checked; renderModal(); }

async function guardarActividad(){
  if(!form.titulo || !form.titulo.trim() || !form.fecha){ alert("Completá al menos el título y la fecha."); return; }
  const row = toRow(form);
  let error;
  if(form.id){
    ({ error } = await sb.from("actividades").update(row).eq("id", form.id));
  } else {
    ({ error } = await sb.from("actividades").insert(row));
  }
  if(error){
    console.error(error);
    alert("No se pudo guardar. Revisá tu conexión o que tengas sesión iniciada.");
    return;
  }
  modalOpen = false;
  form = emptyForm();
  renderModal();
  cargarActividades();
}
async function eliminarActividad(id){
  if(!confirm("¿Eliminar esta actividad?")) return;
  const { error } = await sb.from("actividades").delete().eq("id", id);
  if(error){
    console.error(error);
    alert("No se pudo eliminar.");
    return;
  }
  modalOpen = false;
  renderModal();
  cargarActividades();
}
function exportData(){
  const blob = new Blob([JSON.stringify(actividades, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `agenda-goia-${dateKey(new Date())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function importData(input){
  if(!currentUser){ input.value = ""; abrirLogin(); return; }
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error("Formato inválido");
      if(!confirm(`Se van a agregar ${data.length} actividades a la base compartida. ¿Continuar?`)) return;
      const rows = data.map(item => toRow({...emptyForm(), ...item, tramiteActivo: !!item.tramiteEstado}));
      const { error } = await sb.from("actividades").insert(rows);
      if(error){ console.error(error); alert("No se pudo importar."); return; }
      alert("Datos importados correctamente.");
      cargarActividades();
    }catch(err){
      alert("El archivo no tiene un formato válido.");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

/* ===================== Grilla ===================== */
function buildMonthGrid(year, month){
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const start = new Date(year, month, 1-startOffset);
  const cells = [];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); }
  return cells;
}
function porDia(){
  const map = {};
  for(const a of actividades){
    if(!filtro.has(a.programaId)) continue;
    if(!map[a.fecha]) map[a.fecha]=[];
    map[a.fecha].push(a);
  }
  return map;
}

/* ===================== Render raíz ===================== */
function renderRoot(){
  render();
}

/* ===================== Render principal ===================== */
function render(){
  const app = document.getElementById("app");
  const consolidado = filtro.size === PROGRAMAS.length;
  const dias = porDia();
  const today = dateKey(new Date());

  app.innerHTML = `
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:18px;">
      <div>
        <div class="mono" style="font-size:11px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase;">GOIA — Gerencia Operativa Integral de Adolescencias</div>
        <h1 style="font-size:22px; font-weight:700; margin:2px 0 0 0;">Agenda multisectorial</h1>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        ${currentUser ? `
          <span style="font-size:12px; color:var(--ink-soft);">${escapeHtml(currentUser.email||"")}</span>
          <button class="navbtn" style="width:auto; padding:0 12px; font-size:12px; font-weight:600;" onclick="logout()">Salir</button>
        ` : `
          <button class="navbtn" style="width:auto; padding:0 12px; font-size:12px; font-weight:600;" onclick="abrirLogin()">Iniciar sesión</button>
        `}
        <button class="navbtn" style="width:auto; padding:0 12px; font-size:12px; font-weight:600;" onclick="exportData()">Exportar</button>
        <label class="navbtn" style="width:auto; padding:0 12px; font-size:12px; font-weight:600; display:inline-flex; align-items:center;">
          Importar
          <input type="file" accept="application/json" style="display:none;" onchange="importData(this)" />
        </label>
        <button onclick="abrirNueva(selectedDay)" style="display:flex; align-items:center; gap:6px; background:var(--accent); color:#fff; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600;">+ Nueva actividad</button>
      </div>
    </div>

    ${!dataLoaded ? `<div style="padding:14px; color:var(--ink-soft); font-size:13px;">Sincronizando con la base de datos…</div>` : ""}

    <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <span class="mono" style="font-size:11px; letter-spacing:.08em; color:var(--ink-soft); text-transform:uppercase;">Programas</span>
        <button onclick="setTodos()" style="font-size:12px; font-weight:600; color:${consolidado?"var(--accent)":"var(--ink-soft)"}; background:${consolidado?"var(--accent-soft)":"transparent"}; border:1px solid ${consolidado?"var(--accent)":"var(--line)"}; border-radius:6px; padding:4px 10px;">Vista consolidada</button>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        ${PROGRAMAS.map(p=>{
          const activo = filtro.has(p.id);
          return `<button class="chip" onclick="toggleProgramaFiltro('${p.id}')" ondblclick="setSoloUno('${p.id}')" title="Clic: mostrar/ocultar · Doble clic: ver solo este programa"
            style="display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:500;
            border:1.5px solid ${activo?p.color:"var(--line)"}; background:${activo?p.color+"1A":"#fff"}; color:${activo?p.color:"var(--ink-soft)"};">
            <span style="width:8px; height:8px; border-radius:50%; background:${p.color}; flex-shrink:0;"></span>${p.corto}
          </button>`;
        }).join("")}
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="navbtn" onclick="navegar(-1)">‹</button>
        <div class="mono" style="font-size:15px; font-weight:600; min-width:170px; text-align:center;">
          ${view==="mes" ? `${MESES[cursor.getMonth()]} ${cursor.getFullYear()}` : ""}
          ${view==="anio" ? `${cursor.getFullYear()}` : ""}
          ${view==="dia" ? `${pad(cursor.getDate())} de ${MESES[cursor.getMonth()]}, ${cursor.getFullYear()}` : ""}
        </div>
        <button class="navbtn" onclick="navegar(1)">›</button>
        <button class="navbtn" style="width:auto; padding:0 12px; font-size:12px; font-weight:600;" onclick="irHoy()">Hoy</button>
      </div>
      <div style="display:flex; gap:4px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:3px;">
        ${[["anio","Año"],["mes","Mes"],["dia","Día"]].map(([id,label])=>`
          <button onclick="setView('${id}')" style="padding:6px 12px; border-radius:6px; background:${view===id?"var(--ink)":"transparent"}; color:${view===id?"#fff":"var(--ink-soft)"}; font-size:13px; font-weight:600;">${label}</button>
        `).join("")}
      </div>
    </div>

    <div id="view-body"></div>

    ${(dataLoaded && actividades.length===0) ? `<div style="margin-top:16px; font-size:13px; color:var(--ink-soft);">Todavía no hay actividades cargadas. Usá "Nueva actividad" para empezar, o "Importar" si ya tenés un respaldo.</div>` : ""}
    <div style="margin-top:24px; font-size:11px; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:10px;">
      Los datos se guardan en una base compartida: lo que cargue cualquier persona con acceso se ve al instante desde cualquier dispositivo.
    </div>
  `;

  const body = document.getElementById("view-body");
  if(view==="mes") body.innerHTML = renderMes(dias, today);
  else if(view==="dia") body.innerHTML = renderDia(dias);
  else body.innerHTML = renderAnio(dias);
}

function renderMes(dias, today){
  const grid = buildMonthGrid(cursor.getFullYear(), cursor.getMonth());
  const items = dias[detailDay] || [];
  return `
    <div style="display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;">
      <div style="flex:1 1 560px; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; overflow:hidden;">
        <div style="display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line);">
          ${DIAS_SEMANA.map(d=>`<div class="mono" style="padding:8px 6px; font-size:11px; color:var(--ink-soft); text-align:center; text-transform:uppercase;">${d}</div>`).join("")}
        </div>
        <div style="display:grid; grid-template-columns:repeat(7,1fr);">
          ${grid.map(d=>{
            const key = dateKey(d);
            const inMonth = d.getMonth()===cursor.getMonth();
            const dayItems = dias[key] || [];
            const isToday = key===today;
            const isSelected = key===detailDay;
            return `<div class="daycell" onclick="setDetailDay('${key}')" style="min-height:84px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; opacity:${inMonth?1:0.35}; background:${isSelected?"var(--accent-soft)":"transparent"}; cursor:pointer;">
              <div class="mono" style="font-size:12px; font-weight:${isToday?700:500}; color:${isToday?"#fff":"var(--ink)"}; background:${isToday?"var(--accent)":"transparent"}; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;">${d.getDate()}</div>
              <div style="margin-top:4px; display:flex; flex-direction:column; gap:2px;">
                ${dayItems.slice(0,3).map(a=>{
                  const p = programaById(a.programaId);
                  return `<div onclick="event.stopPropagation(); abrirEdicion('${a.id}')" title="${escapeHtml(a.titulo)}" style="font-size:10.5px; padding:1px 5px; border-radius:4px; background:${p.color}26; color:${p.color}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;">${escapeHtml(a.titulo)}</div>`;
                }).join("")}
                ${dayItems.length>3 ? `<div style="font-size:10px; color:var(--ink-soft);">+${dayItems.length-3} más</div>` : ""}
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>
      <div style="flex:1 1 260px; min-width:260px; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:14px;">
        <div class="mono" style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px;">
          ${detailDay ? `${parseKey(detailDay).getDate()} de ${MESES[parseKey(detailDay).getMonth()]}` : "Seleccioná un día"}
        </div>
        ${items.length===0 ? `<div style="font-size:13px; color:var(--ink-soft); margin-bottom:10px;">Sin actividades registradas.</div>` : ""}
        ${items.map(a=>actividadCardHtml(a,false)).join("")}
        <button class="navbtn" style="width:100%; padding:8px; font-size:13px; font-weight:600; margin-top:6px;" onclick="abrirNueva('${detailDay}')">+ Agregar actividad este día</button>
      </div>
    </div>
  `;
}

function renderDia(dias){
  const items = (dias[dateKey(cursor)] || []).slice().sort((a,b)=>(a.horaInicio||"").localeCompare(b.horaInicio||""));
  return `
    <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:16px; max-width:640px;">
      ${items.length===0 ? `<div style="font-size:14px; color:var(--ink-soft);">No hay actividades registradas para este día.</div>` : ""}
      ${items.map(a=>actividadCardHtml(a,true)).join("")}
      <button class="navbtn" style="width:100%; padding:10px; font-size:13px; font-weight:600; margin-top:8px;" onclick="abrirNueva('${dateKey(cursor)}')">+ Agregar actividad</button>
    </div>
  `;
}

function renderAnio(dias){
  return `
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;">
      ${MESES.map((nombreMes, mIdx)=>{
        const grid = buildMonthGrid(cursor.getFullYear(), mIdx);
        return `<div onclick="irAMes(${cursor.getFullYear()},${mIdx})" style="background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:10px; cursor:pointer;">
          <div class="mono" style="font-size:12px; font-weight:700; margin-bottom:6px;">${nombreMes}</div>
          <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:2px;">
            ${grid.map(d=>{
              const key = dateKey(d);
              const inMonth = d.getMonth()===mIdx;
              const items = dias[key] || [];
              const colores = [...new Set(items.map(a=>a.programaId))].slice(0,3).map(id=>programaById(id).color);
              return `<div style="aspect-ratio:1; border-radius:3px; font-size:8.5px; display:flex; align-items:center; justify-content:center; opacity:${inMonth?1:0.25};
                background:${colores.length?`linear-gradient(90deg, ${colores.join(",")})`:"#F1F0EB"}; color:${colores.length?"#fff":"var(--ink-soft)"}; font-weight:${colores.length?700:400};">${d.getDate()}</div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function actividadCardHtml(a, expanded){
  const p = programaById(a.programaId);
  const estado = a.tramiteEstado ? estadoById(a.tramiteEstado) : null;
  return `
    <div onclick="abrirEdicion('${a.id}')" style="border:1px solid ${p.color}55; border-left:4px solid ${p.color}; border-radius:8px; padding:8px 10px; margin-bottom:8px; cursor:pointer; background:#fff;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px;">
        <div style="font-size:13.5px; font-weight:700;">${escapeHtml(a.titulo)}</div>
        ${currentUser ? `<button onclick="event.stopPropagation(); eliminarActividad('${a.id}')" style="color:#B3413A; flex-shrink:0; font-size:12px;">✕</button>` : ""}
      </div>
      <div style="font-size:11px; color:${p.color}; font-weight:600; margin-top:2px;">${p.corto}</div>
      ${(a.horaInicio||a.horaFin) ? `<div class="mono" style="font-size:11.5px; color:var(--ink-soft); margin-top:3px;">${a.horaInicio||"—"}${a.horaFin?` a ${a.horaFin}`:""}</div>` : ""}
      ${a.organizacion ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">🏢 ${escapeHtml(a.organizacion)}</div>` : ""}
      ${a.sede ? `<div style="font-size:11.5px; color:var(--ink-soft);">📍 ${escapeHtml(a.sede)}</div>` : ""}
      ${(a.personas && expanded) ? `<div style="font-size:11.5px; color:var(--ink-soft);">👤 ${escapeHtml(a.personas)}</div>` : ""}
      ${estado ? `<div style="font-size:11px; margin-top:4px;">${estado.icon} ${estado.label}${a.proximoPaso?` — ${escapeHtml(a.proximoPaso)}`:""}</div>` : ""}
      ${(expanded && a.observaciones) ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-style:italic;">${escapeHtml(a.observaciones)}</div>` : ""}
    </div>
  `;
}

/* ===================== Modal ===================== */
function renderModal(){
  const mc = document.getElementById("modal-container");
  if(!modalOpen){ mc.innerHTML = ""; return; }
  if(modalMode === "login"){ mc.innerHTML = loginModalHtml(); return; }
  if(modalMode === "view"){ mc.innerHTML = viewModalHtml(); return; }
  mc.innerHTML = formModalHtml();
}

function loginModalHtml(){
  return `
    <div onclick="cerrarModal()" style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="background:#fff; border-radius:14px; padding:24px; width:100%; max-width:360px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h2 style="font-size:17px; font-weight:700; margin:0;">Iniciar sesión</h2>
          <button onclick="cerrarModal()" style="font-size:18px;">✕</button>
        </div>
        <div style="margin-bottom:10px;"><label class="fieldLabel">Email</label>
          <input id="login-email" type="email" class="inputStyle" placeholder="tu-usuario@equipo" /></div>
        <div style="margin-bottom:14px;"><label class="fieldLabel">Contraseña</label>
          <input id="login-pass" type="password" class="inputStyle" onkeydown="if(event.key==='Enter') __submitLogin()" /></div>
        ${loginError ? `<div style="color:#B3413A; font-size:12.5px; margin-bottom:10px;">${escapeHtml(loginError)}</div>` : ""}
        <button style="width:100%; background:var(--accent); color:#fff; border-radius:8px; padding:10px; font-weight:700; font-size:14px;" onclick="__submitLogin()">Entrar</button>
      </div>
    </div>
  `;
}

function viewModalHtml(){
  const p = programaById(form.programaId);
  const estado = form.tramiteEstado ? estadoById(form.tramiteEstado) : null;
  return `
    <div onclick="cerrarModal()" style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="background:#fff; border-radius:14px; padding:22px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span style="font-size:11px; font-weight:700; color:${p.color}; text-transform:uppercase;">${p.corto}</span>
          <button onclick="cerrarModal()" style="font-size:18px;">✕</button>
        </div>
        <h2 style="font-size:18px; font-weight:700; margin:0 0 10px 0;">${escapeHtml(form.titulo)}</h2>
        <div style="font-size:13px; color:var(--ink-soft); display:flex; flex-direction:column; gap:5px;">
          <div class="mono">${form.fecha}${form.horaInicio?` · ${form.horaInicio}${form.horaFin?` a ${form.horaFin}`:""}`:""}</div>
          ${form.organizacion?`<div>🏢 ${escapeHtml(form.organizacion)}</div>`:""}
          ${form.sede?`<div>📍 ${escapeHtml(form.sede)}</div>`:""}
          ${form.personas?`<div>👤 ${escapeHtml(form.personas)}</div>`:""}
          ${estado?`<div>${estado.icon} ${estado.label}${form.proximoPaso?` — ${escapeHtml(form.proximoPaso)}`:""}</div>`:""}
          ${form.observaciones?`<div style="font-style:italic;">${escapeHtml(form.observaciones)}</div>`:""}
        </div>
        <button style="width:100%; margin-top:18px; background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:9px; font-weight:700; font-size:13px;" onclick="abrirLogin()">Iniciar sesión para editar</button>
      </div>
    </div>
  `;
}

function formModalHtml(){
  return `
    <div onclick="cerrarModal()" style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="background:#fff; border-radius:14px; padding:22px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h2 style="font-size:17px; font-weight:700; margin:0;">${form.id ? "Editar actividad" : "Nueva actividad"}</h2>
          <button onclick="cerrarModal()" style="font-size:18px;">✕</button>
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Actividad *</label>
          <input class="inputStyle" value="${escapeHtml(form.titulo)}" oninput="updateForm('titulo', this.value)" placeholder="Ej: Taller de fotografía" />
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Programa *</label>
          <select class="inputStyle" onchange="updateForm('programaId', this.value)">
            ${PROGRAMAS.map(p=>`<option value="${p.id}" ${form.programaId===p.id?"selected":""}>${p.nombre}</option>`).join("")}
          </select>
        </div>

        <div style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Organización</label>
            <input class="inputStyle" value="${escapeHtml(form.organizacion)}" oninput="updateForm('organizacion', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Sede</label>
            <input class="inputStyle" value="${escapeHtml(form.sede)}" oninput="updateForm('sede', this.value)" /></div>
        </div>

        <div style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Fecha *</label>
            <input type="date" class="inputStyle" value="${form.fecha}" oninput="updateForm('fecha', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Hora inicio</label>
            <input type="time" class="inputStyle" value="${form.horaInicio}" oninput="updateForm('horaInicio', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Hora fin</label>
            <input type="time" class="inputStyle" value="${form.horaFin}" oninput="updateForm('horaFin', this.value)" /></div>
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Personas (responsable / referente)</label>
          <input class="inputStyle" value="${escapeHtml(form.personas)}" oninput="updateForm('personas', this.value)" />
        </div>

        <div style="display:flex; align-items:center; gap:8px; margin:10px 0;">
          <input type="checkbox" id="tramite" ${form.tramiteActivo?"checked":""} onchange="toggleTramite(this.checked)" />
          <label for="tramite" style="font-size:13px; font-weight:600;">Incluir seguimiento de trámite (opcional)</label>
        </div>

        ${form.tramiteActivo ? `
          <div style="margin-bottom:10px;"><label class="fieldLabel">Estado del trámite</label>
            <select class="inputStyle" onchange="updateForm('tramiteEstado', this.value)">
              ${ESTADOS_TRAMITE.map(e=>`<option value="${e.id}" ${form.tramiteEstado===e.id?"selected":""}>${e.icon} ${e.label}</option>`).join("")}
            </select>
          </div>
          <div style="margin-bottom:10px;"><label class="fieldLabel">Próximo paso</label>
            <input class="inputStyle" value="${escapeHtml(form.proximoPaso)}" oninput="updateForm('proximoPaso', this.value)" />
          </div>
        ` : ""}

        <div style="margin-bottom:10px;"><label class="fieldLabel">Observaciones</label>
          <textarea class="inputStyle" rows="2" oninput="updateForm('observaciones', this.value)">${escapeHtml(form.observaciones)}</textarea>
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:16px;">
          ${form.id ? `<button class="navbtn" style="width:auto; color:#B3413A; border-color:#EAB9B2; padding:8px 12px;" onclick="eliminarActividad('${form.id}')">Eliminar</button>` : "<span></span>"}
          <button onclick="guardarActividad()" style="background:var(--accent); color:#fff; border-radius:8px; padding:9px 18px; font-weight:700; font-size:14px;">Guardar</button>
        </div>
      </div>
    </div>
  `;
}

/* ===================== Init ===================== */
render();
</script>
</body>
</html>
