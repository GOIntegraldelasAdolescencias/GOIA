<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agenda GOIA — Gerencia Operativa Integral de Adolescencias</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --ink:#22262B; --ink-soft:#5B6470; --paper:#F6F6F3; --paper-raised:#FFFFFF;
    --line:#DEDCD3; --accent:#2D5F5A; --accent-soft:#E4EEEC;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--paper); color:var(--ink);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{cursor:pointer; font-family:inherit; border:none; background:none;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  #app{max-width:1100px; margin:0 auto; padding:20px;}
  .navbtn{width:32px; height:32px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:14px;}
  .chip{transition:transform .12s ease;}
  .chip:hover{transform:translateY(-1px);}
  .daycell:hover{background:#FBFAF7;}
  .inputStyle{width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--line); font-size:13.5px; background:#fff; color:var(--ink);}
  .fieldLabel{font-size:11.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}

  @media (max-width: 680px){
    #app{ padding:12px; }
    #app h1{ font-size:18px !important; }
    .navbtn{ font-size:11px !important; padding-left:8px !important; padding-right:8px !important; }
    .daycell{ height:52px !important; padding:3px !important; }
  }
  @media (max-width: 480px){
    .stack-mobile{ flex-direction:column !important; }
    #modal-container > div > div{ padding:16px !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-container"></div>

<!-- Librería cliente de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ============================================================
   CONFIGURACIÓN DE SUPABASE — completá con tus propios valores
   (Project Settings → API → Project URL / anon public key)
   ============================================================ */
const SUPABASE_URL = "https://ijxtiyuycscgdcwdujei.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xeBJoFIP_PRF83ttj63jLw_RNjeY4O2";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,     // guarda la sesión en el navegador entre visitas
    autoRefreshToken: true,   // renueva el acceso sola, sin desloguear
    detectSessionInUrl: false,
  }
});

/* ===================== Configuración fija de la agenda ===================== */
const PROGRAMAS = [
  { id:"adolescencias", nombre:"Programa Adolescencias", corto:"Adolescencias", sigla:"ADOL", color:"#3B6EA8" },
  { id:"lazos", nombre:"Reconstruyendo Lazos", corto:"Lazos", sigla:"LAZOS", color:"#C15C4A" },
  { id:"lideres", nombre:"Líderes Recreativos y Comunitarios", corto:"Líderes", sigla:"LÍDERES", color:"#4C8C5B" },
  { id:"coopa", nombre:"COOPA", corto:"COOPA", sigla:"COOPA", color:"#C79A3B" },
  { id:"bajoflores", nombre:"Talleres para Adolescentes — Bajo Flores", corto:"Bajo Flores", sigla:"FLORES", color:"#7A5CA8" },
  { id:"turismo", nombre:"Turismo Social", corto:"Turismo Social", sigla:"TURISMO", color:"#2F8C86" },
];
const ESTADOS_TRAMITE = [
  { id:"completo", label:"Completo", icon:"🟢" },
  { id:"pendiente", label:"Pendiente", icon:"🟡" },
  { id:"observado", label:"Observado", icon:"🟠" },
  { id:"vencido", label:"Vencido", icon:"🔴" },
  { id:"no_corresponde", label:"No corresponde", icon:"⚪" },
  { id:"en_tramite", label:"En trámite", icon:"🔵" },
];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_SEMANA = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const TIPOS_REPETICION = [
  { id:"unica", label:"Evento único" },
  { id:"normal", label:"Jornada normal" },
];
function categoriaTipo(tipo){
  return (!tipo || tipo === "unica") ? "unica" : "normal";
}
const PRIORIDADES = [
  { id:"urgente", label:"Urgente", icon:"🔴", color:"#C24A3D" },
  { id:"alta", label:"Prioridad alta", icon:"🟠", color:"#C79A3B" },
  { id:"media", label:"Prioridad media", icon:"🟡", color:"#D8B94A" },
  { id:"baja", label:"Prioridad baja", icon:"🟢", color:"#4C8C5B" },
];
const ESTADOS_TAREA = [
  { id:"pendiente", label:"Pendiente", icon:"🟡" },
  { id:"en_curso", label:"En curso", icon:"🔵" },
  { id:"completada", label:"Completada", icon:"🟢" },
];
const prioridadById = id => PRIORIDADES.find(p=>p.id===id) || PRIORIDADES[2];
const estadoTareaById = id => ESTADOS_TAREA.find(e=>e.id===id) || ESTADOS_TAREA[0];

/* ===================== Helpers ===================== */
const pad = n => String(n).padStart(2,"0");
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const programaById = id => PROGRAMAS.find(p=>p.id===id);
const estadoById = id => ESTADOS_TRAMITE.find(e=>e.id===id);
const emptyForm = () => ({
  id:null, titulo:"", programaId:PROGRAMAS[0].id, programaIds:[PROGRAMAS[0].id], organizacion:"", sede:"", direcciones:[""],
  fecha:dateKey(new Date()), fechaHasta:"", horaInicio:"", horaFin:"", personas:"",
  tramiteActivo:false, tramiteEstado:"pendiente", proximoPaso:"", observaciones:"",
  repetir:"none", repetirHasta:"", grupoId:null, esCampamento:false,
  tipoRepeticion:"unica",
  fechasSueltasActivo:false, fechasSueltas:[],
});
function generarFechasRepeticion(inicioStr, hastaStr, tipo){
  const inicio = parseKey(inicioStr);
  const hasta = parseKey(hastaStr);
  const fechas = [];
  const cursor = new Date(inicio);
  let iter = 0;
  while(cursor <= hasta && iter < 500){
    fechas.push(dateKey(cursor));
    if(tipo === "diario") cursor.setDate(cursor.getDate()+1);
    else if(tipo === "semanal") cursor.setDate(cursor.getDate()+7);
    else if(tipo === "mensual") cursor.setMonth(cursor.getMonth()+1);
    else if(tipo === "anual") cursor.setFullYear(cursor.getFullYear()+1);
    else break;
    iter++;
  }
  return fechas;
}
function uidGrupo(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("g-"+Math.random().toString(36).slice(2)+Date.now());
}
function onRepetirChange(value){
  form.repetir = value;
  if(value !== "none"){ form.esCampamento = false; form.fechasSueltasActivo = false; }
  renderModal();
}
function toggleProgramaForm(id, checked){
  if(checked){ if(!form.programaIds.includes(id)) form.programaIds.push(id); }
  else { form.programaIds = form.programaIds.filter(x=>x!==id); }
  renderModal();
}
function toggleCampamento(checked){
  form.esCampamento = checked;
  if(checked){ form.repetir = "none"; form.fechasSueltasActivo = false; }
  renderModal();
}
function toggleFechasSueltas(checked){
  form.fechasSueltasActivo = checked;
  if(checked){
    form.esCampamento = false;
    form.repetir = "none";
    if(!form.fechasSueltas || form.fechasSueltas.length===0) form.fechasSueltas = [form.fecha || dateKey(new Date())];
  }
  renderModal();
}
function agregarFechaSuelta(){ form.fechasSueltas.push(form.fecha || dateKey(new Date())); renderModal(); }
function quitarFechaSuelta(i){
  form.fechasSueltas.splice(i,1);
  if(form.fechasSueltas.length===0) form.fechasSueltas.push(dateKey(new Date()));
  renderModal();
}
function actualizarFechaSuelta(i, value){ form.fechasSueltas[i] = value; }
const escapeHtml = s => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iniciales = titulo => {
  const palabras = (titulo||"").trim().split(/\s+/).filter(Boolean);
  if(palabras.length>=2) return (palabras[0][0]+palabras[1][0]).toUpperCase();
  return (titulo||"").slice(0,2).toUpperCase();
};
const inicioSemana = d => { const c=new Date(d); const offset=(c.getDay()+6)%7; c.setDate(c.getDate()-offset); return c; };

// Conversión entre el formulario (camelCase, como usa el resto del código) y las columnas de la tabla (snake_case, como las creamos en el SQL)
function toRow(f){
  return {
    titulo: f.titulo,
    programa_id: f.programaId,
    organizacion: f.organizacion || null,
    sede: f.sede || null,
    direcciones: (f.direcciones||[]).map(d=>d.trim()).filter(Boolean),
    fecha: f.fecha,
    hora_inicio: f.horaInicio || null,
    hora_fin: f.horaFin || null,
    personas: f.personas || null,
    tramite_estado: f.tramiteActivo ? f.tramiteEstado : null,
    proximo_paso: f.tramiteActivo ? (f.proximoPaso || null) : null,
    observaciones: f.observaciones || null,
    tipo_repeticion: f.tipoRepeticion || "unica",
  };
}
function fromRow(r){
  return {
    id: r.id,
    titulo: r.titulo || "",
    programaId: r.programa_id,
    organizacion: r.organizacion || "",
    sede: r.sede || "",
    direcciones: (r.direcciones && r.direcciones.length) ? r.direcciones : (r.direccion ? [r.direccion] : []),
    fecha: r.fecha,
    horaInicio: r.hora_inicio ? String(r.hora_inicio).slice(0,5) : "",
    horaFin: r.hora_fin ? String(r.hora_fin).slice(0,5) : "",
    personas: r.personas || "",
    tramiteEstado: r.tramite_estado || null,
    proximoPaso: r.proximo_paso || "",
    observaciones: r.observaciones || "",
    grupoId: r.grupo_id || null,
    tipoRepeticion: r.tipo_repeticion || "unica",
  };
}

const emptyTareaForm = () => ({
  id:null, titulo:"", responsable:"", prioridad:"media", estado:"pendiente", fechaLimite:"", observaciones:"",
});
function toTareaRow(t){
  return {
    titulo: t.titulo,
    responsable: t.responsable || null,
    prioridad: t.prioridad || "media",
    estado: t.estado || "pendiente",
    fecha_limite: t.fechaLimite || null,
    observaciones: t.observaciones || null,
  };
}
function fromTareaRow(r){
  return {
    id: r.id,
    titulo: r.titulo || "",
    responsable: r.responsable || "",
    prioridad: r.prioridad || "media",
    estado: r.estado || "pendiente",
    fechaLimite: r.fecha_limite || "",
    observaciones: r.observaciones || "",
  };
}

/* ===================== Estado ===================== */
let currentUser = null;
let loginError = "";

let actividades = [];
let dataLoaded = false;
let view = "mes";
let cursor = new Date();
let selectedDay = dateKey(new Date());
let filtro = new Set(PROGRAMAS.map(p=>p.id));
let filtroTipo = new Set(TIPOS_REPETICION.map(t=>t.id));
let detailDay = dateKey(new Date());
let form = emptyForm();
let modalOpen = false;
let modalMode = "form"; // "form" | "view" | "login"
let modalKind = "actividad"; // "actividad" | "tarea"
let nuevaFechaCopia = "";

let tareas = [];
let tareasLoaded = false;
let tareaForm = emptyTareaForm();
let seccion = "agenda"; // "agenda" | "tareas"

/* ===================== Autenticación ===================== */
sb.auth.onAuthStateChange((_event, session) => {
  currentUser = session ? session.user : null;
  renderRoot();
});
sb.auth.getSession().then(({ data }) => {
  currentUser = data.session ? data.session.user : null;
  renderRoot();
});

async function attemptLogin(email, password){
  loginError = "";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    loginError = "Email o contraseña incorrectos, o el usuario no existe.";
    renderModal();
  } else {
    modalOpen = false;
    renderModal();
  }
}
function logout(){ sb.auth.signOut(); }
function abrirLogin(){ modalMode = "login"; loginError = ""; modalOpen = true; renderModal(); }
window.__submitLogin = () => {
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-pass").value;
  attemptLogin(email, pass);
};

/* ===================== Datos: carga inicial + tiempo real ===================== */
async function cargarActividades(){
  const { data, error } = await sb.from("actividades").select("*").order("fecha", { ascending: true });
  if(error){
    console.error(error);
    alert("No se pudo conectar con la base de datos. Revisá SUPABASE_URL / SUPABASE_ANON_KEY y las políticas de la tabla.");
    return;
  }
  actividades = data.map(fromRow);
  dataLoaded = true;
  renderRoot();
}
cargarActividades();

sb.channel("actividades-realtime")
  .on("postgres_changes", { event: "*", schema: "public", table: "actividades" }, () => {
    cargarActividades();
  })
  .subscribe();

async function cargarTareas(){
  const { data, error } = await sb.from("tareas").select("*").order("created_at", { ascending: true });
  if(error){
    console.error(error);
    return;
  }
  tareas = data.map(fromTareaRow);
  tareasLoaded = true;
  renderRoot();
}
cargarTareas();

sb.channel("tareas-realtime")
  .on("postgres_changes", { event: "*", schema: "public", table: "tareas" }, () => {
    cargarTareas();
  })
  .subscribe();

function setSeccion(s){ seccion = s; renderRoot(); }

/* ===================== Acciones sobre actividades ===================== */
function toggleProgramaFiltro(id){ filtro.has(id)?filtro.delete(id):filtro.add(id); renderRoot(); }
function setSoloUno(id){ filtro = new Set([id]); renderRoot(); }
function setTodos(){ filtro = new Set(PROGRAMAS.map(p=>p.id)); renderRoot(); }
function toggleTipoFiltro(id){ filtroTipo.has(id)?filtroTipo.delete(id):filtroTipo.add(id); renderRoot(); }
function setSoloUnTipo(id){ filtroTipo = new Set([id]); renderRoot(); }
function setTodosTipos(){ filtroTipo = new Set(TIPOS_REPETICION.map(t=>t.id)); renderRoot(); }
function setView(v){ view = v; renderRoot(); }
function irHoy(){ cursor = new Date(); selectedDay = dateKey(cursor); detailDay = dateKey(cursor); renderRoot(); }
function navegar(delta){
  const c = new Date(cursor);
  if(view==="mes") c.setMonth(c.getMonth()+delta);
  else if(view==="anio") c.setFullYear(c.getFullYear()+delta);
  else if(view==="semana") c.setDate(c.getDate()+delta*7);
  else if(view==="dia") c.setDate(c.getDate()+delta);
  cursor = c;
  if(view==="dia") selectedDay = dateKey(c);
  renderRoot();
}
function irAMes(year, mIdx){ cursor = new Date(year, mIdx, 1); setView("mes"); }
function etiquetaSemana(cursorDate){
  const inicio = inicioSemana(cursorDate);
  const fin = new Date(inicio); fin.setDate(inicio.getDate()+6);
  if(inicio.getMonth()===fin.getMonth()){
    return `${inicio.getDate()} al ${fin.getDate()} de ${MESES[inicio.getMonth()]} ${inicio.getFullYear()}`;
  }
  return `${inicio.getDate()} ${MESES[inicio.getMonth()].slice(0,3)} – ${fin.getDate()} ${MESES[fin.getMonth()].slice(0,3)} ${fin.getFullYear()}`;
}
function setDetailDay(key){ detailDay = key; renderRoot(); }

function abrirNueva(fechaKey){
  if(!currentUser){ abrirLogin(); return; }
  form = {...emptyForm(), fecha: fechaKey || dateKey(cursor)};
  modalKind = "actividad"; modalMode = "form"; modalOpen = true; renderModal();
}
function abrirEdicion(id){
  const act = actividades.find(a=>a.id===id);
  if(!act) return;
  form = {...emptyForm(), ...act, direcciones: (act.direcciones&&act.direcciones.length)?act.direcciones:[""], tramiteActivo: !!act.tramiteEstado};
  nuevaFechaCopia = "";
  modalKind = "actividad";
  modalMode = currentUser ? "form" : "view";
  modalOpen = true; renderModal();
}
function agregarDireccion(){ form.direcciones.push(""); renderModal(); }
function quitarDireccion(i){
  form.direcciones.splice(i,1);
  if(form.direcciones.length===0) form.direcciones.push("");
  renderModal();
}
function actualizarDireccion(i, value){ form.direcciones[i] = value; }
let grupoMiembros = [];
function abrirGrupoIds(idsStr){
  const ids = idsStr.split(",");
  const miembros = ids.map(id => actividades.find(a=>a.id===id)).filter(Boolean);
  if(miembros.length===0) return;
  if(miembros.length===1){ abrirEdicion(miembros[0].id); return; }
  grupoMiembros = miembros;
  modalKind = "grupo"; modalMode = "view"; modalOpen = true; renderModal();
}

function cerrarModal(){ modalOpen = false; renderModal(); }
function updateForm(field, value){ form[field] = value; }
function setTipoRepeticion(value){ form.tipoRepeticion = value; renderModal(); }
function toggleTramite(checked){ form.tramiteActivo = checked; renderModal(); }

async function guardarActividad(){
  if(!form.titulo || !form.titulo.trim()){ alert("Completá al menos el título."); return; }
  if(!form.fecha){ alert("Elegí una fecha."); return; }

  if(!form.id){
    // Actividad nueva: puede expandirse por repetición y/o por varios programas a la vez
    if(!form.programaIds || form.programaIds.length===0){ alert("Elegí al menos un programa."); return; }
    let fechas = [form.fecha];
    if(form.fechasSueltasActivo){
      fechas = (form.fechasSueltas||[]).filter(Boolean);
      if(fechas.length===0){ alert("Agregá al menos una fecha."); return; }
    } else if(form.repetir && form.repetir !== "none"){
      if(!form.repetirHasta){ alert("Elegí hasta qué fecha se repite."); return; }
      fechas = generarFechasRepeticion(form.fecha, form.repetirHasta, form.repetir);
      if(fechas.length===0){ alert("La fecha \"hasta\" tiene que ser posterior a la fecha de inicio."); return; }
    }

    const grupoId = (fechas.length>1 || form.programaIds.length>1) ? uidGrupo() : null;
    const base = toRow(form);
    const filas = [];
    for(const pid of form.programaIds){
      for(const f of fechas){
        filas.push({ ...base, programa_id: pid, fecha: f, grupo_id: grupoId });
      }
    }
    const { error } = await sb.from("actividades").insert(filas);
    if(error){
      console.error(error);
      alert("No se pudo guardar. Revisá tu conexión o que tengas sesión iniciada.");
      return;
    }
    modalOpen = false;
    form = emptyForm();
    renderModal();
    cargarActividades();
    return;
  }

  // Edición de una actividad ya existente (una sola fila)
  const row = toRow(form);
  const { error } = await sb.from("actividades").update(row).eq("id", form.id);
  if(error){
    console.error(error);
    alert("No se pudo guardar. Revisá tu conexión o que tengas sesión iniciada.");
    return;
  }
  modalOpen = false;
  form = emptyForm();
  renderModal();
  cargarActividades();
}
async function duplicarEnFecha(){
  if(!nuevaFechaCopia){ alert("Elegí una fecha para la copia."); return; }
  let grupoId = form.grupoId;
  if(!grupoId){
    grupoId = uidGrupo();
    const { error: errUp } = await sb.from("actividades").update({ grupo_id: grupoId }).eq("id", form.id);
    if(errUp){ console.error(errUp); alert("No se pudo preparar la actividad original."); return; }
    form.grupoId = grupoId;
  }
  const base = toRow(form);
  const nuevaFila = { ...base, programa_id: form.programaId, fecha: nuevaFechaCopia, grupo_id: grupoId };
  const { error } = await sb.from("actividades").insert(nuevaFila);
  if(error){ console.error(error); alert("No se pudo crear la copia."); return; }
  const fechaCreada = nuevaFechaCopia;
  nuevaFechaCopia = "";
  cargarActividades();
  renderModal();
  alert(`Copia creada el ${fechaCreada}.`);
}

async function eliminarActividad(id){
  const act = actividades.find(a=>a.id===id);
  if(!confirm("¿Eliminar esta actividad?")) return;
  if(act && act.grupoId){
    const borrarGrupo = confirm("Esta actividad es parte de un grupo (por repetición y/o varios programas). Aceptar: borrar TODAS las copias del grupo. Cancelar: borrar solo esta.");
    if(borrarGrupo){
      const { error } = await sb.from("actividades").delete().eq("grupo_id", act.grupoId);
      if(error){ console.error(error); alert("No se pudo eliminar el grupo."); return; }
      modalOpen = false; renderModal(); cargarActividades();
      return;
    }
  }
  const { error } = await sb.from("actividades").delete().eq("id", id);
  if(error){
    console.error(error);
    alert("No se pudo eliminar.");
    return;
  }
  modalOpen = false;
  renderModal();
  cargarActividades();
}
function abrirNuevaTarea(){
  if(!currentUser){ abrirLogin(); return; }
  tareaForm = emptyTareaForm();
  modalKind = "tarea"; modalMode = "form"; modalOpen = true; renderModal();
}
function abrirEdicionTarea(id){
  const t = tareas.find(x=>x.id===id);
  if(!t) return;
  tareaForm = {...t};
  modalKind = "tarea";
  modalMode = currentUser ? "form" : "view";
  modalOpen = true; renderModal();
}
function updateTareaForm(field, value){ tareaForm[field] = value; }
async function guardarTarea(){
  if(!tareaForm.titulo || !tareaForm.titulo.trim()){ alert("Completá al menos el título de la tarea."); return; }
  const row = toTareaRow(tareaForm);
  let error;
  if(tareaForm.id){
    ({ error } = await sb.from("tareas").update(row).eq("id", tareaForm.id));
  } else {
    ({ error } = await sb.from("tareas").insert(row));
  }
  if(error){
    console.error(error);
    alert("No se pudo guardar la tarea. Revisá tu conexión o que tengas sesión iniciada.");
    return;
  }
  modalOpen = false;

}

  const { error } = await sb.from("tareas").delete().eq("id", id);

function exportData(){
  const blob = new Blob([JSON.stringify(actividades, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `agenda-goia-${dateKey(new Date())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function importData(input){
  if(!currentUser){ input.value = ""; abrirLogin(); return; }
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error("Formato inválido");
      if(!confirm(`Se van a agregar ${data.length} actividades a la base compartida. ¿Continuar?`)) return;
      const rows = data.map(item => toRow({...emptyForm(), ...item, tramiteActivo: !!item.tramiteEstado}));
      const { error } = await sb.from("actividades").insert(rows);
      if(error){ console.error(error); alert("No se pudo importar."); return; }
      alert("Datos importados correctamente.");
      cargarActividades();
    }catch(err){
      alert("El archivo no tiene un formato válido.");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

/* ===================== Grilla ===================== */
function buildMonthGrid(year, month){
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const start = new Date(year, month, 1-startOffset);
  const cells = [];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); }
  return cells;
}
function porDia(){
  const map = {};
  for(const a of actividades){
    if(!filtro.has(a.programaId)) continue;
    if(!filtroTipo.has(categoriaTipo(a.tipoRepeticion))) continue;
    if(!map[a.fecha]) map[a.fecha]=[];
    map[a.fecha].push(a);
  }
  return map;
}
// Agrupa por grupo_id (compartidas entre programas) los items que están visibles con el filtro actual.
// Si sólo uno de los programas de un grupo compartido está visible, se muestra suelto (no como grupo).
function agruparParaMostrar(items){
  const grupos = {};
  const orden = [];
  for(const it of items){
    const key = it.grupoId ? `g:${it.grupoId}` : `s:${it.id}`;
    if(!grupos[key]){ grupos[key] = []; orden.push(key); }
    grupos[key].push(it);
  }
  return orden.map(key => grupos[key]);
}
function colorFondoGrupo(miembros){
  const colores = [...new Set(miembros.map(m=>programaById(m.programaId).color))];
  if(colores.length<=1) return colores[0] || "#999";
  const paso = 100/colores.length;
  const stops = colores.map((c,i)=>`${c} ${Math.round(i*paso)}%, ${c} ${Math.round((i+1)*paso)}%`).join(", ");
  return `linear-gradient(135deg, ${stops})`;
}

// Relación aprendida entre sedes y organizaciones a partir de lo ya cargado
function mapasSedeOrg(){
  const sedeOrg = {};
  const orgSedes = {};
  for(const a of actividades){
    const sedeKey = (a.sede||"").trim().toLowerCase();
    const orgKey = (a.organizacion||"").trim().toLowerCase();
    if(sedeKey && a.organizacion && !sedeOrg[sedeKey]) sedeOrg[sedeKey] = a.organizacion;
    if(orgKey && a.sede){
      if(!orgSedes[orgKey]) orgSedes[orgKey] = new Set();
      orgSedes[orgKey].add(a.sede);
    }
  }
  return { sedeOrg, orgSedes };
}
function onSedeInput(value){
  form.sede = value;
  const { sedeOrg } = mapasSedeOrg();
  const match = sedeOrg[value.trim().toLowerCase()];
  if(match && !form.organizacion){
    form.organizacion = match;
    const orgInput = document.getElementById("campo-organizacion");
    if(orgInput) orgInput.value = match;
  }
}
function onOrgInput(value){
  form.organizacion = value;
  const { orgSedes } = mapasSedeOrg();
  const set = orgSedes[value.trim().toLowerCase()];
  if(set && set.size===1 && !form.sede){
    const unicaSede = [...set][0];
    form.sede = unicaSede;
    const sedeInput = document.getElementById("campo-sede");
    if(sedeInput) sedeInput.value = unicaSede;
  }
}

// Desplegable de sugerencias propio (no depende del <datalist> nativo, poco fiable en mobile)
let sugerenciasCampo = null;
let sugerenciasValores = [];
function mostrarSugerencias(campo, valor){
  sugerenciasCampo = campo;
  const distinctList = campo === "organizacion"
    ? [...new Set(actividades.map(a=>a.organizacion).filter(Boolean))]
    : [...new Set(actividades.map(a=>a.sede).filter(Boolean))];
  const v = (valor||"").trim().toLowerCase();
  sugerenciasValores = distinctList.filter(x => x.toLowerCase().includes(v));
  const cont = document.getElementById(`sugerencias-${campo}`);
  if(!cont) return;
  if(sugerenciasValores.length===0 || (sugerenciasValores.length===1 && sugerenciasValores[0].toLowerCase()===v)){
    cont.style.display = "none"; cont.innerHTML = ""; return;
  }
  cont.innerHTML = sugerenciasValores.slice(0,8).map((val,i)=>
    `<div onmousedown="elegirSugerencia(${i})" style="padding:7px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line);">${escapeHtml(val)}</div>`
  ).join("");
  cont.style.display = "block";
}
function ocultarSugerencias(campo){
  const cont = document.getElementById(`sugerencias-${campo}`);
  if(cont){ cont.style.display = "none"; cont.innerHTML = ""; }
}
function elegirSugerencia(i){
  const campo = sugerenciasCampo;
  const val = sugerenciasValores[i];
  const inputEl = document.getElementById(`campo-${campo}`);
  if(inputEl) inputEl.value = val;
  if(campo === "organizacion") onOrgInput(val); else onSedeInput(val);
  ocultarSugerencias(campo);
}

function renderSemana(dias){
  const inicio = inicioSemana(cursor);
  const dias7 = [];
  for(let i=0;i<7;i++){ const d=new Date(inicio); d.setDate(inicio.getDate()+i); dias7.push(d); }
  const today = dateKey(new Date());
  return `
    <div style="display:flex; flex-direction:column; gap:10px;">
      ${dias7.map(d=>{
        const key = dateKey(d);
        const items = (dias[key]||[]).slice().sort((a,b)=>(a.horaInicio||"").localeCompare(b.horaInicio||""));
        const tareasDia = tareas.filter(t=>t.fechaLimite===key && t.estado!=="completada");
        const isToday = key===today;
        return `
          <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:12px;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
              <div class="mono" style="font-size:12px; font-weight:700; color:${isToday?"#fff":"var(--ink)"}; background:${isToday?"var(--accent)":"transparent"}; padding:2px 8px; border-radius:6px;">${DIAS_SEMANA[(d.getDay()+6)%7]} ${d.getDate()}</div>
              <div style="font-size:11px; color:var(--ink-soft);">${MESES[d.getMonth()]}</div>
            </div>
            ${(items.length===0 && tareasDia.length===0) ? `<div style="font-size:12.5px; color:var(--ink-soft);">Sin actividades ni tareas.</div>` : ""}
            ${agruparParaMostrar(items).map(miembros=>actividadCardHtmlGrupo(miembros,false)).join("")}
            ${tareasDia.map(t=>tareaCardHtml(t)).join("")}
            <button class="navbtn" style="width:100%; padding:6px; font-size:12px; font-weight:600; margin-top:4px;" onclick="abrirNueva('${key}')">+ Agregar</button>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderAnio(dias){
  return `
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;">
      ${MESES.map((nombreMes, mIdx)=>{
        const grid = buildMonthGrid(cursor.getFullYear(), mIdx);
        return `<div onclick="irAMes(${cursor.getFullYear()},${mIdx})" style="background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:10px; cursor:pointer;">
          <div class="mono" style="font-size:12px; font-weight:700; margin-bottom:6px;">${nombreMes}</div>
          <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:2px;">
            ${grid.map(d=>{
              const key = dateKey(d);
              const inMonth = d.getMonth()===mIdx;
              const items = dias[key] || [];
              const colores = [...new Set(items.map(a=>a.programaId))].slice(0,3).map(id=>programaById(id).color);
              return `<div style="aspect-ratio:1; border-radius:3px; font-size:8.5px; display:flex; align-items:center; justify-content:center; opacity:${inMonth?1:0.25};
                background:${colores.length?`linear-gradient(90deg, ${colores.join(",")})`:"#F1F0EB"}; color:${colores.length?"#fff":"var(--ink-soft)"}; font-weight:${colores.length?700:400};">${d.getDate()}</div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function actividadCardHtmlGrupo(miembros, expanded){
  if(miembros.length===1) return actividadCardHtml(miembros[0], expanded);
  const a = miembros[0];
  const fondo = colorFondoGrupo(miembros);
  const siglas = miembros.map(m=>(programaById(m.programaId).sigla||programaById(m.programaId).corto)).join(" / ");
  const idsStr = miembros.map(m=>m.id).join(",");
  return `
    <div onclick="abrirGrupoIds('${idsStr}')" style="position:relative; border:1px solid var(--line); border-radius:8px; padding:10px 40px 10px 12px; margin-bottom:8px; cursor:pointer; background:#fff; min-height:92px;">
      <div style="position:absolute; top:0; right:0; bottom:0; width:34px; background:${fondo}; border-radius:0 7px 7px 0; display:flex; align-items:center; justify-content:center; overflow:hidden;">
        <span style="writing-mode:vertical-rl; text-orientation:mixed; color:#fff; font-size:8px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.3);">${siglas}</span>
      </div>
      <div style="font-size:10px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px;">🔗 Compartida entre ${miembros.length} programas</div>
      <div style="font-size:13.5px; font-weight:700;">${escapeHtml(a.titulo)}</div>
      ${a.sede ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">📍 ${escapeHtml(a.sede)}</div>` : ""}
      ${(a.direcciones&&a.direcciones.length) ? a.direcciones.map(d=>`<div style="font-size:11.5px; color:var(--ink-soft);">🧭 ${escapeHtml(d)}</div>`).join("") : ""}
      ${(a.horaInicio||a.horaFin) ? `<div class="mono" style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">${a.horaInicio||"—"}${a.horaFin?` a ${a.horaFin}`:""}</div>` : ""}
    </div>
  `;
}

function actividadCardHtml(a, expanded){

      ${(a.direcciones&&a.direcciones.length) ? a.direcciones.map(d=>`<div style="font-size:11.5px; color:var(--ink-soft);">🧭 ${escapeHtml(d)}</div>`).join("") : ""}
      ${(a.horaInicio||a.horaFin) ? `<div class="mono" style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">${a.horaInicio||"—"}${a.horaFin?` a ${a.horaFin}`:""}</div>` : ""}

function renderModal(){
  const mc = document.getElementById("modal-container");
  if(!modalOpen){ mc.innerHTML = ""; return; }
  if(modalMode === "login"){ mc.innerHTML = loginModalHtml(); return; }
  if(modalKind === "grupo"){ mc.innerHTML = viewGrupoModalHtml(); return; }
  if(modalKind === "tarea"){
    mc.innerHTML = modalMode === "view" ? viewTareaModalHtml() : formTareaModalHtml();
    return;

  if(modalMode === "view"){ mc.innerHTML = viewModalHtml(); return; }
  mc.innerHTML = formModalHtml();
}

            <input type="date" class="inputStyle" value="${form.fecha}" oninput="updateForm('fecha', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Hasta *</label>
            <input type="date" class="inputStyle" value="${form.fechaHasta}" oninput="updateForm('fechaHasta', this.value)" /></div>
          ` : (!form.id && form.fechasSueltasActivo) ? `` : `
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Fecha *</label>
            <input type="date" class="inputStyle" value="${form.fecha}" oninput="updateForm('fecha', this.value)" /></div>
          `}
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Hora inicio</label>
            <input type="time" class="inputStyle" value="${form.horaInicio}" oninput="updateForm('horaInicio', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Hora fin</label>
            <input type="time" class="inputStyle" value="${form.horaFin}" oninput="updateForm('horaFin', this.value)" /></div>
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Personas (responsable / referente)</label>
          <input class="inputStyle" value="${escapeHtml(form.personas)}" oninput="updateForm('personas', this.value)" />
        </div>

        <div style="display:flex; align-items:center; gap:8px; margin:10px 0;">
          <input type="checkbox" id="tramite" ${form.tramiteActivo?"checked":""} onchange="toggleTramite(this.checked)" />
          <label for="tramite" style="font-size:13px; font-weight:600;">Incluir seguimiento de trámite (opcional)</label>
        </div>

        ${form.tramiteActivo ? `
          <div style="margin-bottom:10px;"><label class="fieldLabel">Estado del trámite</label>
            <select class="inputStyle" onchange="updateForm('tramiteEstado', this.value)">
              ${ESTADOS_TRAMITE.map(e=>`<option value="${e.id}" ${form.tramiteEstado===e.id?"selected":""}>${e.icon} ${e.label}</option>`).join("")}
            </select>
          </div>
          <div style="margin-bottom:10px;"><label class="fieldLabel">Próximo paso</label>
            <input class="inputStyle" value="${escapeHtml(form.proximoPaso)}" oninput="updateForm('proximoPaso', this.value)" />
          </div>
        ` : ""}

        <div style="margin-bottom:10px;"><label class="fieldLabel">Observaciones</label>
          <textarea class="inputStyle" rows="2" oninput="updateForm('observaciones', this.value)">${escapeHtml(form.observaciones)}</textarea>
        </div>

        ${form.id ? `
        <div style="margin:14px 0; padding-top:14px; border-top:1px solid var(--line);">
          <label class="fieldLabel">Repetir esta actividad en otra fecha puntual</label>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <input type="date" class="inputStyle" value="${nuevaFechaCopia}" oninput="nuevaFechaCopia=this.value" />
            <button type="button" onclick="duplicarEnFecha()" style="white-space:nowrap; background:var(--accent-soft); color:var(--accent); border-radius:7px; padding:0 14px; font-weight:700; font-size:13px;">+ Duplicar</button>
          </div>
          <div style="font-size:11px; color:var(--ink-soft); margin-top:5px;">Crea una copia idéntica de esta actividad en la fecha elegida, en el mismo programa.</div>
        </div>
        ` : ""}

        <div style="display:flex; justify-content:space-between; margin-top:16px;">
          ${form.id ? `<button class="navbtn" style="width:auto; color:#B3413A; border-color:#EAB9B2; padding:8px 12px;" onclick="eliminarActividad('${form.id}')">Eliminar</button>` : "<span></span>"}
          <button onclick="guardarActividad()" style="background:var(--accent); color:#fff; border-radius:8px; padding:9px 18px; font-weight:700; font-size:14px;">Guardar</button>
        </div>
      </div>
    </div>
  `;
}

function viewTareaModalHtml(){
  const t = tareaForm;
  const pr = prioridadById(t.prioridad);
  const es = estadoTareaById(t.estado);
  return `
    <div onclick="cerrarModal()" style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="position:relative; background:#fff; border-radius:14px; padding:22px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span style="font-size:11px; font-weight:700;">${pr.icon} ${pr.label}</span>
          <button onclick="cerrarModal()" style="font-size:18px;">✕</button>
        </div>
        <h2 style="font-size:18px; font-weight:700; margin:0 0 10px 0; ${t.estado==="completada"?"text-decoration:line-through;":""}">${escapeHtml(t.titulo)}</h2>
        <div style="font-size:13px; color:var(--ink-soft); display:flex; flex-direction:column; gap:5px;">
          <div>${es.icon} ${es.label}</div>
          ${t.responsable?`<div>👤 ${escapeHtml(t.responsable)}</div>`:""}
          ${t.fechaLimite?`<div class="mono">📅 ${t.fechaLimite}</div>`:""}
          ${t.observaciones?`<div style="font-style:italic;">${escapeHtml(t.observaciones)}</div>`:""}
        </div>
        <button style="width:100%; margin-top:18px; background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:9px; font-weight:700; font-size:13px;" onclick="abrirLogin()">Iniciar sesión para editar</button>
      </div>
    </div>
  `;
}

function formTareaModalHtml(){
  const t = tareaForm;
  return `
    <div onclick="cerrarModal()" style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="background:#fff; border-radius:14px; padding:22px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h2 style="font-size:17px; font-weight:700; margin:0;">${t.id ? "Editar tarea" : "Nueva tarea"}</h2>
          <button onclick="cerrarModal()" style="font-size:18px;">✕</button>
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Tarea *</label>
          <input class="inputStyle" value="${escapeHtml(t.titulo)}" oninput="updateTareaForm('titulo', this.value)" placeholder="Ej: Firmar convenio con..." />
        </div>

        <div class="stack-mobile" style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Prioridad</label>
            <select class="inputStyle" onchange="updateTareaForm('prioridad', this.value)">
              ${PRIORIDADES.map(p=>`<option value="${p.id}" ${t.prioridad===p.id?"selected":""}>${p.icon} ${p.label}</option>`).join("")}
            </select>
          </div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Estado</label>
            <select class="inputStyle" onchange="updateTareaForm('estado', this.value)">
              ${ESTADOS_TAREA.map(e=>`<option value="${e.id}" ${t.estado===e.id?"selected":""}>${e.icon} ${e.label}</option>`).join("")}
            </select>
          </div>
        </div>

        <div class="stack-mobile" style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Responsable</label>
            <input class="inputStyle" value="${escapeHtml(t.responsable)}" oninput="updateTareaForm('responsable', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Fecha límite</label>
            <input type="date" class="inputStyle" value="${t.fechaLimite}" oninput="updateTareaForm('fechaLimite', this.value)" /></div>
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Observaciones</label>
          <textarea class="inputStyle" rows="2" oninput="updateTareaForm('observaciones', this.value)">${escapeHtml(t.observaciones)}</textarea>
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:16px;">
          ${t.id ? `<button class="navbtn" style="width:auto; color:#B3413A; border-color:#EAB9B2; padding:8px 12px;" onclick="eliminarTarea('${t.id}')">Eliminar</button>` : "<span></span>"}
          <button onclick="guardarTarea()" style="background:var(--accent); color:#fff; border-radius:8px; padding:9px 18px; font-weight:700; font-size:14px;">Guardar</button>
        </div>
      </div>
    </div>
  `;
}

/* ===================== Init ===================== */
render();
</script>
</body>
</html>
