const MAPA_PROGRAMAS = {"adolescencias": {"nombre": "Programa Adolescencias", "brief": "El Programa Adolescencia es una iniciativa pensada para estimular las potencialidades y la capacidad creadora de los adolescentes a través de la expresión artística, del acceso a las nuevas tecnologías de información y comunicación como herramienta de integración social, y de la práctica de actividades físicas y deportivas orientadas al desarrollo de la personalidad, el trabajo en equipo y el cuidado de la salud.<br/><br/>Está destinado a adolescentes entre 13 y 18 años que integran hogares en situación de vulnerabilidad social en la Ciudad de Buenos Aires. Se desarrolla a partir de dos ejes fundamentales: los talleres culturales, deportivos y de ciencia y tecnología, y el acompañamiento profesional de los y las adolescentes.", "tiene_organizaciones": true, "gestion": "El programa trabaja de forma integrada con organizaciones sociales territoriales. Esta dinámica funciona en el marco de convenios celebrados que definen los alcances de cada institución, generando espacios de contención, brindando contenidos específicos, acompañamiento y estímulo a la participación.<br/><br/>Cada taller se desarrolla anualmente y es dictado por una tallerista especializada, asistida por una operadora social, quien trabaja en contacto directo y cotidiano con las y los adolescentes, acompaña procesos, sostiene el vínculo y actúa como puente entre la persona, su entorno y las instituciones. Su rol se define por la tarea territorial y de acompañamiento. Tanto la tallerista como la operadora social integran el Programa, pero pertenecen formalmente a la organización conveniada, no a la planta del equipo técnico de la Gerencia.<br/><br/>El taller está diseñado para que las adolescencias que lo transitan cuenten con un espacio de contención socioeducativa y de desarrollo a través del arte, el deporte, la música y las ciencias y tecnologías.<br/><br/>El equipo técnico del Programa se organiza en tres niveles: la Coordinadora del Programa, la Sub Coordinación (cinco personas, cada una a cargo de un equipo) y los equipos territoriales que de ellas dependen. El detalle completo está en Gestiones propias — Sistema de control y Equipo — Sub Coordinaciones.<br/><br/>La Coordinadora del Programa, Patricia González Chans, es responsable de la coordinación de los equipos técnicos y del monitoreo de la generación y disponibilidad de los recursos necesarios para el adecuado funcionamiento del equipo y el desarrollo del Programa.", "diagnostico": "Cierre 2026 (Presentación Desafío 2027): 11.600 adolescentes inscriptos, 7.000 cupos disponibles y 4.600 de demanda no cubierta (39,7%).<br/><br/>Hitos: cierre de las clínicas UNTREF el 10 de octubre (entre 500 y 700 adolescentes; taekwondo, vóley, fútbol e IA) y cierre del Programa el 7 de noviembre (14 de noviembre como fecha alternativa en caso de suspensión).<br/><br/>Desafío 2027: ampliar la capacidad del Programa y fortalecer la participación sostenida.<br/><br/><span style=\"font-size:11.5px; font-style:italic;\">Ver también: Red de articulación y Líneas de acción 2027, en Gestiones propias.</span>", "coordinador": "Patricia González Chans"}, "lazos": {"nombre": "Reconstruyendo Lazos", "brief": "Brinda herramientas que el mundo del trabajo requiere, por medio de prácticas socioeducativas laborales y distintas instancias de capacitación, para incrementar las condiciones de empleabilidad de adolescentes y jóvenes. Promueve la inserción laboral en situación de vulnerabilidad social, mediante capacitaciones y prácticas en espacios de trabajo.<br/><br/>Como marca distintiva, cuenta con un dispositivo de acompañamiento que orienta la experiencia de quienes participan. Destinatarios: adolescentes y jóvenes entre 16 y 21 años en situación de vulnerabilidad social de la Ciudad de Buenos Aires.", "tiene_organizaciones": true, "gestion": "Cada espacio de práctica es un tercero (empresa, organismo, espacio cultural) que recibe jóvenes en práctica laboral. El circuito de alta institucional propio de este programa todavía no está confirmado.", "coordinador": "Anabella Divan"}, "lideres": {"nombre": "Líderes Recreativos y Comunitarios", "brief": "Propuesta gratuita de inclusión y capacitación dirigida a adolescentes entre 16 y 18 años de la Ciudad de Buenos Aires, con el objetivo de generar espacios de formación en recreación y liderazgo comunitario que promuevan procesos de participación y autogestión en sus barrios e instituciones. Se desarrolla desde 1998.<br/><br/>El curso tiene una duración de tres años y a lo largo del trayecto se comparten salidas, campamentos y viajes. Es dictado por un equipo docente formado por profesionales de diversas áreas con una larga trayectoria en la coordinación de grupos.", "tiene_organizaciones": false, "gestion": "Funciona en sede fija propia (Escuela García Lorca, los sábados) y hace salidas esporádicas a otros lugares todavía sin detallar.", "diagnostico": "Diagnóstico 2026: en las presentaciones de Desafío 2027 este programa aparece nombrado como \"Recreación Comunitaria\" — es el mismo programa, con un alias informal usado en ese material, no un renombre oficial. El nombre oficial sigue siendo Líderes Recreativos y Comunitarios. 250 adolescentes y jóvenes entre 1er año, 2do año, 3er año y ERA. La falta de presupuesto obligó a readaptar actividades centrales del trayecto formativo y a suspender otras — se trabajó recortando recursos y readaptando propuestas, todas en espacios gratuitos.<br/><br/><b>Hitos 2026:</b><br/>• 1er año — 2 campamentos: el primero realizado en la Escuela García Lorca; el segundo, de noviembre, con lugar todavía pendiente.<br/>• 2do año — campamento readaptado y realizado en la Escuela García Lorca; gira a Mar del Plata/Mar Chiquita sin presupuesto, en proceso de readaptación.<br/>• 3er año — viaje al Tríptico de la Infancia (Rosario) sin presupuesto, en readaptación; campamento con el Programa Juegotecas suspendido por falta de presupuesto; evento \"Conexión sin WiFi\" suspendido por falta de presupuesto.<br/>• ERA — campamento readaptado para realizarse en la Escuela García Lorca; salida al Delta del Tigre suspendida por falta de presupuesto.<br/><br/>Para 2027 se trabaja una <b>Diplomatura con la UNTREF</b> (\"Promotor Integral en Recreación Comunitaria\"), certificada al finalizar el tercer año, con esta estructura: 1er año — Bases (contenidos iniciales de recreación comunitaria); 2do año — Profundización (herramientas de coordinación, planificación y trabajo grupal); 3er año — Integración (consolidación de saberes y experiencia formativa).<br/><br/>Desafío 2027: garantizar las experiencias que forman parte de la propuesta integral del programa.", "coordinador": "Romina Valsecchi"}, "coopa": {"nombre": "COOPA", "brief": "La institución trabaja con adolescentes de 14 a 21 años capacitándolos en distintos oficios (mecánica, herrería, electricidad, computación, diseño gráfico) y desarrollando también actividades recreativas, deportivas y espacios de trabajo en formación laboral, en derechos humanos y en lectura y escritura.<br/><br/><b>Objetivos generales:</b> propiciar un espacio de formación integral para el trabajo donde la formación técnica de los oficios sea a su vez disparador hacia otros conocimientos de disciplinas básicas y de desarrollo de saberes aptitudinales y actitudinales para el desenvolvimiento en el mundo del trabajo. Promover el conocimiento y ejercicio de los derechos humanos y sociales de las/os jóvenes, apuntando a fortalecer su protagonismo, toma de decisiones y reflexión-acción sobre su realidad, en la perspectiva de sujetos de derecho hacia la ciudadanía plena.<br/><br/><b>Enfoque pedagógico-didáctico:</b> la enseñanza tiene como punto de partida la realidad propia, la experiencia y su relación con la teoría y la práctica, combinando el trabajo colectivo con la articulación por áreas. La modalidad de taller/salón permite que circule de manera horizontal y democrática la palabra, construyendo el pensamiento crítico y la identidad de pertenencia.", "tiene_organizaciones": false, "gestion": "Funciona en centros propios del programa, no en organizaciones externas. Uno de esos centros (Barrio Rivadavia I) es además el que usa TABF prestado.", "coordinador": "Daniel Quiroz"}, "bajoflores": {"nombre": "TABF — Talleres Adolescentes del Bajo Flores", "brief": "El Programa Talleres para Adolescentes del Bajo Flores se constituye como una articulación de organizaciones sociales y comunitarias de la zona con el Estado, con el fin de promover espacios educativos con los y las adolescentes.", "tiene_organizaciones": true, "gestion": "No tiene sede propia: usa las instalaciones que le prestan 11 instituciones de la red (comedores, capillas, radio comunitaria, biblioteca, club, escuela y una sede de COOPA).", "coordinador": "Lorena Fernández"}, "turismo": {"nombre": "Turismo Social", "brief": "Sin reseña oficial disponible todavía. Actualmente con poca actividad, según lo indicado.", "tiene_organizaciones": false, "gestion": "Tiene sede propia (Parque Sarmiento, según la nómina de personal), todavía no incorporada a la base a la espera de confirmación. En las presentaciones de Desafío 2027 aparece nombrado como \"Turismo Recreativo\" — es el mismo programa; el nombre oficial sigue siendo Turismo Social.", "coordinador": "Alejandro Agazzi"}};
const MAPA_GESTIONES_PROGRAMA = {"adolescencias": [{"titulo": "Sistema de control: de la Coordinadora al equipo territorial", "desc": "Tres niveles de conducción técnica del Programa.", "sub": [{"titulo": "Coordinadora del Programa — Patricia González Chans", "desc": "Responsable de la coordinación de los equipos técnicos y del monitoreo de la generación y disponibilidad de los recursos necesarios para el adecuado funcionamiento del equipo y el desarrollo del Programa."}, {"titulo": "Sub Coordinación", "desc": "Nivel intermedio entre la Coordinadora del Programa y los equipos territoriales. Son cinco personas, cada una a cargo de un equipo. Planifican, guían y controlan las actividades que se desarrollan a lo largo del año, y reportan a la Coordinadora del Programa. El detalle de cada Sub Coordinación y su equipo está en Equipo — Sub Coordinaciones, más abajo."}, {"titulo": "Equipo territorial — talleristas y operadoras/es sociales", "desc": "Dictan los talleres y acompañan a las y los adolescentes en el territorio. Responden a la Sub Coordinación. Si bien integran el Programa, pertenecen formalmente a la organización conveniada, no a la planta del equipo técnico de la Gerencia."}]}, {"titulo": "Equipo — Sub Coordinaciones de supervisión", "desc": "Cinco Sub Coordinaciones, cada una con su propio equipo. Reportan directamente a la Coordinadora del Programa.", "sub": [{"titulo": "Sub Coordinación — Analía Mauvezin", "desc": "Equipo: Nahuel Bernardez, Noelia Miceli, Laura Santambrogio, Sonia Inés Padro, Javier Lazarte."}, {"titulo": "Sub Coordinación — Analía Dillman", "desc": "Equipo: Damián Rico, Gonzalo Sarrais, Omar Mendoza, Mariana Cruz, Vacante, Vacante."}, {"titulo": "Sub Coordinación — Sofía Zukerfeld", "desc": "Equipo: Elisa Ordiozola, Analía Maldones, Silvina Sanseverino, Andrea Giussanni, Diego Couzo, Vacante."}, {"titulo": "Sub Coordinación — Carla Chapato", "desc": "Equipo: Marcela Avezzano, Carolina Vazquez, Celeste Farbman (licencia por maternidad), Silvina Alonso (licencia por maternidad), Vacante, Vacante."}, {"titulo": "Sub Coordinación — M. Eugenia García", "desc": "Equipo: Cyntia Tonelli, Virginia Domínguez, Ale Rost, Elena Montaldo, Ivanna Palma, Vacante."}]}, {"titulo": "Equipo — Área Apoyo y Administrativos del Programa", "desc": "Dos grupos de personal del Programa, además de la línea de Coordinación y Sub Coordinación.", "sub": [{"titulo": "Área Apoyo", "desc": "María del Mar Pardoa Puigdomenech, Roberto Osvaldo Fabbricatore, Melisa Mónica Marino, Federico Pereyra."}, {"titulo": "Administrativos", "desc": "Víctor González, Vacante, Vacante."}]}, {"titulo": "Circuito de documentación y convenios", "desc": "Mediados de febrero: Pablo Riveli envía a las organizaciones el listado completo de la documentación necesaria para renovar el convenio.<br/><br/>Las organizaciones presentan la documentación — gran parte debe renovarse o actualizarse cada año. El tiempo de entrega depende de cada una; se estima en hasta 15 días.<br/><br/>Primeros días de marzo: el Programa envía el presupuesto a las organizaciones y les solicita el proyecto anual y la fecha de inicio de las actividades, que luego se informa a las y los adolescentes en la confirmación de vacantes.<br/><br/>El Programa recibe y evalúa los proyectos presentados.<br/><br/>Los proyectos evaluados se envían a Pablo Riveli para integrarlos al legajo de cada organización.<br/><br/>Con la documentación completa y el proyecto evaluado, la organización queda en condiciones de firmar el convenio — hacia mediados de marzo, si no hay inconvenientes.<br/><br/><span style=\"font-size:11.5px; font-style:italic;\">Complementa, con el detalle específico de este programa, el circuito general de Convenios y organizaciones de la Gerencia.</span>"}, {"titulo": "Circuito de supervisión e informes", "desc": "Cada integrante del equipo de supervisión tiene asignados aproximadamente 12 talleres, en dos instituciones y, como máximo, tres. La frecuencia de visita es semanal por institución y quincenal por taller, alternando las actividades visitadas.<br/><br/>La asistencia de las y los adolescentes la registran operadores/as sociales o referentes institucionales. Hoy está repartida entre el sistema (instituciones que ya cuentan con VPN y capacitación) y planillas Excel (el resto, hasta completar ese proceso) — ver Accesos VPN, en los trámites de la Gerencia.<br/><br/>En cada visita se registra además la cantidad de participantes y se realiza una evaluación cualitativa: dinámica y participación grupal e individual, vínculo de operadores/as y docentes con las y los adolescentes, propuesta pedagógica, seguimientos sociales y capacidad de la coordinación institucional.<br/><br/>Cada visita genera un informe de supervisión. Además hay tres informes periódicos al año: fines de julio, fines de octubre, y entre el 15 y el 20 de diciembre (al cierre del convenio). Se reúnen en una carpeta de Drive de la Gerencia y el Programa; el formato común todavía está en construcción.<br/><br/>Cuando una situación requiere la intervención del Consejo de los Derechos de Niñas, Niños y Adolescentes u otro efector, se articula entre los equipos: reuniones, intercambio de información e informes, derivaciones y acuerdos de intervención — ver también Derivación al Consejo de Derechos, más abajo, para el circuito formal con expediente."}, {"titulo": "Circuito de inscripciones", "desc": "El circuito comienza con dos procesos en paralelo: la evaluación del índice de vulnerabilidad y el acondicionamiento del sistema, en articulación con GODI (Gerencia Operativa de Desarrollo Informático del GCBA), y la construcción de la oferta de actividades junto con las instituciones.<br/><br/>Primeros días de diciembre: las instituciones presentan la oferta acordada, que se carga y controla en el sistema.<br/><br/>Desde el 2 de enero y durante enero y febrero: preinscripción abierta — requiere el sistema acondicionado; en algunos años las dificultades del sistema obligaron a reducir el período.<br/><br/>Del 1 al 15 de marzo: procesamiento de datos y ranking por índice de vulnerabilidad.<br/><br/>Desde el 15 de marzo: confirmación de vacantes, que requiere las fechas de inicio informadas por las organizaciones — este punto suele estar condicionado por la definición y aceptación del presupuesto.<br/><br/>Existe una base de datos por organización, actividad/disciplina y edad, que lleva Bernardo."}, {"titulo": "Circuito de pagos", "desc": "", "sub": [{"titulo": "A las y los adolescentes (becas)", "desc": "Las adolescencias reciben este estímulo económico con el fin de garantizar la equidad material, incentivar la permanencia en los espacios de contención y eliminar las barreras socioeconómicas que dificultan su desarrollo pleno. La beca funciona como una herramienta de política pública destinada a asegurar que las y los jóvenes en situación de vulnerabilidad social puedan afrontar los viáticos, materiales y necesidades básicas asociadas a su participación en actividades educativas, culturales, tecnológicas o deportivas. De esta forma, el Estado promueve la autonomía, la inclusión y la restitución de derechos vulnerados.<br/><br/><b>Marco normativo regulatorio</b> — la entrega de estos fondos obligatorios se sustenta en tres niveles jurídicos:<br/>• <b>Tratados internacionales:</b> la Convención sobre los Derechos del Niño (con rango constitucional en Argentina), que obliga al Estado a disponer del \"máximo de los recursos disponibles\" para asegurar el desarrollo integral de las infancias y adolescencias.<br/>• <b>Leyes de protección integral:</b> Ley Nacional N° 26.061 (los niños, niñas y adolescentes son sujetos de derecho; mandata al Estado a implementar políticas activas frente a la exclusión social) y Ley N° 114 de la Ciudad de Buenos Aires (obliga al GCBA a aplicar programas públicos que garanticen el goce de derechos en condiciones de igualdad, dignidad y sin discriminación).<br/>• <b>Normativa de ejecución específica:</b> decretos porteños (Decreto N° 428/07 y resoluciones del Ministerio de Desarrollo Humano y Hábitat), que autorizan las partidas presupuestarias específicas y definen legalmente el beneficio como un estímulo nominal no remunerativo.<br/><br/><b>Circuito operativo — Programa Adolescencias</b><br/><br/>La inscripción es abierta, libre y gratuita, a través del sistema del Gobierno de la Ciudad.<br/><br/>Una vez cargadas todas las inscripciones, se realiza un proceso de selección que prioriza a las adolescencias con mayor situación de marginalidad y problemática social a la hora de asignar vacante. El programa cuenta con aproximadamente 7.000 vacantes.<br/><br/>Las y los seleccionados se registran en el <b>RIB</b> (sistema interno del Gobierno de la Ciudad), donde el personal administrativo carga los datos de identificación y contacto del adolescente (CUIT, dirección, teléfono, nombre completo, DNI, CUIL) y, cuando corresponde, los mismos datos de su representante.<br/><br/>Los y las adolescentes mayores de 13 años pueden cobrar la beca ellos mismos, mediante un CBU del Banco Ciudad, o a través de un representante legal (tutor/a). Los y las menores de 13 años requieren representante.<br/><br/>Con la información cargada en el RIB, la carga del pago en sí se realiza en el <b>PSOC</b>, otro sistema interno del Gobierno de la Ciudad. Ambos sistemas (RIB y PSOC) dan aviso a Tesorería, que habilita la acreditación del pago."}, {"titulo": "A las organizaciones", "desc": "Durante 2025 y 2026 la modalidad vigente es el pago a cupo total: el cupo de vacantes de cada categoría establecida en el convenio, multiplicado por el valor correspondiente a cada categoría. El equipo del Programa no genera mensualmente un nuevo cálculo o reporte; el proceso tiene varias fases manuales a cargo de la Dirección General: recepción de la copia de la factura mensual, elaboración de la rendición, armado del informe anexo con los montos a pagar, elevación a la firma de la Directora General, y armado de cada disposición de pago por organización.<br/><br/>Una vez determinado el monto, se ejecuta el pago y la organización recibe un número de DGT junto con la solicitud de facturación. La organización emite la factura, la carga en el sistema con ese número de DGT y la envía al área contable de la Dirección General, que completa la instancia para la transferencia.<br/><br/>Información pendiente de incorporar, según el propio diagnóstico del Programa: los montos efectivamente pagados por organización y el promedio por ONG."}]}, {"titulo": "Convenio con UNTREF — clínicas deportivas", "desc": "Consentimiento informado a padres, cronograma, brief por clínica/institución, ejecución, síntesis de participación y cierre."}, {"titulo": "Red de articulación", "desc": "", "sub": [{"titulo": "UNTREF", "desc": "Proyectos presentados, clínicas y cierre del Programa."}, {"titulo": "UBA", "desc": "Articulación institucional."}, {"titulo": "Banco Ciudad", "desc": "Articulación institucional."}, {"titulo": "Clubes (San Lorenzo, Racing, Argentinos Juniors)", "desc": "Alianza deportiva."}, {"titulo": "Radio Mitre", "desc": "Articulación y comunicación."}]}, {"titulo": "Por expediente (ingreso excepcional)", "desc": "Ingresa por expediente SADE. Se baja el formulario de ingreso (informe gráfico), se pasa a la coordinadora del programa por mail, se carga en un cuadro compartido (contacto con el adolescente, actividad elegida). Se arman los eleves que firma la Gerencia Operativa Legal, se vinculan al expediente y se remite al destinatario que lo envió."}, {"titulo": "Por oficio (pedidos 104 y requerimientos)", "desc": "La Dirección deriva el oficio al programa correspondiente con plazo previo al vencimiento. El programa arma la información, se valida que sea coherente con lo pedido, y se responde por GEDO firmado por la Gerencia Operativa Legal, revisado antes por la abogada de la Dirección General."}, {"titulo": "Derivación al Consejo de Derechos (vulneración de derechos)", "desc": "Ante una vulneración de derechos de un/a adolescente, el programa correspondiente eleva un informe social con los datos completos del adolescente y sus referentes, describiendo la situación que acredita la vulneración.<br/><br/>Se solicita a Mesa de Entradas de la DGPINA la carátula de expediente electrónico. El código de trata tiene dos referencias distintas, según la fuente:<br/>• <b>MDSG0703A</b> — según el mail de la abogada de la Dirección General.<br/>• <b>AJG00101A</b> (\"o similar\") — según el documento interno de circuitos de la Gerencia.<br/><br/>Se vinculan al expediente el informe social y los informes técnicos completos, firmados. El expediente pasa al usuario de Mesa de Entradas y se eleva desde la Gerencia Operativa Legal, dirigido a la Dirección General, que deriva a DGPDES o directamente al Consejo de Derechos de Niñas, Niños y Adolescentes."}, {"titulo": "Líneas de acción 2027", "desc": "Cuatro líneas concretas para pasar de alianzas institucionales a experiencias y oportunidades para los adolescentes.", "sub": [{"titulo": "Adolescencia Te Prepara", "desc": "Primer empleo, educación financiera, orientación vocacional, mentorías, visitas a empresas."}, {"titulo": "Adolescencia Crea", "desc": "Inteligencia artificial, programación, audiovisual, podcast, comunicación, Hackatón Adolescencia."}, {"titulo": "Adolescencia Saludable", "desc": "Nutrición, deporte, hábitos saludables, primeros auxilios, prevención."}, {"titulo": "Adolescencia Conecta", "desc": "Universidades, empresas, medios, clubes profesionales, producción audiovisual, referentes."}]}], "lazos": [{"titulo": "Pago de becas", "desc": "Las adolescencias cobran este estímulo económico con el fin de garantizar la equidad material, incentivar la permanencia en los espacios de contención y eliminar las barreras socioeconómicas que dificultan su desarrollo pleno.<br/><br/>La beca no funciona como un salario ni como un subsidio discrecional, sino como una herramienta de política pública para asegurar que los jóvenes en situación de vulnerabilidad social puedan costear los viáticos, materiales y necesidades básicas asociadas a su participación en actividades educativas, culturales, tecnológicas o deportivas. De esta forma, el Estado promueve la autonomía, la inclusión y la restitución de derechos vulnerados.<br/><br/><b>Marco normativo regulatorio</b> — la entrega de estos fondos obligatorios se sustenta en tres niveles jurídicos:<br/>• <b>Tratados internacionales:</b> la Convención sobre los Derechos del Niño (con rango constitucional en Argentina), que obliga al Estado a disponer del \"máximo de los recursos disponibles\" para asegurar el desarrollo integral de las infancias y adolescencias.<br/>• <b>Leyes de protección integral:</b> Ley Nacional N° 26.061 (los niños, niñas y adolescentes son sujetos de derecho; mandata al Estado a implementar políticas activas frente a la exclusión social) y Ley N° 114 de la Ciudad de Buenos Aires (obliga al GCBA a aplicar programas públicos que garanticen el goce de derechos en condiciones de igualdad, dignidad y sin discriminación).<br/>• <b>Normativa de ejecución específica:</b> decretos porteños (Decreto N° 428/07 y resoluciones del Ministerio de Desarrollo Humano y Hábitat), que autorizan las partidas presupuestarias específicas y definen legalmente el beneficio como un estímulo nominal no remunerativo.<br/><br/><b>Circuito operativo:</b> Un/a adolescente elegible genera expediente, se cruza contra su cuenta bancaria, cambia de estado (elegibilidad, operativa, baja solicitada) y se procesa el pago mensual."}], "lideres": [{"titulo": "Insumos para campamentos", "desc": "Por cada campamento programado: pedido de insumos, compra, depósito y entrega."}, {"titulo": "Alianza con Radio Mitre", "desc": "A partir del taller de radio del programa, los y las jóvenes participan de la organización y producción de la propuesta \"Voces que Inspiran\", en articulación con Radio Mitre."}, {"titulo": "Hitos 2026", "desc": "Readaptaciones y suspensiones por falta de presupuesto, por cohorte.", "sub": [{"titulo": "1er año", "desc": "2 campamentos: el primero realizado en la Escuela García Lorca; el segundo, de noviembre, con lugar todavía pendiente."}, {"titulo": "2do año", "desc": "Campamento readaptado y realizado en la Escuela García Lorca. Gira a Mar del Plata/Mar Chiquita sin presupuesto, en proceso de readaptación."}, {"titulo": "3er año", "desc": "Viaje al Tríptico de la Infancia (Rosario) sin presupuesto, en readaptación. Campamento con el Programa Juegotecas suspendido por falta de presupuesto. Evento \"Conexión sin WiFi\" suspendido por falta de presupuesto."}, {"titulo": "ERA", "desc": "Campamento readaptado para realizarse en la Escuela García Lorca. Salida al Delta del Tigre suspendida por falta de presupuesto."}]}], "coopa": [], "bajoflores": [], "turismo": []};
const MAPA_GESTIONES_GENERALES = [{"id": "conv", "titulo": "Convenios y organizaciones", "desc": "La articulación con las organizaciones sociales se concreta a través de un Convenio. El ingreso de la propuesta se genera a través de un expediente, donde se envía a la DGTAL para la conformación del marco jurídico correspondiente. Posteriormente se remite a la firma del Ministerio de Desarrollo Humano y Hábitat (MDHyH). Una vez firmado, se procede al pago.<br/><br/><b>¿Por qué se trabaja con organizaciones sociales?</b><br/><br/><b>Democracia participativa y cogestión.</b> La Constitución de la CABA establece que la democracia de la Ciudad tiene carácter participativo. Los considerandos de los convenios recuperan este mandato: incorporar a las OSC permite un diseño de políticas públicas más democrático, plural y cercano a las necesidades reales del vecino.<br/><br/><b>Capilaridad territorial y especialización técnica.</b> Las organizaciones sociales poseen un \"saber hacer\" y un arraigo territorial que el aparato estatal no siempre logra de forma inmediata. El Estado firma convenios para potenciar y articular esas capacidades técnicas, descentralizando la ejecución de programas para llegar de forma más rápida y empática a la población vulnerable.<br/><br/><b>Corresponsabilidad en la protección de derechos.</b> En niñez y adolescencia (ámbito de la DGPINA), la Ley N.° 114 derriba el viejo modelo de patronato e instaura el principio de corresponsabilidad: la protección integral de derechos no es tarea exclusiva del sector público, sino una responsabilidad compartida entre el Estado, las familias y las organizaciones de la comunidad.<br/><br/><b>Marco jurídico estructurado</b><br/><pre class=\"mono\" style=\"font-size:11px; line-height:1.4; white-space:pre; overflow-x:auto; background:#fff; border-radius:6px; padding:10px; color:var(--ink);\">┌─────────────────────────────────────────┐\n│          Constitución de la CABA        │\n│   (Arts. 11, 32 y 39 - Participación)   │\n└────────────────────┬────────────────────┘\n                     ▼\n┌─────────────────────────────────────────┐\n│        Leyes de Fondo (CABA)            │\n│  - Ley N.° 114 (Protección Integral)    │\n│  - Ley N.° 6.684 (Ley de Ministerios)   │\n└────────────────────┬────────────────────┘\n                     ▼\n┌─────────────────────────────────────────┐\n│         Decretos y Resoluciones         │\n│  - Decreto N.° 1360/07 (Convenio Marco) │\n│  - Res. N.° 97/SECLYT/25 (Circuito)     │\n└─────────────────────────────────────────┘</pre><br/><b>Nivel constitucional:</b> la Constitución de la CABA obliga al Estado a garantizar canales de participación ciudadana y a fomentar las actividades de las entidades comunitarias sin fines de lucro.<br/><br/><b>Nivel legal de competencia:</b> la Ley N.° 6.684 encomienda al Ministerio de Desarrollo Humano y Hábitat la articulación de sus políticas con actores privados y del tercer sector. La Ley N.° 114 da el marco protectorio específico para que la DGPINA delegue o complemente la atención de adolescentes mediante estos instrumentos institucionales.<br/><br/><b>Nivel operativo y procedimental:</b> el Decreto N.° 1360/07 unifica las reglas mediante el \"Modelo de Convenio Marco de Cooperación\", resguardando la autonomía jurídica y técnica de la organización frente al Estado. La Resolución N.° 97/SECLYT/25 garantiza la transparencia del circuito digital, exigiendo dictámenes legales antes de que los fondos públicos sean girados.<br/><br/><span style=\"font-size:11px; color:var(--ink-soft);\">Fuentes: Constitución de la CABA · Ley N.° 114 · Ley N.° 6.684 · Decreto N.° 1360/07 · Resolución N.° 97/SECLYT/25 · documentosboletinoficial.buenosaires.gob.ar · mpfciudad.gob.ar</span<br/><br/><b>Marco jurídico estructurado</b><br/><pre class=\"mono\" style=\"font-size:11px; line-height:1.4; white-space:pre; overflow-x:auto; background:#fff; border-radius:6px; padding:10px; color:var(--ink);\">┌───────────────────────────────────── let mapaOrgsCache = null;
let mapaOrgsLoading = false;

async function cargarMapaOrgsSinoptico(){
  if(mapaOrgsCache || mapaOrgsLoading) return;
  mapaOrgsLoading = true;
  try{
    const { data, error } = await sb.from("organizaciones")
      .select("id,nombre,nombre_alternativo,observaciones,sedes(id,nombre,direccion,barrio,comuna),convenios(numero,estado,fecha_inicio_real,fecha_fin_real),participacion_org_programa(programa_id,modalidad,tipo_actividad)")
      .order("nombre");
    if(error){ console.error("Error cargando organizaciones:", error); }
    mapaOrgsCache = error ? [] : data;
  }catch(e){
    console.error("Excepción cargando organizaciones:", e);
    mapaOrgsCache = [];
  }finally{
    mapaOrgsLoading = false;
  }
  renderRoot();
  // una vez que el DOM ya tiene los <span id="orgs-...">, los completamos sin rehacer todo el render
  rellenarOrgsSinoptico();
}

function rellenarOrgsSinoptico(){
  const orgs = mapaOrgsCache || [];
  const porPrograma = {};
  orgs.forEach(o => (o.participacion_org_programa||[]).forEach(pp => {
    (porPrograma[pp.programa_id] = porPrograma[pp.programa_id] || []).push(o.nombre);
  }));
  MAPA_PROGRAMA_ORDEN.forEach(pid => {
    const el = document.getElementById('orgs-'+pid);
    if(!el) return;
    el.innerHTML = (porPrograma[pid] && porPrograma[pid].length) ? porPrograma[pid].sort().join(' · ') : '<span class="falta">Sin organizaciones/lugares cargados todavía.</span>';
  });
}

function mapaRedactar(texto){
  let t = texto;
  MAPA_REDACT.forEach(([nombre, reemplazo]) => { t = t.split(nombre).join(reemplazo); });
  return t;
}

function mapaLimpiarHtml(s){
  return s.replace(/<pre[^>]*>/g, "\n").replace(/<\/pre>/g, "")
          .replace(/<br\/?>/g, " ").replace(/<b>|<\/b>/g, "")
          .replace(/<i>|<\/i>/g, "").replace(/<span[^>]*>/g, "").replace(/<\/span>/g, "")
          .replace(/•/g, "-");
}

function descargarInformeMapa(){
  const orgs = mapaOrgsCache || [];

  let body = [];
  body.push(`<h1>Mapa de funcionamiento — Gerencia Operativa GOPIA</h1>`);

  body.push(`<h2>1. Gerencia Operativa</h2>`);
  body.push(`<p>La Gerencia Operativa se conforma con el equipo que la lleva adelante y con cada uno de los seis programas.</p>`);
  body.push(`<h3>Equipo</h3>`);
  MAPA_TEAM.forEach(t => {
    body.push(`<p><b>${t.nombre}</b> — <i>${t.rol}</i><br/>${t.resp}</p>`);
  });

  body.push(`<h2>2. Programas — cómo se conforma la Gerencia</h2>`);
  MAPA_PROGRAMA_ORDEN.forEach(id => {
    const p = MAPA_PROGRAMAS[id];
    const gestiones = MAPA_GESTIONES_PROGRAMA[id] || [];
    body.push(`<h3>${p.nombre}</h3>`);
    body.push(`<p><b>Coordinador/a:</b> ${p.coordinador || "sin confirmar"}</p>`);
    body.push(`<p>${p.brief}</p>`);
    body.push(`<p><b>Cómo se gestiona:</b> ${p.gestion}</p>`);
    if(p.diagnostico){ body.push(`<p><b>Diagnóstico 2026 y desafío 2027:</b> ${p.diagnostico}</p>`); }
    if(gestiones.length){
      body.push(`<p><b>Gestiones propias de este programa:</b></p><ul>`);
      gestiones.forEach(g => body.push(`<li><b>${g.titulo}:</b> ${g.desc}</li>`));
      body.push(`</ul>`);
    }
    const filtradas = orgs.filter(o => (o.participacion_org_programa||[]).some(pp => pp.programa_id === id));
    if(filtradas.length){
      body.push(`<p><b>${p.tiene_organizaciones ? "Organizaciones" : "Lugares"}:</b></p><ul>`);
      filtradas.forEach(o => {
        const conv = (o.convenios||[])[0];
        const convTxt = conv ? ("convenio " + (conv.numero||"s/n") + (conv.fecha_inicio_real ? ", vigencia desde " + conv.fecha_inicio_real : "")) : "sin convenio cargado";
        body.push(`<li>${o.nombre} (${convTxt})</li>`);
      });
      body.push(`</ul>`);
    }
  });

  body.push(`<h2>3. Trámites y gestiones administrativas de la Gerencia</h2>`);
  body.push(`<p><i>Cuestiones de forma — trámites que la Gerencia gestiona, por fuera de la estructura principal de equipo y programas.</i></p>`);
  MAPA_GESTIONES_GENERALES.forEach(g => {
    body.push(`<h3>${g.titulo}</h3>`);
    body.push(`<p>${g.desc}</p>`);
  });

  const htmlDoc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>Informe GOPIA</title>
<style>
  body{font-family:Calibri,Arial,sans-serif; font-size:11pt; color:#22262B;}
  h1{font-size:20pt; color:#2D5F5A;}
  h2{font-size:15pt; color:#2D5F5A; margin-top:24pt; border-bottom:1pt solid #2D5F5A; padding-bottom:4pt;}
  h3{font-size:12.5pt; color:#22262B; margin-top:14pt;}
  p{line-height:1.4;}
  ul{margin-top:4pt;}
  li{margin-bottom:4pt;}
</style></head>
<body>${body.join("\n")}</body></html>`;

  const blob = new Blob(['\ufeff', htmlDoc], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "Informe_GOPIA.doc";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderNodoGestion(g, claseTitulo){
  const bloque = `${g.desc ? `<div class="contenido"><p>${g.desc}</p></div>` : ""}`
    + (g.sub && g.sub.length ? `<ul class="rama">${g.sub.map(s => `<li><span class="titulo-l3">${s.titulo}</span><div class="contenido"><p>${s.desc}</p></div></li>`).join('')}</ul>` : "");
  return `<li><span class="${claseTitulo}">${g.titulo}</span>${bloque}</li>`;
}

function renderTareas(){
  const orden = { urgente:0, alta:1, media:2, baja:3 };
  const pendientes = tareas.filter(t=>t.estado!=="completada")
    .slice().sort((a,b)=> (orden[a.prioridad]??9)-(orden[b.prioridad]??9) || (a.fechaLimite||"9999").localeCompare(b.fechaLimite||"9999"));
  const completadas = tareas.filter(t=>t.estado==="completada");
  return `
    <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:16px; max-width:680px;">
      ${!tareasLoaded ? `<div style="font-size:13px; color:var(--ink-soft);">Sincronizando…</div>` : ""}
      ${(tareasLoaded && pendientes.length===0) ? `<div style="font-size:13px; color:var(--ink-soft); margin-bottom:10px;">No hay tareas pendientes.</div>` : ""}
      ${pendientes.map(t=>tareaCardHtml(t)).join("")}
      <button class="navbtn" style="width:100%; padding:10px; font-size:13px; font-weight:600; margin-top:4px;" onclick="abrirNuevaTarea()">+ Nueva tarea</button>
      ${completadas.length>0 ? `
        <details style="margin-top:16px;">
          <summary style="cursor:pointer; font-size:12px; color:var(--ink-soft); font-weight:600;">Completadas (${completadas.length})</summary>
          <div style="margin-top:8px;">${completadas.map(t=>tareaCardHtml(t)).join("")}</div>
        </details>
      ` : ""}
    </div>
  `;
}

function tareaCardHtml(t){
  const pr = prioridadById(t.prioridad);
  const es = estadoTareaById(t.estado);
  const vencida = t.fechaLimite && t.estado!=="completada" && t.fechaLimite < dateKey(new Date());
  return `
    <div onclick="abrirEdicionTarea('${t.id}')" style="border:1px solid var(--line); border-left:4px solid ${pr.color}; border-radius:8px; padding:9px 12px; margin-bottom:8px; cursor:pointer; background:#fff;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
        <div style="font-size:13.5px; font-weight:700; ${t.estado==="completada"?"text-decoration:line-through; color:var(--ink-soft);":""}">${escapeHtml(t.titulo)}</div>
        <span style="font-size:10.5px; font-weight:700; white-space:nowrap; flex-shrink:0;">${pr.icon} ${pr.label}</span>
      </div>
      <div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; display:flex; flex-wrap:wrap; gap:10px;">
        <span>${es.icon} ${es.label}</span>
        ${t.responsable?`<span>👤 ${escapeHtml(t.responsable)}</span>`:""}
        ${t.fechaLimite?`<span class="mono" style="${vencida?"color:#C24A3D; font-weight:700;":""}">📅 ${t.fechaLimite}${vencida?" (vencida)":""}</span>`:""}
      </div>
      ${t.observaciones?`<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-style:italic;">${escapeHtml(t.observaciones)}</div>`:""}
    </div>
  `;
}

function renderSemana(dias){
  const inicio = inicioSemana(cursor);
  const dias7 = [];
  for(let i=0;i<7;i++){ const d=new Date(inicio); d.setDate(inicio.getDate()+i); dias7.push(d); }
  const today = dateKey(new Date());
  return `
    <div style="display:flex; flex-direction:column; gap:10px;">
      ${dias7.map(d=>{
        const key = dateKey(d);
        const items = (dias[key]||[]).slice().sort((a,b)=>(a.horaInicio||"").localeCompare(b.horaInicio||""));
        const tareasDia = tareas.filter(t=>t.fechaLimite===key && t.estado!=="completada");
        const isToday = key===today;
        return `
          <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:12px;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
              <div class="mono" style="font-size:12px; font-weight:700; color:${isToday?"#fff":"var(--ink)"}; background:${isToday?"var(--accent)":"transparent"}; padding:2px 8px; border-radius:6px;">${DIAS_SEMANA[(d.getDay()+6)%7]} ${d.getDate()}</div>
              <div style="font-size:11px; color:var(--ink-soft);">${MESES[d.getMonth()]}</div>
            </div>
            ${(items.length===0 && tareasDia.length===0) ? `<div style="font-size:12.5px; color:var(--ink-soft);">Sin actividades ni tareas.</div>` : ""}
            ${tareasDia.map(t=>tareaCardHtml(t)).join("")}
            ${agruparParaMostrar(items).map(miembros=>actividadCardHtmlGrupo(miembros,false)).join("")}
            <button class="navbtn" style="width:100%; padding:6px; font-size:12px; font-weight:600; margin-top:4px;" onclick="abrirNueva('${key}')">+ Agregar</button>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderAnio(dias){
  return `
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;">
      ${MESES.map((nombreMes, mIdx)=>{
        const grid = buildMonthGrid(cursor.getFullYear(), mIdx);
        return `<div onclick="irAMes(${cursor.getFullYear()},${mIdx})" style="background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:10px; cursor:pointer;">
          <div class="mono" style="font-size:12px; font-weight:700; margin-bottom:6px;">${nombreMes}</div>
          <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:2px;">
            ${grid.map(d=>{
              const key = dateKey(d);
              const inMonth = d.getMonth()===mIdx;
              const items = dias[key] || [];
              const colores = [...new Set(items.map(a=>a.programaId))].slice(0,3).map(id=>programaById(id).color);
              return `<div style="aspect-ratio:1; border-radius:3px; font-size:8.5px; display:flex; align-items:center; justify-content:center; opacity:${inMonth?1:0.25};
                background:${colores.length?`linear-gradient(90deg, ${colores.join(",")})`:"#F1F0EB"}; color:${colores.length?"#fff":"var(--ink-soft)"}; font-weight:${colores.length?700:400};">${d.getDate()}</div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function actividadCardHtmlGrupo(miembros, expanded){
  if(miembros.length===1) return actividadCardHtml(miembros[0], expanded);
  const a = miembros[0];
  const fondo = colorFondoGrupo(miembros);
  const siglas = miembros.map(m=>(programaById(m.programaId).sigla||programaById(m.programaId).corto)).join(" / ");
  const idsStr = miembros.map(m=>m.id).join(",");
  const susp = miembros.every(m=>m.suspendida);
  return `
    <div onclick="abrirGrupoIds('${idsStr}')" style="${susp?"opacity:.45; background-image:repeating-linear-gradient(135deg, transparent 0 9px, rgba(179,38,30,.10) 9px 11px); ":""}position:relative; border:1px solid var(--line); border-radius:8px; padding:10px 40px 10px 12px; margin-bottom:8px; cursor:pointer; background:#fff; min-height:92px;">
      <div style="position:absolute; top:0; right:0; bottom:0; width:34px; background:${fondo}; border-radius:0 7px 7px 0; display:flex; align-items:center; justify-content:center; overflow:hidden;">
        <span style="writing-mode:vertical-rl; text-orientation:mixed; color:#fff; font-size:8px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.3);">${siglas}</span>
      </div>
      <div style="font-size:10px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px;">🔗 Compartida entre ${miembros.length} programas</div>
      ${susp?`<div style="font-size:10px; font-weight:800; color:#b3261e; letter-spacing:.04em; margin-bottom:3px;">⛔ ACTIVIDAD SUSPENDIDA</div>`:""}
      <div style="font-size:13.5px; font-weight:700;${susp?" text-decoration:line-through;":""}">${escapeHtml(a.titulo)}</div>
      ${a.sede ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">📍 ${escapeHtml(a.sede)}</div>` : ""}
      ${(a.direcciones&&a.direcciones.length) ? a.direcciones.map(d=>`<div style="font-size:11.5px; color:var(--ink-soft);">🧭 ${escapeHtml(d)}</div>`).join("") : ""}
      ${(a.horaInicio||a.horaFin) ? `<div class="mono" style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">${a.horaInicio||"—"}${a.horaFin?` a ${a.horaFin}`:""}</div>` : ""}
    </div>
  `;
}

function actividadCardHtml(a, expanded){
  const p = programaById(a.programaId);
  const estado = a.tramiteEstado ? estadoById(a.tramiteEstado) : null;
  const susp = !!a.suspendida;
  return `
    <div onclick="abrirEdicion('${a.id}')" style="${susp?"opacity:.45; background-image:repeating-linear-gradient(135deg, transparent 0 9px, rgba(179,38,30,.10) 9px 11px); ":""}position:relative; border:1px solid ${p.color}55; border-radius:8px; padding:10px 34px 10px 12px; margin-bottom:8px; cursor:pointer; background:#fff; min-height:92px;">
      <div style="position:absolute; top:0; right:0; bottom:0; width:26px; background:${p.color}; border-radius:0 7px 7px 0; display:flex; align-items:center; justify-content:center; overflow:hidden;">
        <span style="writing-mode:vertical-rl; text-orientation:mixed; color:#fff; font-size:9px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap;">${p.sigla || p.corto}</span>
      </div>
      ${susp?`<div style="font-size:10px; font-weight:800; color:#b3261e; letter-spacing:.04em; margin-bottom:3px;">⛔ ACTIVIDAD SUSPENDIDA</div>`:""}
      <div style="font-size:13.5px; font-weight:700;${susp?" text-decoration:line-through;":""}">${escapeHtml(a.titulo)}</div>
      ${a.sede ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">📍 ${escapeHtml(a.sede)}</div>` : ""}
      ${(a.direcciones&&a.direcciones.length) ? a.direcciones.map(d=>`<div style="font-size:11.5px; color:var(--ink-soft);">🧭 ${escapeHtml(d)}</div>`).join("") : ""}
      ${(a.horaInicio||a.horaFin) ? `<div class="mono" style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">${a.horaInicio||"—"}${a.horaFin?` a ${a.horaFin}`:""}</div>` : ""}
      ${a.organizacion ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">🏢 ${escapeHtml(a.organizacion)}</div>` : ""}
      ${(a.personas && expanded) ? `<div style="font-size:11.5px; color:var(--ink-soft);">👤 ${escapeHtml(a.personas)}</div>` : ""}
      ${(a.micros || (a.viandasLista&&a.viandasLista.some(v=>v.cantidad)) || a.refrigerios) ? `<div style="font-size:11.5px; color:var(--ink-soft);">${[
        a.micros?`🚌 Micros: ${a.micros}`:null,
        (a.viandasLista&&a.viandasLista.filter(v=>v.cantidad).length) ? `🍱 Viandas: ${a.viandasLista.filter(v=>v.cantidad).map(v=>`${v.cantidad}${v.tipo?` ${v.tipo}`:""}`).join(", ")}` : null,
        a.refrigerios?`🥪 Refrigerios: ${a.refrigerios}`:null,
      ].filter(Boolean).join(" · ")}</div>` : ""}
      ${estado ? `<div style="font-size:11px; margin-top:4px;">${estado.icon} ${estado.label}${a.proximoPaso?` — ${escapeHtml(a.proximoPaso)}`:""}</div>` : ""}
      ${(expanded && a.observaciones) ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-style:italic;">${escapeHtml(a.observaciones)}</div>` : ""}
    </div>
  `;
}

/* ===================== Modal ===================== */
function renderModal(){
  const mc = document.getElementById("modal-container");
  if(!modalOpen){ mc.innerHTML = ""; return; }
  if(modalMode === "login"){ mc.innerHTML = loginModalHtml(); return; }
  if(modalKind === "importexcel"){ mc.innerHTML = impModalHtml(); return; }
  if(modalKind === "grupo"){ mc.innerHTML = viewGrupoModalHtml(); return; }
  if(modalKind === "resumen"){ mc.innerHTML = resumenModalHtml(); return; }
  if(modalKind === "tarea"){
    mc.innerHTML = modalMode === "view" ? viewTareaModalHtml() : formTareaModalHtml();
    return;
  }
  if(modalMode === "view"){ mc.innerHTML = viewModalHtml(); return; }
  mc.innerHTML = formModalHtml();
}

          <span style="font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase;">Resumen descargable</span>

          <button type="button" onclick="actualizarResumenFiltro('periodoTipo','semana')" style="flex:1; padding:8px; border-radius:7px; font-size:13px; font-weight:600; border:1.5px solid ${f.periodoTipo==='semana'?"var(--accent)":"var(--line)"}; background:${f.periodoTipo==='semana'?"var(--accent-soft)":"#fff"}; color:${f.periodoTipo==='semana'?"var(--accent)":"var(--ink-soft)"};">Semana</button>
          <button type="button" onclick="actualizarResumenFiltro('periodoTipo','dia')" style="flex:1; padding:8px; border-radius:7px; font-size:13px; font-weight:600; border:1.5px solid ${f.periodoTipo==='dia'?"var(--accent)":"var(--line)"}; background:${f.periodoTipo==='dia'?"var(--accent-soft)":"#fff"}; color:${f.periodoTipo==='dia'?"var(--accent)":"var(--ink-soft)"};">Día puntual</button>

function descargarResumenWord(){
  const f = resumenFiltros;
  let filtradas = (resumenResultados||[]).filter(a => resumenSeleccion.has(a.id));

  const periodoLabel = f.periodoTipo === "dia" ? f.dia : (f.periodoTipo === "semana" ? etiquetaSemanaResumen(f.semana) : `${MESES[parseInt(f.mes)-1]} ${f.anio}`);
  const programaLabel = f.programaId === "todos" ? "Todos los programas" : (programaById(f.programaId)||{}).nombre || f.programaId;
  const tipoLabel = f.tipo === "todos" ? "Único y Jornada normal" : (f.tipo === "unica" ? "Evento único" : "Jornada normal");

  let body = [];
  body.push(`<h1>Resumen de actividades — Agenda GOPIA</h1>`);
  body.push(`<p><b>Programa:</b> ${programaLabel}<br/><b>Período:</b> ${periodoLabel}<br/><b>Tipo:</b> ${tipoLabel}${f.suspendidas==="excluir" ? "<br/><b>Suspendidas:</b> no incluidas" : ""}</p>`);

  if(filtradas.length === 0){
    body.push(`<p><i>No hay actividades cargadas que coincidan con estos filtros.</i></p>`);
  } else {
    filtradas.forEach(a => {
      const progs = (a.programaIds||[a.programaId]).map(id => (programaById(id)||{}).corto || id).join(", ");
      body.push(`<h3>${escapeHtml(a.titulo||"(sin título)")}${a.suspendida?" — ACTIVIDAD SUSPENDIDA":""}</h3>`);
      body.push(`<p>`
        + `<b>Fecha:</b> ${a.fecha}${a.fechaHasta ? " a " + a.fechaHasta : ""}<br/>`
        + (a.horaInicio ? `<b>Horario:</b> ${a.horaInicio}${a.horaFin ? " a " + a.horaFin : ""}<br/>` : "")
        + `<b>Programa/s:</b> ${progs}<br/>`
        + (a.organizacion ? `<b>Organización:</b> ${escapeHtml(a.organizacion)}<br/>` : "")
        + (a.sede ? `<b>Sede:</b> ${escapeHtml(a.sede)}<br/>` : "")
        + (a.personas ? `<b>Cantidad de personas:</b> ${escapeHtml(String(a.personas))}<br/>` : "")
        + (a.micros ? `<b>Micros:</b> ${escapeHtml(String(a.micros))}<br/>` : "")
        + (a.refrigerios ? `<b>Refrigerios:</b> ${escapeHtml(String(a.refrigerios))}<br/>` : "")
        + (a.tramiteActivo ? `<b>Trámite:</b> ${(ESTADOS_TRAMITE.find(e=>e.id===a.tramiteEstado)||{}).label||a.tramiteEstado}<br/>` : "")
        + (a.observaciones ? `<b>Observaciones:</b> ${escapeHtml(a.observaciones)}` : "")
        + `</p>`);
    });
  }

  const htmlDoc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>Resumen Agenda GOPIA</title>
<style>

  p{line-height:1.5;}
</style></head>
<body>${body.join("\n")}</body></html>`;

  const blob = new Blob(['\ufeff', htmlDoc], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `Resumen_Agenda_GOPIA_${f.periodoTipo==="dia" ? f.dia : (f.periodoTipo==="semana" ? "semana_"+rangoSemana(f.semana).desde : f.anio+"-"+f.mes)}.doc`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  cerrarModal();
}

          <div style="margin-bottom:10px;"><label class="fieldLabel">Estado del trámite</label>
            <select class="inputStyle" onchange="updateForm('tramiteEstado', this.value)">
              ${ESTADOS_TRAMITE.map(e=>`<option value="${e.id}" ${form.tramiteEstado===e.id?"selected":""}>${e.icon} ${e.label}</option>`).join("")}
            </select>
          </div>
          <div style="margin-bottom:10px;"><label class="fieldLabel">Próximo paso</label>
            <input class="inputStyle" value="${escapeHtml(form.proximoPaso)}" oninput="updateForm('proximoPaso', this.value)" />
          </div>
        ` : ""}

        <div style="margin-bottom:10px;"><label class="fieldLabel">Observaciones</label>
          <textarea class="inputStyle" rows="2" oninput="updateForm('observaciones', this.value)">${escapeHtml(form.observaciones)}</textarea>
        </div>

        ${(form.id && form.grupoId) ? `
        <div style="margin:14px 0; padding:12px; background:var(--accent-soft); border-radius:8px;">
          <div style="display:flex; align-items:flex-start; gap:8px;">
            <input type="checkbox" id="aplicar-grupo" style="margin-top:2px;" ${form.aplicarATodoElGrupo?"checked":""} onchange="toggleAplicarGrupo(this.checked)" />
            <label for="aplicar-grupo" style="font-size:13px; font-weight:600; color:var(--accent);">Aplicar estos cambios a todas las fechas de esta actividad (${actividades.filter(a=>a.grupoId===form.grupoId).length} en total)</label>
          </div>
          <div style="font-size:11px; color:var(--ink-soft); margin-top:5px; margin-left:26px;">La fecha y el programa de cada copia no se tocan — se actualiza el resto (título, sede, horario, dirección, etc.) en todas a la vez.</div>
        </div>
        ` : ""}

        ${form.id ? `
        <div style="margin:14px 0; padding-top:14px; border-top:1px solid var(--line);">
          <label class="fieldLabel">Repetir esta actividad en otra fecha puntual</label>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <input type="date" class="inputStyle" value="${nuevaFechaCopia}" oninput="nuevaFechaCopia=this.value" />
            <button type="button" onclick="duplicarEnFecha()" style="white-space:nowrap; background:var(--accent-soft); color:var(--accent); border-radius:7px; padding:0 14px; font-weight:700; font-size:13px;">+ Duplicar</button>
          </div>
          <div style="font-size:11px; color:var(--ink-soft); margin-top:5px;">Crea una copia idéntica de esta actividad en la fecha elegida, en el mismo programa.</div>
        </div>
        ` : ""}

        <div style="display:flex; justify-content:space-between; margin-top:16px;">
          ${form.id ? `<button class="navbtn" style="width:auto; color:#B3413A; border-color:#EAB9B2; padding:8px 12px;" onclick="eliminarActividad('${form.id}')">Eliminar</button>` : "<span></span>"}
          <button onclick="guardarActividad()" style="background:var(--accent); color:#fff; border-radius:8px; padding:9px 18px; font-weight:700; font-size:14px;">Guardar</button>
        </div>
      </div>
    </div>
  `;
}

function viewTareaModalHtml(){
  const t = tareaForm;
  const pr = prioridadById(t.prioridad);
  const es = estadoTareaById(t.estado);
  return `
    <div onclick="cerrarModal()" style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="position:relative; background:#fff; border-radius:14px; padding:22px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span style="font-size:11px; font-weight:700;">${pr.icon} ${pr.label}</span>
          <button onclick="cerrarModal()" style="font-size:18px;">✕</button>
        </div>
        <h2 style="font-size:18px; font-weight:700; margin:0 0 10px 0; ${t.estado==="completada"?"text-decoration:line-through;":""}">${escapeHtml(t.titulo)}</h2>
        <div style="font-size:13px; color:var(--ink-soft); display:flex; flex-direction:column; gap:5px;">
          <div>${es.icon} ${es.label}</div>
          ${t.responsable?`<div>👤 ${escapeHtml(t.responsable)}</div>`:""}
          ${t.fechaLimite?`<div class="mono">📅 ${t.fechaLimite}</div>`:""}
          ${t.observaciones?`<div style="font-style:italic;">${escapeHtml(t.observaciones)}</div>`:""}
        </div>
        <button style="width:100%; margin-top:18px; background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:9px; font-weight:700; font-size:13px;" onclick="${currentUser ? 'toggleModoEditor()' : 'abrirLogin()'}">${currentUser ? 'Activar modo editor' : 'Iniciar sesión para editar'}</button>
      </div>
    </div>
  `;
}

function formTareaModalHtml(){
  const t = tareaForm;
  // El fondo NO cierra el cuadro: se cierra solo con ✕ o al guardar.
  return `
    <div style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="background:#fff; border-radius:14px; padding:22px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h2 style="font-size:17px; font-weight:700; margin:0;">${t.id ? "Editar tarea" : "Nueva tarea"}</h2>
          <button onclick="cerrarModal()" style="font-size:18px;">✕</button>
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Tarea *</label>
          <input class="inputStyle" value="${escapeHtml(t.titulo)}" oninput="updateTareaForm('titulo', this.value)" placeholder="Ej: Firmar convenio con..." />
        </div>

        <div class="stack-mobile" style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Prioridad</label>
            <select class="inputStyle" onchange="updateTareaForm('prioridad', this.value)">
              ${PRIORIDADES.map(p=>`<option value="${p.id}" ${t.prioridad===p.id?"selected":""}>${p.icon} ${p.label}</option>`).join("")}
            </select>
          </div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Estado</label>
            <select class="inputStyle" onchange="updateTareaForm('estado', this.value)">
              ${ESTADOS_TAREA.map(e=>`<option value="${e.id}" ${t.estado===e.id?"selected":""}>${e.icon} ${e.label}</option>`).join("")}
            </select>
          </div>
        </div>

        <div class="stack-mobile" style="display:flex; gap:10px;">
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Responsable</label>
            <input class="inputStyle" value="${escapeHtml(t.responsable)}" oninput="updateTareaForm('responsable', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Fecha límite</label>
            <input type="date" class="inputStyle" value="${t.fechaLimite}" oninput="updateTareaForm('fechaLimite', this.value)" /></div>
        </div>

        <div style="margin-bottom:10px;"><label class="fieldLabel">Observaciones</label>
          <textarea class="inputStyle" rows="2" oninput="updateTareaForm('observaciones', this.value)">${escapeHtml(t.observaciones)}</textarea>
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:16px;">
          ${t.id ? `<button class="navbtn" style="width:auto; color:#B3413A; border-color:#EAB9B2; padding:8px 12px;" onclick="eliminarTarea('${t.id}')">Eliminar</button>` : "<span></span>"}
          <button onclick="guardarTarea()" style="background:var(--accent); color:#fff; border-radius:8px; padding:9px 18px; font-weight:700; font-size:14px;">Guardar</button>
        </div>
      </div>
    </div>
  `;
}

/* ===================== Init ===================== */
render();
</script>
</body>
</html>
