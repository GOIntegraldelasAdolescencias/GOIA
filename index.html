  /* ---- Mapa GOPIA: cuadro sinóptico ---- */

  .titulo-l1{display:inline-block; font-size:17px; font-weight:800; color:#fff; background:var(--accent); padding:7px 16px; border-radius:8px; margin-bottom:10px;}

<script>

/* ===================== Configuración fija de la agenda ===================== */
const PROGRAMAS = [

  { id:"lazos", nombre:"Reconstruyendo Lazos", corto:"Lazos", sigla:"LAZOS", color:"#C15C4A" },

const ESTADOS_TRAMITE = [

  { id:"pendiente", label:"Pendiente", icon:"🟡" },
  { id:"observado", label:"Observado", icon:"🟠" },

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_SEMANA = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const VIANDAS_TIPOS = ["Ejecutivas", "Festivas", "Comunes"];
const TIPOS_REPETICION = [
  { id:"unica", label:"Evento único" },
  { id:"normal", label:"Jornada normal" },
];
function categoriaTipo(tipo){
  return (!tipo || tipo === "unica") ? "unica" : "normal";
}
const PRIORIDADES = [
  { id:"urgente", label:"Urgente", icon:"🔴", color:"#C24A3D" },
  { id:"alta", label:"Prioridad alta", icon:"🟠", color:"#C79A3B" },
  { id:"media", label:"Prioridad media", icon:"🟡", color:"#D8B94A" },
  { id:"baja", label:"Prioridad baja", icon:"🟢", color:"#4C8C5B" },
];
const ESTADOS_TAREA = [
  { id:"pendiente", label:"Pendiente", icon:"🟡" },
  { id:"en_curso", label:"En curso", icon:"🔵" },
  { id:"completada", label:"Completada", icon:"🟢" },
];
const prioridadById = id => PRIORIDADES.find(p=>p.id===id) || PRIORIDADES[2];
const estadoTareaById = id => ESTADOS_TAREA.find(e=>e.id===id) || ESTADOS_TAREA[0];

/* ===================== Helpers ===================== */
const pad = n => String(n).padStart(2,"0");
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const programaById = id => PROGRAMAS.find(p=>p.id===id);
const estadoById = id => ESTADOS_TRAMITE.find(e=>e.id===id);
const emptyForm = () => ({
  id:null, titulo:"", suspendida:false, programaId:PROGRAMAS[0].id, programaIds:[PROGRAMAS[0].id], organizacion:"", sede:"", direcciones:[""],
  fecha:dateKey(new Date()), fechaHasta:"", horaInicio:"", horaFin:"", personas:"", micros:"", viandasLista:[{tipo:"",cantidad:""}], refrigerios:"",
  tramiteActivo:false, tramiteEstado:"pendiente", proximoPaso:"", observaciones:"",
  repetir:"none", repetirHasta:"", grupoId:null, esCampamento:false,
  tipoRepeticion:"unica", diasSemana:[],
  fechasSueltasActivo:false, fechasSueltas:[],
  aplicarATodoElGrupo:false,
});
function generarFechasSemanales(inicioStr, hastaStr, diasSemana){
  const inicio = parseKey(inicioStr);
  const hasta = parseKey(hastaStr);
  const fechas = [];
  const cursor = new Date(inicio);
  let iter = 0;
  while(cursor <= hasta && iter < 1000){
    const diaIdx = (cursor.getDay()+6)%7; // 0=Lun ... 6=Dom, igual criterio que DIAS_SEMANA
    if(diasSemana.includes(diaIdx)) fechas.push(dateKey(cursor));
    cursor.setDate(cursor.getDate()+1);
    iter++;
  }
  return fechas;
}
function generarFechasRepeticion(inicioStr, hastaStr, tipo){
  const inicio = parseKey(inicioStr);
  const hasta = parseKey(hastaStr);
  const fechas = [];
  const cursor = new Date(inicio);
  let iter = 0;
  while(cursor <= hasta && iter < 500){
    fechas.push(dateKey(cursor));
    if(tipo === "diario") cursor.setDate(cursor.getDate()+1);
    else if(tipo === "semanal") cursor.setDate(cursor.getDate()+7);
    else if(tipo === "mensual") cursor.setMonth(cursor.getMonth()+1);
    else if(tipo === "anual") cursor.setFullYear(cursor.getFullYear()+1);
    else break;
    iter++;
  }
  return fechas;
}
function uidGrupo(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("g-"+Math.random().toString(36).slice(2)+Date.now());
}
function onRepetirChange(value){
  form.repetir = value;
  if(value !== "none"){ form.esCampamento = false; form.fechasSueltasActivo = false; }
  if(value === "semanal" && (!form.diasSemana || form.diasSemana.length===0) && form.fecha){
    const d = parseKey(form.fecha);
    form.diasSemana = [(d.getDay()+6)%7];
  }
  renderModal();
}
function toggleDiaSemana(idx){
  if(!form.diasSemana) form.diasSemana = [];
  if(form.diasSemana.includes(idx)) form.diasSemana = form.diasSemana.filter(x=>x!==idx);
  else form.diasSemana = [...form.diasSemana, idx].sort();
  renderModal();
}
function completarHastaMeses(n){
  if(!form.fecha) return;
  const d = parseKey(form.fecha);
  d.setMonth(d.getMonth()+n);
  form.repetirHasta = dateKey(d);
  renderModal();
}
function toggleProgramaForm(id, checked){
  if(checked){ if(!form.programaIds.includes(id)) form.programaIds.push(id); }
  else { form.programaIds = form.programaIds.filter(x=>x!==id); }
  renderModal();
}
function toggleCampamento(checked){
  form.esCampamento = checked;
  if(checked){ form.repetir = "none"; form.fechasSueltasActivo = false; }
  renderModal();
}
function toggleFechasSueltas(checked){
  form.fechasSueltasActivo = checked;
  if(checked){
    form.esCampamento = false;
    form.repetir = "none";
    if(!form.fechasSueltas || form.fechasSueltas.length===0) form.fechasSueltas = [form.fecha || dateKey(new Date())];
  }
  renderModal();
}
function agregarFechaSuelta(){ form.fechasSueltas.push(form.fecha || dateKey(new Date())); renderModal(); }
function quitarFechaSuelta(i){
  form.fechasSueltas.splice(i,1);
  if(form.fechasSueltas.length===0) form.fechasSueltas.push(dateKey(new Date()));
  renderModal();
}
function actualizarFechaSuelta(i, value){ form.fechasSueltas[i] = value; }
const escapeHtml = s => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iniciales = titulo => {
  const palabras = (titulo||"").trim().split(/\s+/).filter(Boolean);
  if(palabras.length>=2) return (palabras[0][0]+palabras[1][0]).toUpperCase();
  return (titulo||"").slice(0,2).toUpperCase();
};
const inicioSemana = d => { const c=new Date(d); const offset=(c.getDay()+6)%7; c.setDate(c.getDate()-offset); return c; };

// Conversión entre el formulario (camelCase, como usa el resto del código) y las columnas de la tabla (snake_case, como las creamos en el SQL)
function toRow(f){
  return {
    titulo: f.titulo,
    programa_id: f.programaId,
    organizacion: f.organizacion || null,
    sede: f.sede || null,
    direcciones: (f.direcciones||[]).map(d=>d.trim()).filter(Boolean),
    fecha: f.fecha,
    hora_inicio: f.horaInicio || null,
    hora_fin: f.horaFin || null,
    personas: f.personas || null,
    micros: f.micros !== "" && f.micros != null ? parseInt(f.micros, 10) : null,
    viandas_detalle: (() => {
      const lista = (f.viandasLista||[])
        .filter(v => v.cantidad !== "" && v.cantidad != null && parseInt(v.cantidad,10) > 0)
        .map(v => ({ tipo: v.tipo || "", cantidad: parseInt(v.cantidad,10) }));
      return lista.length ? lista : null;
    })(),
    refrigerios: f.refrigerios !== "" && f.refrigerios != null ? parseInt(f.refrigerios, 10) : null,
    tramite_estado: f.tramiteActivo ? f.tramiteEstado : null,
    proximo_paso: f.tramiteActivo ? (f.proximoPaso || null) : null,
    observaciones: f.observaciones || null,
    tipo_repeticion: f.tipoRepeticion || "unica",
    suspendida: !!f.suspendida,
  };
}
function fromRow(r){
  return {
    id: r.id,
    titulo: r.titulo || "",
    programaId: r.programa_id,
    organizacion: r.organizacion || "",
    sede: r.sede || "",
    direcciones: (r.direcciones && r.direcciones.length) ? r.direcciones : (r.direccion ? [r.direccion] : []),
    fecha: r.fecha,
    horaInicio: r.hora_inicio ? String(r.hora_inicio).slice(0,5) : "",
    horaFin: r.hora_fin ? String(r.hora_fin).slice(0,5) : "",
    personas: r.personas || "",
    micros: (r.micros !== null && r.micros !== undefined) ? String(r.micros) : "",
    viandasLista: (r.viandas_detalle && Array.isArray(r.viandas_detalle) && r.viandas_detalle.length)
      ? r.viandas_detalle.map(v=>({ tipo: v.tipo || "", cantidad: (v.cantidad!=null?String(v.cantidad):"") }))
      : (r.viandas ? [{ tipo: r.viandas_tipo || "", cantidad: String(r.viandas) }] : [{ tipo:"", cantidad:"" }]),
    refrigerios: (r.refrigerios !== null && r.refrigerios !== undefined) ? String(r.refrigerios) : "",
    tramiteEstado: r.tramite_estado || null,
    proximoPaso: r.proximo_paso || "",
    observaciones: r.observaciones || "",
    grupoId: r.grupo_id || null,
    tipoRepeticion: r.tipo_repeticion || "unica",
    suspendida: !!r.suspendida,
  };
}

const emptyTareaForm = () => ({
  id:null, titulo:"", responsable:"", prioridad:"media", estado:"pendiente", fechaLimite:"", observaciones:"",
});
function toTareaRow(t){
  return {
    titulo: t.titulo,
    responsable: t.responsable || null,

    estado: t.estado || "pendiente",

}
function fromTareaRow(r){
  return {
    id: r.id,
    titulo: r.titulo || "",
    responsable: r.responsable || "",
    prioridad: r.prioridad || "media",
    estado: r.estado || "pendiente",
    fechaLimite: r.fecha_limite || "",

}

/* ===================== Estado ===================== */
let currentUser = null;
let modoEditor = false; // arranca siempre en modo vista, aunque haya sesión iniciada
function puedeEditar(){ return !!currentUser && modoEditor; }
function toggleModoEditor(){ modoEditor = !modoEditor; renderRoot(); }
let loginError = "";

let actividades = [];
let dataLoaded = false;
let view = "mes";
let cursor = new Date();
let selectedDay = dateKey(new Date());
let filtro = new Set(PROGRAMAS.map(p=>p.id));
let busqueda = "";
let filtroTipo = new Set(["unica"]);
let verSuspendidas = true; // false = las actividades suspendidas se ocultan de la agenda y de la búsqueda
function toggleVerSuspendidas(){ verSuspendidas = !verSuspendidas; renderRoot(); }
let detailDay = dateKey(new Date());
let form = emptyForm();
let modalOpen = false;
let modalMode = "form"; // "form" | "view" | "login"
let modalKind = "actividad"; // "actividad" | "tarea" | "resumen"
let resumenFiltros = { programaId:"todos", periodoTipo:"mes", anio:String(new Date().getFullYear()), mes:String(new Date().getMonth()+1).padStart(2,"0"), dia:dateKeySafe(), semana:dateKeySafe(), tipo:"todos", suspendidas:"incluir" };
let resumenResultados = null; // null = todavía no se buscó; [] o [...] = resultado de la búsqueda
let resumenSeleccion = new Set();
function dateKeySafe(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function abrirResumen(){ modalKind = "resumen"; modalMode = "form"; modalOpen = true; resumenResultados = null; resumenSeleccion = new Set(); renderModal(); }
function actualizarResumenFiltro(campo, valor){ resumenFiltros[campo] = valor; resumenResultados = null; renderModal(); }
// Semana de lunes a domingo que contiene el día elegido → { desde, hasta } como "AAAA-MM-DD"
function rangoSemana(diaKey){
  const ini = inicioSemana(parseKey(diaKey || dateKeySafe()));
  const fin = new Date(ini); fin.setDate(fin.getDate()+6);
  return { desde: dateKey(ini), hasta: dateKey(fin) };

function etiquetaSemanaResumen(diaKey){
  const r = rangoSemana(diaKey);
  const fmt = k => { const [y,m,d] = k.split("-"); return `${d}/${m}/${y}`; };
  return `Semana del ${fmt(r.desde)} al ${fmt(r.hasta)}`;

function buscarResumen(){
  const f = resumenFiltros;
  const rs = rangoSemana(f.semana);
  const filtradas = actividades.filter(a => {
    if(f.programaId !== "todos" && !(a.programaIds||[a.programaId]).includes(f.programaId)) return false;
    if(f.tipo !== "todos" && categoriaTipo(a.tipoRepeticion) !== f.tipo) return false;
    if(f.suspendidas === "excluir" && a.suspendida) return false;
    if(f.periodoTipo === "dia"){

    } else if(f.periodoTipo === "semana"){
      if(!a.fecha || a.fecha < rs.desde || a.fecha > rs.hasta) return false;
    } else {
      const ym = a.fecha ? a.fecha.slice(0,7) : "";
      if(ym !== `${f.anio}-${f.mes}`) return false;
    }
    return true;
  }).sort((a,b) => (a.fecha||"").localeCompare(b.fecha||"") || (a.horaInicio||"").localeCompare(b.horaInicio||""));

async function guardarActividad(){
  if(!form.titulo || !form.titulo.trim()){ alert("Completá al menos el título."); return; }
  if(!form.fecha){ alert("Elegí una fecha."); return; }

  if(!form.id){
    // Actividad nueva: puede expandirse por repetición y/o por varios programas a la vez
    if(!form.programaIds || form.programaIds.length===0){ alert("Elegí al menos un programa."); return; }
    let fechas = [form.fecha];
    if(form.fechasSueltasActivo){
      fechas = (form.fechasSueltas||[]).filter(Boolean);
      if(fechas.length===0){ alert("Agregá al menos una fecha."); return; }
    } else if(form.repetir && form.repetir !== "none"){
      if(!form.repetirHasta){ alert("Elegí hasta qué fecha se repite."); return; }
      if(form.repetir === "semanal" && form.diasSemana && form.diasSemana.length>0){
        fechas = generarFechasSemanales(form.fecha, form.repetirHasta, form.diasSemana);
      } else {
        fechas = generarFechasRepeticion(form.fecha, form.repetirHasta, form.repetir);
      }
      if(fechas.length===0){ alert("La fecha \"hasta\" tiene que ser posterior a la fecha de inicio."); return; }
    }

    const grupoId = (fechas.length>1 || form.programaIds.length>1) ? uidGrupo() : null;
    const base = toRow(form);
    const filas = [];
    for(const pid of form.programaIds){
      for(const f of fechas){
        filas.push({ ...base, programa_id: pid, fecha: f, grupo_id: grupoId });
      }
    }
    const { error } = await sb.from("actividades").insert(filas);
    if(error){
      console.error(error);
      alert("No se pudo guardar. Revisá tu conexión o que tengas sesión iniciada.");
      return;
    }
    modalOpen = false;
    form = emptyForm();
    renderModal();
    cargarActividades();
    return;
  }

  // Edición de una actividad ya existente (una sola fila, o todo el grupo si se pidió)
  const row = toRow(form);
  let error;
  if(form.grupoId && form.aplicarATodoElGrupo){
    const { fecha, programa_id, ...camposComunes } = row;
    ({ error } = await sb.from("actividades").update(camposComunes).eq("grupo_id", form.grupoId));
  } else {
    ({ error } = await sb.from("actividades").update(row).eq("id", form.id));
  }
  if(error){
    console.error(error);
    alert("No se pudo guardar. Revisá tu conexión o que tengas sesión iniciada.");
    return;
  }
  modalOpen = false;
  form = emptyForm();
  renderModal();
  cargarActividades();
}

/* ===================== Importar Excel de Micros =====================
   Lee la planilla "Micros" (un micro por renglón) y la convierte en UNA actividad por salida:
   - Misma fecha + hora + programa solicitante + detalle  =>  una sola actividad; "Micros" = cantidad de renglones.
   - Responsable = horarios (salida / regreso) + nombre del solicitante + celular.
   - Sede = "Sale de". Dirección = "Destino".
   - "Talleres habituales" y "Prácticas…" => Jornada normal. El resto => Evento único.
   Antes de guardar muestra una vista previa; las actividades ya cargadas (misma fecha + programa + título) se omiten. */

/* IMPEXCEL-PURE-START */
function impNorm(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
function impTexto(v){ return String(v==null?"":v).replace(/\s+/g," ").trim(); }
function impFecha(v){
  if(v==null || v==="") return null;
  let y,m,d;
  if(typeof v === "number"){
    const p = XLSX.SSF.parse_date_code(v);
    if(!p) return null;
    y=p.y; m=p.m; d=p.d;
  } else {
    const s = String(v).trim();
    let r = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,5})(?:\D|$)/);
    if(r){ d=+r[1]; m=+r[2]; y=+r[3]; if(r[3].length===2) y+=2000; }
    else {
      r = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if(!r) return null;
      y=+r[1]; m=+r[2]; d=+r[3];
    }
  }
  if(!(y>=2000 && y<=2100)) return null;
  const dt = new Date(y, m-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return null;
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function impHora(v){
  if(v==null || v==="") return "";
  if(typeof v === "number"){
    const min = Math.round((v - Math.floor(v)) * 1440) % 1440;
    return `${String(Math.floor(min/60)).padStart(2,"0")}:${String(min%60).padStart(2,"0")}`;
  }
  const s = String(v).trim();
  let r = s.match(/^(\d{1,2}):(\d{2})/);
  if(r) return `${r[1].padStart(2,"0")}:${r[2]}`;
  r = s.match(/^(\d{1,2})\s*(?:h|hs|hrs)?\.?$/i);
  if(r) return `${r[1].padStart(2,"0")}:00`;
  return "";
}
function impPrograma(prog){
  const n = impNorm(prog);
  if(n.startsWith("adolescenc")) return "adolescencias";
  if(n.startsWith("lideres")) return "lideres";
  if(n.startsWith("coopa")) return "coopa";
  if(n.startsWith("tabf") || n.includes("bajo flores")) return "bajoflores";
  if(n.startsWith("reconstruyendo") || n.startsWith("lazos")) return "lazos";
  if(n.startsWith("turismo")) return "turismo";
  return null;
}
function impTipo(detalle){
  const n = impNorm(detalle);
  if(n.includes("talleres habituales") || n.startsWith("practicas")) return "normal";
  return "unica";
}
const IMP_COLUMNAS = [
  ["prog",    n => n.startsWith("progr")],
  ["tel",     n => n.startsWith("telefono")],
  ["fecha",   n => n === "fecha"],
  ["hora",    n => n === "hora"],
  ["veh",     n => n.startsWith("vehiculo")],
  ["adultos", n => n.includes("adultos")],
  ["ninos",   n => n.includes("ninos")],
  ["sale",    n => n.startsWith("sale")],
  ["destino", n => n === "destino"],
  ["regreso", n => n === "regreso"],
  ["solic",   n => n.includes("solicitante")],
  ["obs",     n => n.startsWith("observ")],
  ["cant",    n => n.includes("asistentes")],
  ["conj",    n => n.includes("conjunto")],
  ["detalle", n => n.startsWith("detalle")],
];
function impDetectarEncabezado(aoa){
  for(let i=0; i<Math.min(aoa.length, 20); i++){
    const heads = (aoa[i]||[]).map(impNorm);
    if(!heads.includes("fecha") || !heads.some(h=>h.startsWith("detalle"))) continue;
    const usadas = new Set(); const col = {};
    for(const [k, test] of IMP_COLUMNAS){
      const j = heads.findIndex((h,idx) => !usadas.has(idx) && h && test(h));
      if(j>=0){ col[k]=j; usadas.add(j); }
    }
    return { fila:i, col };
  }
  return null;
}
function impPlural(n, uno, varios){ return n===1 ? uno : varios; }
function impProcesarFilas(aoa){
  const enc = impDetectarEncabezado(aoa);
  if(!enc) return { ok:false, error:"No encontré los encabezados de la planilla (necesito al menos las columnas FECHA y DETALLE DE LA ACTIVIDAD/EVENTO)." };
  const faltan = ["prog","fecha","detalle"].filter(k => enc.col[k]===undefined);
  if(faltan.length) return { ok:false, error:"Faltan columnas obligatorias: " + faltan.map(k=>({prog:"PROGR. SOLICITANTE",fecha:"FECHA",detalle:"DETALLE DE LA ACTIVIDAD/EVENTO"}[k])).join(", ") + "." };
  const c = enc.col;
  const get = (row,k) => c[k]===undefined ? "" : row[c[k]];
  const errores = []; const avisos = [];
  const grupos = new Map();
  let filas = 0;
  for(let i=enc.fila+1; i<aoa.length; i++){
    const row = aoa[i] || [];
    if(!row.some(v => impTexto(v)!=="")) continue;
    const detalle = impTexto(get(row,"detalle"));
    const progTxt = impTexto(get(row,"prog"));
    const fechaRaw = get(row,"fecha");
    if(!detalle && impTexto(fechaRaw)==="") continue;
    filas++;
    const nroFila = i+1;
    const base = { fila:nroFila, programa:progTxt, detalle, fechaTexto: impTexto(fechaRaw) };
    if(!detalle){ errores.push({...base, motivo:"Falta el detalle de la actividad."}); continue; }
    const fecha = impFecha(fechaRaw);
    if(!fecha){ errores.push({...base, motivo:`Fecha inválida o ilegible ("${impTexto(fechaRaw)}"). Corregila en el Excel y volvé a importar.`}); continue; }
    const programaId = impPrograma(progTxt);
    if(!programaId){ errores.push({...base, motivo:`Programa no reconocido ("${progTxt}").`}); continue; }
    const hora = impHora(get(row,"hora"));
    const key = [fecha, hora, impNorm(progTxt), impNorm(detalle)].join("|");
    if(!grupos.has(key)) grupos.set(key, { fecha, hora, progTxt, programaId, detalle, rows:[], filasExcel:[] });
    const g = grupos.get(key);
    g.rows.push({
      veh: impTexto(get(row,"veh")), adultos: impTexto(get(row,"adultos")), ninos: impTexto(get(row,"ninos")),
      sale: impTexto(get(row,"sale")), destino: impTexto(get(row,"destino")), regreso: impTexto(get(row,"regreso")),
      tel: impTexto(get(row,"tel")), solic: impTexto(get(row,"solic")), obs: impTexto(get(row,"obs")),
      cant: impTexto(get(row,"cant")), conj: impTexto(get(row,"conj")),
    });
    g.filasExcel.push(nroFila);
  }
  const uniq = arr => { const vistos = new Set(); const out=[]; for(const v of arr){ if(!v) continue; const k=impNorm(v); if(!vistos.has(k)){ vistos.add(k); out.push(v); } } return out; };
  const esConj = x => { const n = impNorm(x.conj); return n!=="" && n!=="no"; };
  // 1) Bloques = una salida. Los grupos "en conjunto con otra área" del mismo día y detalle se juntan en un solo bloque.
  const bloques = new Map();
  for(const [k, g] of grupos){
    const conj = g.rows.some(esConj);
    const bk = conj ? `conj|${g.fecha}|${impNorm(g.detalle)}` : k;
    if(!bloques.has(bk)) bloques.set(bk, { fecha:g.fecha, detalle:g.detalle, filas:[], filasExcel:[] });
    const b = bloques.get(bk);
    g.rows.forEach(r => b.filas.push({ ...r, hora:g.hora, progTxt:g.progTxt, programaId:g.programaId }));
    g.filasExcel.forEach(n => b.filasExcel.push(n));
  }
  const items = [];
  let nroBloque = 0;
  for(const b of bloques.values()){
    nroBloque++;
    const programasBloque = uniq(b.filas.map(f=>f.programaId));
    const hayVarios = new Set(b.filas.map(f => [impNorm(f.progTxt), impNorm(f.sale), f.hora].join("|"))).size > 1;
    for(const pid of programasBloque){
      const r = b.filas.filter(f => f.programaId===pid);
      const esMicro = x => !x.veh || impNorm(x.veh).includes("micro");
      const micros = r.filter(esMicro).length;
      const otros = r.filter(x => !esMicro(x));
      const horas = uniq(r.map(x=>x.hora)).sort();
      const partes = [];
      if(horas.length===1) partes.push(`Salida ${horas[0]}`);
      else if(horas.length>1) partes.push(`Salida ${horas[0]} a ${horas[horas.length-1]} (según sede)`);
      const regresos = uniq(r.map(x=>x.regreso));
      if(regresos.length) partes.push(`Regreso ${regresos.join(" / ")}`);
      const solics = uniq(r.map(x=>x.solic)); if(solics.length) partes.push(solics.join(" / "));
      const tels = uniq(r.map(x=>x.tel)); if(tels.length) partes.push(`Cel. ${tels.join(" / ")}`);
      const pax1 = x => [x.ninos ? `${x.ninos} ${impPlural(+x.ninos,"niño/a","niños/as")}` : "", x.adultos ? `${x.adultos} ${impPlural(+x.adultos,"adulto","adultos")}` : ""].filter(Boolean).join(" y ");
      const obs = [];
      uniq(r.map(x=>x.obs)).forEach(o => obs.push(o));
      const orgDe = x => { const m = pid==="adolescencias" ? x.progTxt.match(/^\s*adolescencias?\s*[-–—]\s*(.+)$/i) : null; return m ? impTexto(m[1]) : ""; };
      const orgs = uniq(r.map(orgDe));
      if(hayVarios && r.length>1){
        // Detalle por sede / institución
        const porSede = new Map();
        r.forEach(x => { const k=[orgDe(x), impNorm(x.sale), x.hora].join("|"); if(!porSede.has(k)) porSede.set(k, { org:orgDe(x), sale:x.sale, hora:x.hora, pax:[] }); porSede.get(k).pax.push(pax1(x)); });
        const lineas = [...porSede.values()].map(v => `${v.org||"—"}${v.sale?` (sale de ${v.sale})`:""}${v.hora?` ${v.hora}`:""}: ${v.pax.length} ${impPlural(v.pax.length,"micro","micros")}${v.pax.filter(Boolean).length?` — ${v.pax.filter(Boolean).join(" | ")}`:""}`);
        obs.push("Detalle por sede:\n" + lineas.map(l=>"- "+l).join("\n"));
      } else {
        const pax = r.map(pax1); const paxUnicos = uniq(pax);
        if(paxUnicos.length === 1) obs.push((r.length>1 ? "Por micro: " : "Pasajeros: ") + paxUnicos[0]);
        else if(paxUnicos.length > 1) obs.push("Pasajeros — " + pax.map((p,i)=>p ? `Micro ${i+1}: ${p}` : "").filter(Boolean).join(" | "));
        const cants = uniq(r.map(x=>x.cant).filter(v => /^\d+$/.test(v)));
        if(cants.length) obs.push(`Cant. de asistentes (planilla): ${cants.join(" / ")}`);
      }
      const conjs = uniq(r.map(x=>x.conj).filter(v => impNorm(v)!=="no"));
      if(conjs.length) obs.push(`Con otra área: ${conjs.join(" / ")}`);
      if(programasBloque.length>1) obs.push(`Salida compartida con: ${programasBloque.filter(p=>p!==pid).map(p=>({adolescencias:"Adolescencias",lazos:"Reconstruyendo Lazos",lideres:"Líderes",coopa:"COOPA",bajoflores:"Bajo Flores",turismo:"Turismo Social"}[p]||p)).join(", ")}`);
      if(otros.length) obs.push(`Otros vehículos: ${uniq(otros.map(x=>x.veh)).join(" / ")} (${otros.length})`);
      const sedes = uniq(r.map(x=>x.sale));
      items.push({
        fecha: b.fecha, horaInicio: horas[0] || "", programaId: pid, programaTexto: uniq(r.map(x=>x.progTxt)).join(" / "),
        titulo: b.detalle,
        organizacion: orgs.join(", "),
        sede: sedes.length>2 ? "Varias sedes (ver observaciones)" : sedes.join(" / "),
        direcciones: (() => { const d = uniq(r.map(x=>x.destino)); return d.length ? d : [""]; })(),
        personas: partes.join(" · "),
        micros: String(micros),
        observaciones: obs.join(". "),
        tipoRepeticion: impTipo(b.detalle),
        bloque: nroBloque, programasBloque,
        filasExcel: r.map((x,i)=>i), renglones: r.length,
      });
    }
  }
  items.sort((a,b) => (a.fecha+a.horaInicio).localeCompare(b.fecha+b.horaInicio) || a.programaTexto.localeCompare(b.programaTexto));
  return { ok:true, filas, items, errores, avisos, formato:"micros" };
}

const IMP_STOP = new Set(["para","salida","salidas","visita","taller","talleres","institucion","instituciones","adolescentes","adolescente","actividad","evento","jornada","con","del","los","las","una","por","cierre"]);
function impTokens(t){
  return new Set(impNorm(t).split(/[^a-z0-9]+/).map(w => (w.length>4 && w.endsWith("s")) ? w.slice(0,-1) : w).filter(w => w.length>=4 && !IMP_STOP.has(w)));
}
// ¿Ya hay en la agenda algo igual o muy parecido? Misma fecha + mismo programa + mismo tipo (evento único / jornada normal).
// Devuelve { motivo, titulo } o null.
function impBuscarRepetida(it, existentes){
  const cat = t => (!t || t==="unica") ? "unica" : "normal";
  const mismoDia = existentes.filter(a => a.fecha===it.fecha && a.programaId===it.programaId && cat(a.tipoRepeticion)===cat(it.tipoRepeticion));
  if(!mismoDia.length) return null;
  const nt = impNorm(it.titulo);
  const tk = impTokens(it.titulo + " " + it.organizacion);
  const orgC = impNorm(it.organizacion);
  for(const a of mismoDia){
    const na = impNorm(a.titulo);
    if(na===nt) return { motivo:"mismo título", titulo:a.titulo };
    if(Math.min(na.length, nt.length) >= 8 && (na.includes(nt) || nt.includes(na))) return { motivo:"título parecido", titulo:a.titulo };
    const oa = impNorm(a.organizacion);
    if(orgC.length>=4 && oa.length>=4 && (orgC===oa || orgC.includes(oa) || oa.includes(orgC))) return { motivo:"misma institución ese día", titulo:a.titulo };
    const ta = impTokens(a.titulo + " " + (a.organizacion||""));
    let comunes = 0; tk.forEach(w => { if(ta.has(w)) comunes++; });
    const minimo = Math.min(tk.size, ta.size);
    if(minimo>0 && comunes>=Math.min(2,minimo) && comunes/minimo >= 0.6 && comunes>=2) return { motivo:"título parecido", titulo:a.titulo };
  }
  // Mismo horario: en los programas con pocas salidas por día alcanza con eso; en Adolescencias hace falta que coincida algo más (sede / destino / institución).
  if(it.horaInicio){
    const ext = impTokens([it.titulo, it.organizacion, it.sede, (it.direcciones||[]).join(" ")].join(" "));
    for(const a of mismoDia){
      if((a.horaInicio||"").slice(0,5) !== it.horaInicio) continue;
      if(it.programaId !== "adolescencias") return { motivo:"mismo día, programa y horario", titulo:a.titulo };
      const ea = impTokens([a.titulo, a.organizacion, a.sede, (a.direcciones||[]).join(" ")].join(" "));
      let c = 0; ext.forEach(w => { if(ea.has(w)) c++; });
      if(c>=1) return { motivo:"mismo horario y misma sede/destino", titulo:a.titulo };
    }
  }
  return null;
}
// Aviso (no omite): algo muy parecido cargado en OTRA fecha — puede ser la misma salida con la fecha distinta.
function impBuscarOtraFecha(it, existentes){
  const cat = t => (!t || t==="unica") ? "unica" : "normal";
  if(cat(it.tipoRepeticion)!=="unica") return null;
  const tk = impTokens(it.titulo + " " + it.organizacion);
  if(tk.size<2) return null;
  for(const a of existentes){
    if(a.fecha===it.fecha || a.programaId!==it.programaId || cat(a.tipoRepeticion)!=="unica") continue;
    const ta = impTokens(a.titulo + " " + (a.organizacion||""));
    let c = 0; tk.forEach(w => { if(ta.has(w)) c++; });
    if(c>=3 || (c>=2 && c/Math.min(tk.size,ta.size) >= 0.75)) return { fecha:a.fecha, titulo:a.titulo };
  }
  return null;
}

/* ---- Formato "agenda" (lo que exporta la propia agenda en Excel / JSON) ---- */
function impProgramaAgenda(txt){
  const n = impNorm(txt);
  if(!n) return null;
  const p = PROGRAMAS.find(p => impNorm(p.id)===n || impNorm(p.nombre)===n || impNorm(p.corto)===n || impNorm(p.sigla)===n);
  return p ? p.id : impPrograma(txt);
}
const IMP_COLUMNAS_AGENDA = [
  ["titulo",       n => n==="actividad" || n==="titulo"],
  ["programa",     n => n.startsWith("programa")],
  ["organizacion", n => n.startsWith("organizacion")],
  ["sede",         n => n.startsWith("sede")],
  ["direcciones",  n => n.startsWith("direccion") || n==="destino"],
  ["fecha",        n => n==="fecha"],
  ["horaInicio",   n => n==="hora inicio" || n==="hora de inicio" || n==="hora"],
  ["horaFin",      n => n==="hora fin" || n==="hora de fin"],
  ["personas",     n => n.startsWith("responsable") || n==="personas"],
  ["micros",       n => n==="micros"],
  ["viandas",      n => n.startsWith("viandas")],
  ["refrigerios",  n => n.startsWith("refrigerios")],
  ["estado",       n => n.startsWith("estado")],
  ["proximoPaso",  n => n.startsWith("proximo paso")],
  ["observaciones",n => n.startsWith("observaciones")],
  ["tipo",         n => n==="tipo"],
  ["suspendida",   n => n.startsWith("suspendid")],
];
function impDetectarAgenda(aoa){
  for(let i=0; i<Math.min(aoa.length, 20); i++){
    const heads = (aoa[i]||[]).map(impNorm);
    const usadas = new Set(); const col = {};
    for(const [k, test] of IMP_COLUMNAS_AGENDA){
      const j = heads.findIndex((h,idx) => !usadas.has(idx) && h && test(h));
      if(j>=0){ col[k]=j; usadas.add(j); }
    }
    if(col.titulo!==undefined && col.fecha!==undefined && col.programa!==undefined) return { fila:i, col };
  }
  return null;
}
function impViandasDesdeTexto(t){
  const out = [];
  impTexto(t).split(/[;,]/).forEach(par => {
    const m = par.match(/^\s*(.*?)\s*[:=]\s*(\d+)\s*$/);
    if(m) out.push({ tipo:m[1], cantidad:m[2] });
  });
  return out;
}
function impProcesarAgenda(aoa){
  const enc = impDetectarAgenda(aoa);
  if(!enc) return { ok:false, error:"No reconozco las columnas. Necesito al menos: Actividad, Programa y Fecha." };
  const c = enc.col;
  const get = (row,k) => c[k]===undefined ? "" : row[c[k]];
  const items = []; const errores = []; let filas = 0;
  for(let i=enc.fila+1; i<aoa.length; i++){
    const row = aoa[i] || [];
    if(!row.some(v => impTexto(v)!=="")) continue;
    filas++;
    const titulo = impTexto(get(row,"titulo"));
    const progTxt = impTexto(get(row,"programa"));
    const base = { fila:i+1, programa:progTxt, detalle:titulo, fechaTexto:impTexto(get(row,"fecha")) };
    if(!titulo){ errores.push({...base, motivo:"Falta el nombre de la actividad."}); continue; }
    const fecha = impFecha(get(row,"fecha"));
    if(!fecha){ errores.push({...base, motivo:`Fecha inválida o ilegible ("${impTexto(get(row,"fecha"))}").`}); continue; }
    const programaId = impProgramaAgenda(progTxt);
    if(!programaId){ errores.push({...base, motivo:`Programa no reconocido ("${progTxt}").`}); continue; }
    const tipoN = impNorm(get(row,"tipo"));
    const est = impNorm(get(row,"estado"));
    const estadoId = (typeof ESTADOS_TRAMITE!=="undefined" ? ESTADOS_TRAMITE.find(e => impNorm(e.label)===est || e.id===est) : null);
    const dirs = impTexto(get(row,"direcciones")).split(" / ").map(x=>x.trim()).filter(Boolean);
    items.push({
      fecha, horaInicio: impHora(get(row,"horaInicio")), horaFin: impHora(get(row,"horaFin")),
      programaId, programaTexto: progTxt, titulo,
      organizacion: impTexto(get(row,"organizacion")), sede: impTexto(get(row,"sede")),
      direcciones: dirs.length ? dirs : [""],
      personas: impTexto(get(row,"personas")),
      micros: /^\d+$/.test(impTexto(get(row,"micros"))) ? impTexto(get(row,"micros")) : "",
      viandasLista: (() => { const v = impViandasDesdeTexto(get(row,"viandas")); return v.length ? v : [{tipo:"",cantidad:""}]; })(),
      refrigerios: /^\d+$/.test(impTexto(get(row,"refrigerios"))) ? impTexto(get(row,"refrigerios")) : "",
      tramiteEstado: estadoId ? estadoId.id : null, proximoPaso: impTexto(get(row,"proximoPaso")),
      observaciones: impTexto(get(row,"observaciones")),
      tipoRepeticion: (tipoN.startsWith("jornada") || tipoN==="normal") ? "normal" : "unica",
      suspendida: ["si","sí","x","true","1","suspendida"].includes(impNorm(get(row,"suspendida"))) || impNorm(get(row,"suspendida"))==="si",
      bloque: items.length+1, programasBloque:[programaId], renglones:1,
    });
  }
  items.sort((a,b) => (a.fecha+a.horaInicio).localeCompare(b.fecha+b.horaInicio));
  return { ok:true, filas, items, errores, avisos:[], formato:"agenda" };
}
function impItemsDesdeJson(data){
  if(!Array.isArray(data)) return { ok:false, error:"El JSON tiene que ser una lista de actividades." };
  const items = []; const errores = [];
  data.forEach((o, i) => {
    o = o || {};
    const titulo = impTexto(o.titulo);
    const base = { fila:i+1, programa:impTexto(o.programaId), detalle:titulo, fechaTexto:impTexto(o.fecha) };
    if(!titulo){ errores.push({...base, motivo:"Falta el título."}); return; }
    const fecha = impFecha(o.fecha);
    if(!fecha){ errores.push({...base, motivo:`Fecha inválida ("${impTexto(o.fecha)}").`}); return; }
    const programaId = impProgramaAgenda(o.programaId);
    if(!programaId){ errores.push({...base, motivo:`Programa no reconocido ("${impTexto(o.programaId)}").`}); return; }
    items.push({
      ...o, titulo, fecha, programaId, programaTexto:impTexto(o.programaId),
      horaInicio: o.horaInicio ? impHora(o.horaInicio) : "", horaFin: o.horaFin ? impHora(o.horaFin) : "",
      organizacion: o.organizacion||"", sede: o.sede||"",
      direcciones: (Array.isArray(o.direcciones) && o.direcciones.length) ? o.direcciones : [""],
      personas: o.personas||"", micros: (o.micros!=null && o.micros!=="") ? String(o.micros) : "",
      observaciones: o.observaciones||"", tipoRepeticion: o.tipoRepeticion || "unica", suspendida: !!o.suspendida,
      bloque: items.length+1, programasBloque:[programaId], renglones:1,
    });
  });
  items.sort((a,b) => (a.fecha+a.horaInicio).localeCompare(b.fecha+b.horaInicio));
  return { ok:true, filas:data.length, items, errores, avisos:[], formato:"json" };
}

function impLeerLibro(u8){
  const wb = XLSX.read(u8, { type:"array" });
  let ultimoError = "El archivo no tiene hojas con datos.";
  for(const nombre of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[nombre], { header:1, raw:true, defval:"" });
    let res = impProcesarFilas(aoa);                 // planilla de Micros
    if(!res.ok) res = impProcesarAgenda(aoa);        // Excel de la propia agenda
    if(res.ok){ res.hoja = nombre; return res; }
    ultimoError = "No reconozco el formato. Puede ser la planilla de Micros (columnas FECHA, PROGR. SOLICITANTE, DETALLE DE LA ACTIVIDAD/EVENTO…) o un Excel exportado desde esta agenda (Actividad, Programa, Fecha…).";
  }
  return { ok:false, error: ultimoError };
}

let impState = null; // { archivo, hoja, formato, filas, items, errores, sel:Set, estado:"vista"|"guardando"|"listo", resultado }

// Un solo botón "Importar": acepta Excel (.xlsx/.xls), CSV y JSON. Siempre muestra vista previa y omite lo ya cargado.
function importarArchivo(input){
  const file = input.files && input.files[0];
  input.value = "";
  if(!currentUser){ abrirLogin(); return; }
  if(!modoEditor){ alert("Activá el modo editor (arriba a la derecha) para importar."); return; }
  if(!file) return;
  const esJson = /\.json$/i.test(file.name);
  if(!esJson && typeof XLSX === "undefined"){ alert("No se pudo cargar el lector de Excel. Revisá la conexión a internet y probá de nuevo."); return; }
  const reader = new FileReader();
  reader.onload = e => {
    let res;
    try{
      res = esJson ? impItemsDesdeJson(JSON.parse(e.target.result)) : impLeerLibro(new Uint8Array(e.target.result));
    }catch(err){ console.error(err); alert("No pude leer el archivo. Tiene que ser un Excel (.xlsx / .xls), un CSV o un JSON de la agenda."); return; }
    if(!res.ok){ alert(res.error); return; }
    // Marcar las que ya están cargadas en la agenda (igual o parecida: misma fecha + programa)
    res.items.forEach(it => { const r = impBuscarRepetida(it, actividades); it.yaCargada = !!r; it.repetidaCon = r; it.otraFecha = r ? null : impBuscarOtraFecha(it, actividades); });
    impState = { archivo:file.name, hoja:res.hoja||"", formato:res.formato, filas:res.filas, items:res.items, errores:res.errores,
      sel:new Set(res.items.map((it,i)=>i).filter(i=>!res.items[i].yaCargada)), estado:"vista", resultado:"" };
    modalKind = "importexcel"; modalMode = "form"; modalOpen = true; renderModal();
  };
  if(esJson) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}
const importExcel = importarArchivo; // compatibilidad con la versión anterior del botón

// Exportar a Excel: un renglón por actividad, con las mismas columnas que acepta "Importar".
const EXPORT_ENCABEZADOS = ["Actividad","Programa","Organización","Sede","Dirección / Destino","Fecha","Hora inicio","Hora fin","Responsable","Micros","Viandas","Refrigerios","Estado trámite","Próximo paso","Observaciones","Tipo","Suspendida"];
function exportExcel(){
  if(typeof XLSX === "undefined"){ alert("No se pudo cargar el generador de Excel. Revisá la conexión a internet o usá el respaldo JSON."); return; }
  const orden = [...actividades].sort((a,b) => ((a.fecha||"")+(a.horaInicio||"")).localeCompare((b.fecha||"")+(b.horaInicio||"")));
  const serial = k => { const [y,m,d] = k.split("-").map(Number); return Math.round((Date.UTC(y,m-1,d) - Date.UTC(1899,11,30)) / 86400000); };
  const filas = orden.map(a => [
    a.titulo||"", (programaById(a.programaId)||{}).nombre || a.programaId || "", a.organizacion||"", a.sede||"",
    (a.direcciones||[]).filter(Boolean).join(" / "), a.fecha ? serial(a.fecha) : "", a.horaInicio||"", a.horaFin||"",
    a.personas||"", a.micros!=="" && a.micros!=null ? Number(a.micros) : "",
    (a.viandasLista||[]).filter(v=>v.cantidad!=="" && v.cantidad!=null).map(v=>`${v.tipo||"Viandas"}: ${v.cantidad}`).join("; "),
    a.refrigerios!=="" && a.refrigerios!=null ? Number(a.refrigerios) : "",
    a.tramiteEstado ? ((estadoById(a.tramiteEstado)||{}).label || a.tramiteEstado) : "", a.proximoPaso||"", a.observaciones||"",
    categoriaTipo(a.tipoRepeticion)==="normal" ? "Jornada normal" : "Evento único",
    a.suspendida ? "Sí" : "",
  ]);
  const ws = XLSX.utils.aoa_to_sheet([EXPORT_ENCABEZADOS, ...filas]);
  for(let r=1; r<=filas.length; r++){ const cell = ws[XLSX.utils.encode_cell({r, c:5})]; if(cell && cell.t==="n") cell.z = "dd/mm/yyyy"; }
  ws["!cols"] = [48,28,26,30,40,12,10,10,40,8,22,12,16,30,60,16,12].map(w => ({wch:w}));
  ws["!autofilter"] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:filas.length, c:EXPORT_ENCABEZADOS.length-1}}) };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Agenda");
  XLSX.writeFile(wb, `agenda-goia-${dateKey(new Date())}.xlsx`);
}
function impToggle(i, on){ if(on) impState.sel.add(i); else impState.sel.delete(i); renderModal(); }
function impToggleTodas(on){

function impCerrar(){ impState = null; cerrarModal(); }
async function impGuardar(){
  if(!impState || impState.estado!=="vista") return;
  const elegidas = impState.items.filter((it,i) => impState.sel.has(i));
  if(!elegidas.length) return;
  impState.estado = "guardando"; renderModal();
  const porBloque = {};
  elegidas.forEach(it => { porBloque[it.bloque] = (porBloque[it.bloque]||0) + 1; });
  const grupoDe = {};
  Object.keys(porBloque).forEach(b => { if(porBloque[b]>1) grupoDe[b] = uidGrupo(); });
  const rows = elegidas.map(it => ({ ...toRow({...emptyForm(), ...it, tramiteActivo: !!it.tramiteEstado}), ...(grupoDe[it.bloque] ? { grupo_id: grupoDe[it.bloque] } : {}) }));
  let guardadas = 0;
  for(let i=0; i<rows.length; i+=100){
    const { error } = await sb.from("actividades").insert(rows.slice(i, i+100));
    if(error){
      console.error(error);
      impState.estado = "vista";
      impState.resultado = `Se guardaron ${guardadas} de ${rows.length} y se cortó por un error. Revisá la agenda antes de volver a importar para no duplicar.`;
      renderModal(); cargarActividades(); return;
    }
    guardadas += Math.min(100, rows.length - i);
  }
  impState.estado = "listo";
  impState.resultado = `Listo: se cargaron ${guardadas} actividades.`;
  renderModal(); cargarActividades();
}

function buildMonthGrid(year, month){
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const start = new Date(year, month, 1-startOffset);
  const cells = [];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); }
  return cells;
}
function porDia(){
  const map = {};
  for(const a of actividades){
    if(!filtro.has(a.programaId)) continue;
    if(!filtroTipo.has(categoriaTipo(a.tipoRepeticion))) continue;
    if(!verSuspendidas && a.suspendida) continue;
    if(!map[a.fecha]) map[a.fecha]=[];
    map[a.fecha].push(a);
  }
  return map;
}
// Agrupa por grupo_id (compartidas entre programas) los items que están visibles con el filtro actual.
// Si sólo uno de los programas de un grupo compartido está visible, se muestra suelto (no como grupo).
function agruparParaMostrar(items){
  const grupos = {};
  const orden = [];
  for(const it of items){
    const key = it.grupoId ? `g:${it.grupoId}` : `s:${it.id}`;
    if(!grupos[key]){ grupos[key] = []; orden.push(key); }
    grupos[key].push(it);
  }
  return orden.map(key => grupos[key]);
}
function colorFondoGrupo(miembros){
  const colores = [...new Set(miembros.map(m=>programaById(m.programaId).color))];
  if(colores.length<=1) return colores[0] || "#999";
  const paso = 100/colores.length;
  const stops = colores.map((c,i)=>`${c} ${Math.round(i*paso)}%, ${c} ${Math.round((i+1)*paso)}%`).join(", ");
  return `linear-gradient(135deg, ${stops})`;
}

// Relación aprendida entre sedes y organizaciones a partir de lo ya cargado
function mapasSedeOrg(){
  const sedeOrg = {};
  const orgSedes = {};
  for(const a of actividades){
    const sedeKey = (a.sede||"").trim().toLowerCase();
    const orgKey = (a.organizacion||"").trim().toLowerCase();
    if(sedeKey && a.organizacion && !sedeOrg[sedeKey]) sedeOrg[sedeKey] = a.organizacion;
    if(orgKey && a.sede){
      if(!orgSedes[orgKey]) orgSedes[orgKey] = new Set();
      orgSedes[orgKey].add(a.sede);
    }
  }
  return { sedeOrg, orgSedes };
}
function onSedeInput(value){
  form.sede = value;
  const { sedeOrg } = mapasSedeOrg();
  const match = sedeOrg[value.trim().toLowerCase()];
  if(match && !form.organizacion){
    form.organizacion = match;
    const orgInput = document.getElementById("campo-organizacion");
    if(orgInput) orgInput.value = match;
  }
}
function onOrgInput(value){
  form.organizacion = value;
  const { orgSedes } = mapasSedeOrg();
  const set = orgSedes[value.trim().toLowerCase()];
  if(set && set.size===1 && !form.sede){
    const unicaSede = [...set][0];
    form.sede = unicaSede;
    const sedeInput = document.getElementById("campo-sede");
    if(sedeInput) sedeInput.value = unicaSede;
  }
}

// Desplegable de sugerencias propio (no depende del <datalist> nativo, poco fiable en mobile)
let sugerenciasCampo = null;
let sugerenciasValores = [];
function mostrarSugerencias(campo, valor){
  sugerenciasCampo = campo;
  const distinctList = campo === "organizacion"
    ? [...new Set(actividades.map(a=>a.organizacion).filter(Boolean))]
    : [...new Set(actividades.map(a=>a.sede).filter(Boolean))];
  const v = (valor||"").trim().toLowerCase();
  sugerenciasValores = distinctList.filter(x => x.toLowerCase().includes(v));
  const cont = document.getElementById(`sugerencias-${campo}`);
  if(!cont) return;
  if(sugerenciasValores.length===0 || (sugerenciasValores.length===1 && sugerenciasValores[0].toLowerCase()===v)){
    cont.style.display = "none"; cont.innerHTML = ""; return;
  }
  cont.innerHTML = sugerenciasValores.slice(0,8).map((val,i)=>
    `<div onmousedown="elegirSugerencia(${i})" style="padding:7px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line);">${escapeHtml(val)}</div>`
  ).join("");
  cont.style.display = "block";
}
function ocultarSugerencias(campo){
  const cont = document.getElementById(`sugerencias-${campo}`);
  if(cont){ cont.style.display = "none"; cont.innerHTML = ""; }
}
function elegirSugerencia(i){
  const campo = sugerenciasCampo;
  const val = sugerenciasValores[i];
  const inputEl = document.getElementById(`campo-${campo}`);
  if(inputEl) inputEl.value = val;
  if(campo === "organizacion") onOrgInput(val); else onSedeInput(val);
  ocultarSugerencias(campo);
}

function renderMes(dias, today){
  const grid = buildMonthGrid(cursor.getFullYear(), cursor.getMonth());
  const items = dias[detailDay] || [];
  return `
    <div style="display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;">
      <div style="flex:3 1 700px; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; overflow:hidden;">
        <div style="display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line);">
          ${DIAS_SEMANA.map(d=>`<div class="mono" style="padding:8px 6px; font-size:11px; color:var(--ink-soft); text-align:center; text-transform:uppercase;">${d}</div>`).join("")}
        </div>
        <div style="display:grid; grid-template-columns:repeat(7,1fr);">
          ${grid.map(d=>{
            const key = dateKey(d);
            const inMonth = d.getMonth()===cursor.getMonth();
            const dayItems = dias[key] || [];
            const tareasDia = tareas.filter(t=>t.fechaLimite===key && t.estado!=="completada");
            const gruposDia = agruparParaMostrar(dayItems);
            const totalChips = gruposDia.length + tareasDia.length;
            const isToday = key===today;
            const isSelected = key===detailDay;
            return `<div class="daycell" onclick="setDetailDay('${key}')" style="height:92px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:7px; opacity:${inMonth?1:0.35}; background:${isSelected?"var(--accent-soft)":"transparent"}; cursor:pointer; overflow:hidden; box-sizing:border-box;">
              <div class="mono" style="font-size:14px; font-weight:${isToday?700:500}; color:${isToday?"#fff":"var(--ink)"}; background:${isToday?"var(--accent)":"transparent"}; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;">${d.getDate()}</div>
              <div style="margin-top:4px; display:flex; flex-wrap:wrap; gap:3px; max-height:52px; overflow:hidden;">
                ${tareasDia.slice(0,6).map(t=>{
                  const pr = prioridadById(t.prioridad);
                  return `<div onclick="event.stopPropagation(); abrirEdicionTarea('${t.id}')" title="Tarea: ${escapeHtml(t.titulo)} (${pr.label})" style="width:21px; height:21px; border-radius:50%; background:${pr.color}; color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">📋</div>`;
                }).join("")}
                ${gruposDia.slice(0, Math.max(0,6-tareasDia.length)).map(miembros=>{
                  const a = miembros[0];
                  const fondo = colorFondoGrupo(miembros);
                  const idsStr = miembros.map(m=>m.id).join(",");
                  const accion = miembros.length>1 ? `abrirGrupoIds('${idsStr}')` : `abrirEdicion('${a.id}')`;
                  const susp = miembros.every(m=>m.suspendida);
                  return `<div onclick="event.stopPropagation(); ${accion}" title="${susp?"[SUSPENDIDA] ":""}${escapeHtml(a.titulo)}${miembros.length>1?" — compartida entre "+miembros.length+" programas":""}" style="${susp?"opacity:.38; outline:1.5px dashed #b3261e; outline-offset:-1px; ":""}width:21px; height:21px; border-radius:5px; background:${fondo}; color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${iniciales(a.titulo)}</div>`;
                }).join("")}
                ${totalChips>6 ? `<div style="width:21px; height:21px; border-radius:5px; background:var(--ink-soft); color:#fff; font-size:8.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;">+${totalChips-6}</div>` : ""}
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>
      <div style="flex:2 1 480px; min-width:340px; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:14px;">
        <div class="mono" style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px;">
          ${detailDay ? `${parseKey(detailDay).getDate()} de ${MESES[parseKey(detailDay).getMonth()]}` : "Seleccioná un día"}
        </div>
        ${(items.length===0 && tareas.filter(t=>t.fechaLimite===detailDay && t.estado!=="completada").length===0) ? `<div style="font-size:13px; color:var(--ink-soft); margin-bottom:10px;">Sin actividades ni tareas registradas.</div>` : ""}
        <div style="column-count:2; column-gap:12px;">
          ${tareas.filter(t=>t.fechaLimite===detailDay && t.estado!=="completada").map(t=>`<div style="break-inside:avoid;">${tareaCardHtml(t)}</div>`).join("")}
          ${agruparParaMostrar(items).map(miembros=>`<div style="break-inside:avoid;">${actividadCardHtmlGrupo(miembros,false)}</div>`).join("")}
        </div>
        <button class="navbtn" style="width:100%; padding:8px; font-size:13px; font-weight:600; margin-top:6px;" onclick="abrirNueva('${detailDay}')">+ Agregar actividad este día</button>
      </div>
    </div>
  `;
}

function renderDia(dias){
  const items = (dias[dateKey(cursor)] || []).slice().sort((a,b)=>(a.horaInicio||"").localeCompare(b.horaInicio||""));
  const tareasDelDia = tareas.filter(t=>t.fechaLimite===dateKey(cursor) && t.estado!=="completada");
  const grupos = agruparParaMostrar(items);
  let horaAnterior = null;
  const bloques = grupos.map(miembros=>{
    const hora = (miembros[0].horaInicio||"").slice(0,5) || "Sin horario";
    let encabezado = "";
    if(hora !== horaAnterior){
      horaAnterior = hora;
      encabezado = `<div class="mono" style="break-inside:avoid; font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; margin:10px 0 4px 0;">${hora}</div>`;
    }
    return encabezado + `<div style="break-inside:avoid;">${actividadCardHtmlGrupo(miembros, false)}</div>`;
  }).join("");

  return `
    <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:16px;">
      ${(items.length===0 && tareasDelDia.length===0) ? `<div style="font-size:14px; color:var(--ink-soft);">No hay actividades ni tareas registradas para este día.</div>` : ""}
      <div class="dia-columnas" style="column-count:3; column-gap:16px;">
        ${tareasDelDia.length>0 ? `<div class="mono" style="break-inside:avoid; font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:0 0 4px 0;">Tareas</div>` : ""}
        ${tareasDelDia.map(t=>`<div style="break-inside:avoid;">${tareaCardHtml(t)}</div>`).join("")}
        ${bloques}
      </div>
      <button class="navbtn" style="width:100%; padding:10px; font-size:13px; font-weight:600; margin-top:8px;" onclick="abrirNueva('${dateKey(cursor)}')">+ Agregar actividad</button>
    </div>
  `;
}

function renderResultadosBusqueda(q){
  const texto = q.trim().toLowerCase();
  const resultados = actividades
    .filter(a => filtro.has(a.programaId) && (verSuspendidas || !a.suspendida) && coincideBusqueda(a, texto))
    .sort((a,b)=> (a.fecha+(a.horaInicio||"")).localeCompare(b.fecha+(b.horaInicio||"")));
  const CAP = 300;
  const mostrar = resultados.slice(0, CAP);
  return `
    <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:16px;">
      <div style="padding:10px 14px; border-bottom:1px solid var(--line); font-size:12px; color:var(--ink-soft);">
        ${resultados.length} resultado${resultados.length!==1?"s":""} para "${escapeHtml(q)}"${resultados.length>CAP?` (mostrando los primeros ${CAP})`:""}
      </div>
      ${mostrar.length===0 ? `<div style="padding:24px; text-align:center; font-size:13px; color:var(--ink-soft);">No se encontraron actividades.</div>` : mostrar.map(a=>{
        const p = programaById(a.programaId);
        return `<div onclick="irABusquedaResultado('${a.fecha}')" style="${a.suspendida?"opacity:.45; ":""}display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer;">
          <span style="width:9px; height:9px; border-radius:50%; background:${p.color}; flex-shrink:0;" title="${p.nombre}"></span>
          <span class="mono" style="font-size:11.5px; color:var(--ink-soft); width:110px; flex-shrink:0;">${a.fecha}${a.horaInicio?` · ${a.horaInicio}`:""}</span>
          <span style="font-size:13px; font-weight:600; flex:1; min-width:140px;${a.suspendida?" text-decoration:line-through;":""}">${escapeHtml(a.titulo)}${a.suspendida?" <b style='color:#b3261e; font-size:10px;'>SUSPENDIDA</b>":""}</span>
          <span style="font-size:11.5px; color:var(--ink-soft);">${escapeHtml(a.organizacion||"")}</span>
        </div>`;
      }).join("")}
    </div>
  `;
}
