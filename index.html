<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agenda GOPIA — Gerencia Operativa de Promoción Integral a las Adolescencias</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --ink:#22262B; --ink-soft:#5B6470; --paper:#F6F6F3; --paper-raised:#FFFFFF;
    --line:#DEDCD3; --accent:#2D5F5A; --accent-soft:#E4EEEC;
    --warn:#8A5A00; --warn-soft:#FBF0DC;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--paper); color:var(--ink);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{cursor:pointer; font-family:inherit; border:none; background:none;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  #app{max-width:1900px; width:100%; margin:0; padding:20px 28px;}
  .navbtn{width:32px; height:32px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:14px;}
  .chip{transition:transform .12s ease;}
  .chip:hover{transform:translateY(-1px);}
  .daycell:hover{background:#FBFAF7;}
  .inputStyle{width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--line); font-size:13.5px; background:#fff; color:var(--ink);}
  .fieldLabel{font-size:11.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}

  @media (max-width: 680px){
    #app{ padding:12px; }
    #app h1{ font-size:18px !important; }
    .navbtn{ font-size:11px !important; padding-left:8px !important; padding-right:8px !important; }
    .daycell{ height:52px !important; padding:3px !important; }
    .dia-columnas{ column-count:1 !important; }
  }
  @media (max-width: 980px){
    .dia-columnas{ column-count:2 !important; }
  }
  @media (max-width: 480px){
    .stack-mobile{ flex-direction:column !important; }
    #modal-container > div > div{ padding:16px !important; }
  }

  /* ---- Mapa GOPIA ---- */
  .breadcrumb{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--ink-soft); margin-bottom:16px; flex-wrap:wrap;}
  .breadcrumb button{font-family:inherit; font-size:12px; color:var(--accent); background:none; border:none; cursor:pointer; font-weight:600; padding:0;}
  .breadcrumb span{color:var(--line);}
  .grid-mapa{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:560px){ .grid-mapa{grid-template-columns:1fr;} }
  .card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; text-align:left; cursor:pointer; font-family:inherit; width:100%;}
  .card:hover{border-color:var(--accent);}
  .card-title{font-size:14px; font-weight:700; margin:0 0 4px;}
  .card-sub{font-size:12px; color:var(--ink-soft); margin:0;}
  .root-card{background:var(--accent); color:#fff; border:none; border-radius:12px; padding:20px; margin-bottom:14px; cursor:pointer; text-align:left; width:100%;}
  .root-card .card-title{color:#fff; font-size:17px;}
  .root-card .card-sub{color:#DCEBE8;}
  .report-btn{display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--accent); color:var(--accent); border-radius:10px; padding:12px 16px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; width:100%; margin-bottom:18px;}
  .report-btn:hover{background:var(--accent-soft);}
  .section-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:20px 0 8px;}
  .brief{font-size:13.5px; line-height:1.55; margin:0 0 12px; color:var(--ink);}
  .gestion-box{background:var(--accent-soft); border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--accent); line-height:1.5; margin-bottom:16px;}
  .gestion-box b{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px;}
  .icon-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .icon-chip{display:inline-flex; align-items:center; gap:5px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; font-family:inherit;}
  .icon-chip:hover{border-color:var(--accent); color:var(--accent);}
  .icon-chip.open{background:var(--accent); border-color:var(--accent); color:#fff;}
  .gestion-detail{font-size:12.5px; color:var(--ink-soft); line-height:1.5; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:-2px 0 10px;}
  .list-item{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer;}
  .list-item:hover{border-color:var(--accent);}
  .list-item .nombre{font-size:13.5px; font-weight:700; margin:0 0 3px;}
  .list-item .meta{font-size:11.5px; color:var(--ink-soft);}
  .badge{font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; text-transform:uppercase;}
  .badge-ok{background:var(--accent-soft); color:var(--accent);}
  .badge-falta{background:#FAE7E7; color:#8A2E2E;}
  .team-item{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .team-item:last-child{border-bottom:none;}
  .team-name{font-size:13.5px; font-weight:700; margin:0;}
  .team-role{font-size:11px; color:var(--accent); font-weight:600; margin:1px 0 3px;}
  .team-resp{font-size:12.5px; color:var(--ink-soft); margin:0; max-width:420px;}
  .status{font-size:12px; color:var(--ink-soft); margin:10px 0;}
  .falta{font-size:11.5px; color:#8A2E2E; font-style:italic;}
</style>
</head>

<script>

/* ===================== Configuración fija de la agenda ===================== */
const PROGRAMAS = [

  { id:"lazos", nombre:"Reconstruyendo Lazos", corto:"Lazos", sigla:"LAZOS", color:"#C15C4A" },

const ESTADOS_TRAMITE = [

  { id:"no_corresponde", label:"No corresponde", icon:"⚪" },

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_SEMANA = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const VIANDAS_TIPOS = ["Ejecutivas", "Festivas", "Comunes"];
const TIPOS_REPETICION = [
  { id:"unica", label:"Evento único" },
  { id:"normal", label:"Jornada normal" },
];
function categoriaTipo(tipo){
  return (!tipo || tipo === "unica") ? "unica" : "normal";
}
const PRIORIDADES = [
  { id:"urgente", label:"Urgente", icon:"🔴", color:"#C24A3D" },
  { id:"alta", label:"Prioridad alta", icon:"🟠", color:"#C79A3B" },
  { id:"media", label:"Prioridad media", icon:"🟡", color:"#D8B94A" },
  { id:"baja", label:"Prioridad baja", icon:"🟢", color:"#4C8C5B" },
];
const ESTADOS_TAREA = [
  { id:"pendiente", label:"Pendiente", icon:"🟡" },
  { id:"en_curso", label:"En curso", icon:"🔵" },
  { id:"completada", label:"Completada", icon:"🟢" },
];
const prioridadById = id => PRIORIDADES.find(p=>p.id===id) || PRIORIDADES[2];
const estadoTareaById = id => ESTADOS_TAREA.find(e=>e.id===id) || ESTADOS_TAREA[0];

/* ===================== Helpers ===================== */
const pad = n => String(n).padStart(2,"0");
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const programaById = id => PROGRAMAS.find(p=>p.id===id);
const estadoById = id => ESTADOS_TRAMITE.find(e=>e.id===id);
const emptyForm = () => ({
  id:null, titulo:"", programaId:PROGRAMAS[0].id, programaIds:[PROGRAMAS[0].id], organizacion:"", sede:"", direcciones:[""],
  fecha:dateKey(new Date()), fechaHasta:"", horaInicio:"", horaFin:"", personas:"", micros:"", viandasLista:[{tipo:"",cantidad:""}], refrigerios:"",
  tramiteActivo:false, tramiteEstado:"pendiente", proximoPaso:"", observaciones:"",
  repetir:"none", repetirHasta:"", grupoId:null, esCampamento:false,
  tipoRepeticion:"unica", diasSemana:[],
  fechasSueltasActivo:false, fechasSueltas:[],
  aplicarATodoElGrupo:false,
});
function generarFechasSemanales(inicioStr, hastaStr, diasSemana){
  const inicio = parseKey(inicioStr);
  const hasta = parseKey(hastaStr);
  const fechas = [];
  const cursor = new Date(inicio);
  let iter = 0;
  while(cursor <= hasta && iter < 1000){
    const diaIdx = (cursor.getDay()+6)%7; // 0=Lun ... 6=Dom, igual criterio que DIAS_SEMANA
    if(diasSemana.includes(diaIdx)) fechas.push(dateKey(cursor));
    cursor.setDate(cursor.getDate()+1);
    iter++;
  }
  return fechas;
}
function generarFechasRepeticion(inicioStr, hastaStr, tipo){
  const inicio = parseKey(inicioStr);
  const hasta = parseKey(hastaStr);
  const fechas = [];
  const cursor = new Date(inicio);
  let iter = 0;
  while(cursor <= hasta && iter < 500){
    fechas.push(dateKey(cursor));
    if(tipo === "diario") cursor.setDate(cursor.getDate()+1);
    else if(tipo === "semanal") cursor.setDate(cursor.getDate()+7);
    else if(tipo === "mensual") cursor.setMonth(cursor.getMonth()+1);
    else if(tipo === "anual") cursor.setFullYear(cursor.getFullYear()+1);
    else break;
    iter++;
  }
  return fechas;
}
function uidGrupo(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("g-"+Math.random().toString(36).slice(2)+Date.now());
}
function onRepetirChange(value){
  form.repetir = value;
  if(value !== "none"){ form.esCampamento = false; form.fechasSueltasActivo = false; }
  if(value === "semanal" && (!form.diasSemana || form.diasSemana.length===0) && form.fecha){
    const d = parseKey(form.fecha);
    form.diasSemana = [(d.getDay()+6)%7];
  }
  renderModal();
}
function toggleDiaSemana(idx){
  if(!form.diasSemana) form.diasSemana = [];
  if(form.diasSemana.includes(idx)) form.diasSemana = form.diasSemana.filter(x=>x!==idx);
  else form.diasSemana = [...form.diasSemana, idx].sort();
  renderModal();
}
function completarHastaMeses(n){
  if(!form.fecha) return;
  const d = parseKey(form.fecha);
  d.setMonth(d.getMonth()+n);
  form.repetirHasta = dateKey(d);
  renderModal();
}
function toggleProgramaForm(id, checked){
  if(checked){ if(!form.programaIds.includes(id)) form.programaIds.push(id); }
  else { form.programaIds = form.programaIds.filter(x=>x!==id); }
  renderModal();
}
function toggleCampamento(checked){
  form.esCampamento = checked;
  if(checked){ form.repetir = "none"; form.fechasSueltasActivo = false; }
  renderModal();
}
function toggleFechasSueltas(checked){
  form.fechasSueltasActivo = checked;
  if(checked){
    form.esCampamento = false;
    form.repetir = "none";
    if(!form.fechasSueltas || form.fechasSueltas.length===0) form.fechasSueltas = [form.fecha || dateKey(new Date())];
  }
  renderModal();
}
function agregarFechaSuelta(){ form.fechasSueltas.push(form.fecha || dateKey(new Date())); renderModal(); }
function quitarFechaSuelta(i){
  form.fechasSueltas.splice(i,1);
  if(form.fechasSueltas.length===0) form.fechasSueltas.push(dateKey(new Date()));
  renderModal();
}
function actualizarFechaSuelta(i, value){ form.fechasSueltas[i] = value; }
const escapeHtml = s => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iniciales = titulo => {
  const palabras = (titulo||"").trim().split(/\s+/).filter(Boolean);
  if(palabras.length>=2) return (palabras[0][0]+palabras[1][0]).toUpperCase();
  return (titulo||"").slice(0,2).toUpperCase();
};
const inicioSemana = d => { const c=new Date(d); const offset=(c.getDay()+6)%7; c.setDate(c.getDate()-offset); return c; };

// Conversión entre el formulario (camelCase, como usa el resto del código) y las columnas de la tabla (snake_case, como las creamos en el SQL)
function toRow(f){
  return {
    titulo: f.titulo,
    programa_id: f.programaId,
    organizacion: f.organizacion || null,
    sede: f.sede || null,
    direcciones: (f.direcciones||[]).map(d=>d.trim()).filter(Boolean),
    fecha: f.fecha,
    hora_inicio: f.horaInicio || null,
    hora_fin: f.horaFin || null,
    personas: f.personas || null,
    micros: f.micros !== "" && f.micros != null ? parseInt(f.micros, 10) : null,
    viandas_detalle: (() => {
      const lista = (f.viandasLista||[])
        .filter(v => v.cantidad !== "" && v.cantidad != null && parseInt(v.cantidad,10) > 0)
        .map(v => ({ tipo: v.tipo || "", cantidad: parseInt(v.cantidad,10) }));
      return lista.length ? lista : null;
    })(),
    refrigerios: f.refrigerios !== "" && f.refrigerios != null ? parseInt(f.refrigerios, 10) : null,
    tramite_estado: f.tramiteActivo ? f.tramiteEstado : null,
    proximo_paso: f.tramiteActivo ? (f.proximoPaso || null) : null,
    observaciones: f.observaciones || null,
    tipo_repeticion: f.tipoRepeticion || "unica",
  };
}
function fromRow(r){
  return {
    id: r.id,
    titulo: r.titulo || "",
    programaId: r.programa_id,
    organizacion: r.organizacion || "",
    sede: r.sede || "",
    direcciones: (r.direcciones && r.direcciones.length) ? r.direcciones : (r.direccion ? [r.direccion] : []),
    fecha: r.fecha,
    horaInicio: r.hora_inicio ? String(r.hora_inicio).slice(0,5) : "",
    horaFin: r.hora_fin ? String(r.hora_fin).slice(0,5) : "",
    personas: r.personas || "",
    micros: (r.micros !== null && r.micros !== undefined) ? String(r.micros) : "",
    viandasLista: (r.viandas_detalle && Array.isArray(r.viandas_detalle) && r.viandas_detalle.length)
      ? r.viandas_detalle.map(v=>({ tipo: v.tipo || "", cantidad: (v.cantidad!=null?String(v.cantidad):"") }))
      : (r.viandas ? [{ tipo: r.viandas_tipo || "", cantidad: String(r.viandas) }] : [{ tipo:"", cantidad:"" }]),
    refrigerios: (r.refrigerios !== null && r.refrigerios !== undefined) ? String(r.refrigerios) : "",
    tramiteEstado: r.tramite_estado || null,
    proximoPaso: r.proximo_paso || "",
    observaciones: r.observaciones || "",
    grupoId: r.grupo_id || null,
    tipoRepeticion: r.tipo_repeticion || "unica",
  };
}

const emptyTareaForm = () => ({
  id:null, titulo:"", responsable:"", prioridad:"media", estado:"pendiente", fechaLimite:"", observaciones:"",
});
function toTareaRow(t){
  return {
    titulo: t.titulo,
    responsable: t.responsable || null,
    prioridad: t.prioridad || "media",
    estado: t.estado || "pendiente",
    fecha_limite: t.fechaLimite || null,
    observaciones: t.observaciones || null,
  };
}
function fromTareaRow(r){
  return {
    id: r.id,
    titulo: r.titulo || "",
    responsable: r.responsable || "",
    prioridad: r.prioridad || "media",
    estado: r.estado || "pendiente",
    fechaLimite: r.fecha_limite || "",
    observaciones: r.observaciones || "",
  };
}

/* ===================== Estado ===================== */
let currentUser = null;
let modoEditor = false; // arranca siempre en modo vista, aunque haya sesión iniciada
function puedeEditar(){ return !!currentUser && modoEditor; }
function toggleModoEditor(){ modoEditor = !modoEditor; renderRoot(); }
let loginError = "";

let actividades = [];
let dataLoaded = false;
let view = "mes";
let cursor = new Date();
let selectedDay = dateKey(new Date());
let filtro = new Set(PROGRAMAS.map(p=>p.id));
let busqueda = "";
let filtroTipo = new Set(TIPOS_REPETICION.map(t=>t.id));
let detailDay = dateKey(new Date());
let form = emptyForm();
let modalOpen = false;
let modalMode = "form"; // "form" | "view" | "login"
let modalKind = "actividad"; // "actividad" | "tarea"
let nuevaFechaCopia = "";

let tareas = [];
let tareasLoaded = false;
let tareaForm = emptyTareaForm();
let seccion = "agenda"; // "agenda" | "tareas" | "mapa"

/* ===================== Autenticación ===================== */
sb.auth.onAuthStateChange((_event, session) => {
  currentUser = session ? session.user : null;
  renderRoot();
});
sb.auth.getSession().then(({ data }) => {
  currentUser = data.session ? data.session.user : null;
  renderRoot();
});

async function attemptLogin(email, password){
  loginError = "";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    loginError = "Email o contraseña incorrectos, o el usuario no existe.";
    renderModal();
  } else {
    modalOpen = false;
    renderModal();
  }
}
function logout(){ sb.auth.signOut(); }
function abrirLogin(){ modalMode = "login"; loginError = ""; modalOpen = true; renderModal(); }
window.__submitLogin = () => {
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-pass").value;
  attemptLogin(email, pass);
};

/* ===================== Datos: carga inicial + tiempo real ===================== */
async function cargarActividades(){
  let todas = [];
  let desde = 0;
  const TAMANO_PAGINA = 1000;
  while(true){
    const { data, error } = await sb.from("actividades").select("*").order("fecha", { ascending: true }).range(desde, desde + TAMANO_PAGINA - 1);
    if(error){
      console.error(error);
      alert("No se pudo conectar con la base de datos. Revisá SUPABASE_URL / SUPABASE_ANON_KEY y las políticas de la tabla.");
      return;
    }
    todas = todas.concat(data);
    if(data.length < TAMANO_PAGINA) break;
    desde += TAMANO_PAGINA;
  }
  actividades = todas.map(fromRow);
  dataLoaded = true;
  renderRoot();
}
cargarActividades();

let recargaActividadesTimeout = null;
function programarRecargaActividades(){
  if(recargaActividadesTimeout) clearTimeout(recargaActividadesTimeout);
  recargaActividadesTimeout = setTimeout(() => { cargarActividades(); }, 700);
}

sb.channel("actividades-realtime")
  .on("postgres_changes", { event: "*", schema: "public", table: "actividades" }, () => {
    programarRecargaActividades();
  })
  .subscribe();

async function cargarTareas(){
  let todas = [];
  let desde = 0;
  const TAMANO_PAGINA = 1000;
  while(true){
    const { data, error } = await sb.from("tareas").select("*").order("created_at", { ascending: true }).range(desde, desde + TAMANO_PAGINA - 1);
    if(error){
      console.error(error);
      return;
    }
    todas = todas.concat(data);
    if(data.length < TAMANO_PAGINA) break;
    desde += TAMANO_PAGINA;
  }
  tareas = todas.map(fromTareaRow);
  tareasLoaded = true;
  renderRoot();
}
cargarTareas();

let recargaTareasTimeout = null;
function programarRecargaTareas(){
  if(recargaTareasTimeout) clearTimeout(recargaTareasTimeout);
  recargaTareasTimeout = setTimeout(() => { cargarTareas(); }, 700);
}

sb.channel("tareas-realtime")
  .on("postgres_changes", { event: "*", schema: "public", table: "tareas" }, () => {
    programarRecargaTareas();
  })
  .subscribe();

function setSeccion(s){ seccion = s; renderRoot(); }

/* ===================== Acciones sobre actividades ===================== */
function actualizarBusqueda(v){
  busqueda = v;
  renderRoot();
  const el = document.getElementById("buscador-input");
  if(el){ el.focus(); const pos = v.length; el.setSelectionRange(pos, pos); }

async function guardarActividad(){
  if(!form.titulo || !form.titulo.trim()){ alert("Completá al menos el título."); return; }
  if(!form.fecha){ alert("Elegí una fecha."); return; }

  if(!form.id){
    // Actividad nueva: puede expandirse por repetición y/o por varios programas a la vez
    if(!form.programaIds || form.programaIds.length===0){ alert("Elegí al menos un programa."); return; }
    let fechas = [form.fecha];
    if(form.fechasSueltasActivo){
      fechas = (form.fechasSueltas||[]).filter(Boolean);
      if(fechas.length===0){ alert("Agregá al menos una fecha."); return; }
    } else if(form.repetir && form.repetir !== "none"){
      if(!form.repetirHasta){ alert("Elegí hasta qué fecha se repite."); return; }
      if(form.repetir === "semanal" && form.diasSemana && form.diasSemana.length>0){
        fechas = generarFechasSemanales(form.fecha, form.repetirHasta, form.diasSemana);
      } else {
        fechas = generarFechasRepeticion(form.fecha, form.repetirHasta, form.repetir);
      }
      if(fechas.length===0){ alert("La fecha \"hasta\" tiene que ser posterior a la fecha de inicio."); return; }
    }

    const grupoId = (fechas.length>1 || form.programaIds.length>1) ? uidGrupo() : null;
    const base = toRow(form);
    const filas = [];
    for(const pid of form.programaIds){
      for(const f of fechas){
        filas.push({ ...base, programa_id: pid, fecha: f, grupo_id: grupoId });
      }
    }
    const { error } = await sb.from("actividades").insert(filas);
    if(error){
      console.error(error);
      alert("No se pudo guardar. Revisá tu conexión o que tengas sesión iniciada.");
      return;
    }
    modalOpen = false;
    form = emptyForm();
    renderModal();
    cargarActividades();
    return;
  }

  // Edición de una actividad ya existente (una sola fila, o todo el grupo si se pidió)
  const row = toRow(form);
  let error;
  if(form.grupoId && form.aplicarATodoElGrupo){
    const { fecha, programa_id, ...camposComunes } = row;
    ({ error } = await sb.from("actividades").update(camposComunes).eq("grupo_id", form.grupoId));
  } else {
    ({ error } = await sb.from("actividades").update(row).eq("id", form.id));
  }
  if(error){
    console.error(error);
    alert("No se pudo guardar. Revisá tu conexión o que tengas sesión iniciada.");
    return;
  }
  modalOpen = false;
  form = emptyForm();
  renderModal();
  cargarActividades();
}
async function duplicarEnFecha(){
  if(!nuevaFechaCopia){ alert("Elegí una fecha para la copia."); return; }
  let grupoId = form.grupoId;
  if(!grupoId){
    grupoId = uidGrupo();
    const { error: errUp } = await sb.from("actividades").update({ grupo_id: grupoId }).eq("id", form.id);
    if(errUp){ console.error(errUp); alert("No se pudo preparar la actividad original."); return; }
    form.grupoId = grupoId;
  }
  const base = toRow(form);
  const nuevaFila = { ...base, programa_id: form.programaId, fecha: nuevaFechaCopia, grupo_id: grupoId };
  const { error } = await sb.from("actividades").insert(nuevaFila);
  if(error){ console.error(error); alert("No se pudo crear la copia."); return; }
  const fechaCreada = nuevaFechaCopia;
  nuevaFechaCopia = "";
  cargarActividades();
  renderModal();
  alert(`Copia creada el ${fechaCreada}.`);
}

function exportData(){

  a.href = url; a.download = `agenda-goia-${dateKey(new Date())}.json`;

async function importData(input){
  if(!currentUser){ input.value = ""; abrirLogin(); return; }
  if(!modoEditor){ input.value = ""; alert("Activá el modo editor (arriba a la derecha) para importar."); return; }
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error("Formato inválido");
      if(!confirm(`Se van a agregar ${data.length} actividades a la base compartida. ¿Continuar?`)) return;
      const rows = data.map(item => toRow({...emptyForm(), ...item, tramiteActivo: !!item.tramiteEstado}));
      const { error } = await sb.from("actividades").insert(rows);
      if(error){ console.error(error); alert("No se pudo importar."); return; }
      alert("Datos importados correctamente.");
      cargarActividades();
    }catch(err){
      alert("El archivo no tiene un formato válido.");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

function buildMonthGrid(year, month){
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const start = new Date(year, month, 1-startOffset);
  const cells = [];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); }
  return cells;
}
function porDia(){
  const map = {};
  for(const a of actividades){
    if(!filtro.has(a.programaId)) continue;
    if(!filtroTipo.has(categoriaTipo(a.tipoRepeticion))) continue;
    if(!map[a.fecha]) map[a.fecha]=[];
    map[a.fecha].push(a);
  }
  return map;
}
// Agrupa por grupo_id (compartidas entre programas) los items que están visibles con el filtro actual.
// Si sólo uno de los programas de un grupo compartido está visible, se muestra suelto (no como grupo).
function agruparParaMostrar(items){
  const grupos = {};
  const orden = [];
  for(const it of items){
    const key = it.grupoId ? `g:${it.grupoId}` : `s:${it.id}`;
    if(!grupos[key]){ grupos[key] = []; orden.push(key); }
    grupos[key].push(it);
  }
  return orden.map(key => grupos[key]);
}
function colorFondoGrupo(miembros){
  const colores = [...new Set(miembros.map(m=>programaById(m.programaId).color))];
  if(colores.length<=1) return colores[0] || "#999";
  const paso = 100/colores.length;
  const stops = colores.map((c,i)=>`${c} ${Math.round(i*paso)}%, ${c} ${Math.round((i+1)*paso)}%`).join(", ");
  return `linear-gradient(135deg, ${stops})`;
}

// Relación aprendida entre sedes y organizaciones a partir de lo ya cargado
function mapasSedeOrg(){
  const sedeOrg = {};
  const orgSedes = {};
  for(const a of actividades){
    const sedeKey = (a.sede||"").trim().toLowerCase();
    const orgKey = (a.organizacion||"").trim().toLowerCase();
    if(sedeKey && a.organizacion && !sedeOrg[sedeKey]) sedeOrg[sedeKey] = a.organizacion;
    if(orgKey && a.sede){
      if(!orgSedes[orgKey]) orgSedes[orgKey] = new Set();
      orgSedes[orgKey].add(a.sede);
    }
  }
  return { sedeOrg, orgSedes };
}
function onSedeInput(value){
  form.sede = value;
  const { sedeOrg } = mapasSedeOrg();
  const match = sedeOrg[value.trim().toLowerCase()];
  if(match && !form.organizacion){
    form.organizacion = match;
    const orgInput = document.getElementById("campo-organizacion");
    if(orgInput) orgInput.value = match;
  }
}
function onOrgInput(value){
  form.organizacion = value;
  const { orgSedes } = mapasSedeOrg();
  const set = orgSedes[value.trim().toLowerCase()];
  if(set && set.size===1 && !form.sede){
    const unicaSede = [...set][0];
    form.sede = unicaSede;
    const sedeInput = document.getElementById("campo-sede");
    if(sedeInput) sedeInput.value = unicaSede;
  }
}

// Desplegable de sugerencias propio (no depende del <datalist> nativo, poco fiable en mobile)
let sugerenciasCampo = null;
let sugerenciasValores = [];
function mostrarSugerencias(campo, valor){
  sugerenciasCampo = campo;
  const distinctList = campo === "organizacion"
    ? [...new Set(actividades.map(a=>a.organizacion).filter(Boolean))]
    : [...new Set(actividades.map(a=>a.sede).filter(Boolean))];
  const v = (valor||"").trim().toLowerCase();
  sugerenciasValores = distinctList.filter(x => x.toLowerCase().includes(v));
  const cont = document.getElementById(`sugerencias-${campo}`);
  if(!cont) return;
  if(sugerenciasValores.length===0 || (sugerenciasValores.length===1 && sugerenciasValores[0].toLowerCase()===v)){
    cont.style.display = "none"; cont.innerHTML = ""; return;
  }
  cont.innerHTML = sugerenciasValores.slice(0,8).map((val,i)=>
    `<div onmousedown="elegirSugerencia(${i})" style="padding:7px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line);">${escapeHtml(val)}</div>`
  ).join("");
  cont.style.display = "block";
}
function ocultarSugerencias(campo){
  const cont = document.getElementById(`sugerencias-${campo}`);
  if(cont){ cont.style.display = "none"; cont.innerHTML = ""; }
}
function elegirSugerencia(i){
  const campo = sugerenciasCampo;
  const val = sugerenciasValores[i];
  const inputEl = document.getElementById(`campo-${campo}`);
  if(inputEl) inputEl.value = val;
  if(campo === "organizacion") onOrgInput(val); else onSedeInput(val);
  ocultarSugerencias(campo);
}

function renderMes(dias, today){
  const grid = buildMonthGrid(cursor.getFullYear(), cursor.getMonth());
  const items = dias[detailDay] || [];
  return `
    <div style="display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;">
      <div style="flex:3 1 700px; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; overflow:hidden;">
        <div style="display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line);">
          ${DIAS_SEMANA.map(d=>`<div class="mono" style="padding:8px 6px; font-size:11px; color:var(--ink-soft); text-align:center; text-transform:uppercase;">${d}</div>`).join("")}
        </div>
        <div style="display:grid; grid-template-columns:repeat(7,1fr);">
          ${grid.map(d=>{
            const key = dateKey(d);
            const inMonth = d.getMonth()===cursor.getMonth();
            const dayItems = dias[key] || [];
            const tareasDia = tareas.filter(t=>t.fechaLimite===key && t.estado!=="completada");
            const gruposDia = agruparParaMostrar(dayItems);
            const totalChips = gruposDia.length + tareasDia.length;
            const isToday = key===today;
            const isSelected = key===detailDay;
            return `<div class="daycell" onclick="setDetailDay('${key}')" style="height:92px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:7px; opacity:${inMonth?1:0.35}; background:${isSelected?"var(--accent-soft)":"transparent"}; cursor:pointer; overflow:hidden; box-sizing:border-box;">
              <div class="mono" style="font-size:14px; font-weight:${isToday?700:500}; color:${isToday?"#fff":"var(--ink)"}; background:${isToday?"var(--accent)":"transparent"}; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;">${d.getDate()}</div>
              <div style="margin-top:4px; display:flex; flex-wrap:wrap; gap:3px; max-height:52px; overflow:hidden;">
                ${tareasDia.slice(0,6).map(t=>{
                  const pr = prioridadById(t.prioridad);
                  return `<div onclick="event.stopPropagation(); abrirEdicionTarea('${t.id}')" title="Tarea: ${escapeHtml(t.titulo)} (${pr.label})" style="width:21px; height:21px; border-radius:50%; background:${pr.color}; color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">📋</div>`;
                }).join("")}
                ${gruposDia.slice(0, Math.max(0,6-tareasDia.length)).map(miembros=>{
                  const a = miembros[0];
                  const fondo = colorFondoGrupo(miembros);
                  const idsStr = miembros.map(m=>m.id).join(",");
                  const accion = miembros.length>1 ? `abrirGrupoIds('${idsStr}')` : `abrirEdicion('${a.id}')`;
                  return `<div onclick="event.stopPropagation(); ${accion}" title="${escapeHtml(a.titulo)}${miembros.length>1?" — compartida entre "+miembros.length+" programas":""}" style="width:21px; height:21px; border-radius:5px; background:${fondo}; color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${iniciales(a.titulo)}</div>`;
                }).join("")}
                ${totalChips>6 ? `<div style="width:21px; height:21px; border-radius:5px; background:var(--ink-soft); color:#fff; font-size:8.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;">+${totalChips-6}</div>` : ""}
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>
      <div style="flex:2 1 480px; min-width:340px; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:14px;">
        <div class="mono" style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px;">
          ${detailDay ? `${parseKey(detailDay).getDate()} de ${MESES[parseKey(detailDay).getMonth()]}` : "Seleccioná un día"}
        </div>
        ${(items.length===0 && tareas.filter(t=>t.fechaLimite===detailDay && t.estado!=="completada").length===0) ? `<div style="font-size:13px; color:var(--ink-soft); margin-bottom:10px;">Sin actividades ni tareas registradas.</div>` : ""}
        <div style="column-count:2; column-gap:12px;">
          ${tareas.filter(t=>t.fechaLimite===detailDay && t.estado!=="completada").map(t=>`<div style="break-inside:avoid;">${tareaCardHtml(t)}</div>`).join("")}
          ${agruparParaMostrar(items).map(miembros=>`<div style="break-inside:avoid;">${actividadCardHtmlGrupo(miembros,false)}</div>`).join("")}
        </div>
        <button class="navbtn" style="width:100%; padding:8px; font-size:13px; font-weight:600; margin-top:6px;" onclick="abrirNueva('${detailDay}')">+ Agregar actividad este día</button>
      </div>
    </div>
  `;
}

function renderDia(dias){
  const items = (dias[dateKey(cursor)] || []).slice().sort((a,b)=>(a.horaInicio||"").localeCompare(b.horaInicio||""));
  const tareasDelDia = tareas.filter(t=>t.fechaLimite===dateKey(cursor) && t.estado!=="completada");
  const grupos = agruparParaMostrar(items);
  let horaAnterior = null;
  const bloques = grupos.map(miembros=>{
    const hora = (miembros[0].horaInicio||"").slice(0,5) || "Sin horario";
    let encabezado = "";
    if(hora !== horaAnterior){
      horaAnterior = hora;
      encabezado = `<div class="mono" style="break-inside:avoid; font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; margin:10px 0 4px 0;">${hora}</div>`;
    }
    return encabezado + `<div style="break-inside:avoid;">${actividadCardHtmlGrupo(miembros, false)}</div>`;
  }).join("");

  return `
    <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:16px;">
      ${(items.length===0 && tareasDelDia.length===0) ? `<div style="font-size:14px; color:var(--ink-soft);">No hay actividades ni tareas registradas para este día.</div>` : ""}
      <div class="dia-columnas" style="column-count:3; column-gap:16px;">
        ${tareasDelDia.length>0 ? `<div class="mono" style="break-inside:avoid; font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:0 0 4px 0;">Tareas</div>` : ""}
        ${tareasDelDia.map(t=>`<div style="break-inside:avoid;">${tareaCardHtml(t)}</div>`).join("")}
        ${bloques}
      </div>
      <button class="navbtn" style="width:100%; padding:10px; font-size:13px; font-weight:600; margin-top:8px;" onclick="abrirNueva('${dateKey(cursor)}')">+ Agregar actividad</button>
    </div>
  `;
}

function renderResultadosBusqueda(q){
  const texto = q.trim().toLowerCase();
  const resultados = actividades
    .filter(a => filtro.has(a.programaId) && coincideBusqueda(a, texto))
    .sort((a,b)=> (a.fecha+(a.horaInicio||"")).localeCompare(b.fecha+(b.horaInicio||"")));
  const CAP = 300;
  const mostrar = resultados.slice(0, CAP);
  return `
    <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:16px;">
      <div style="padding:10px 14px; border-bottom:1px solid var(--line); font-size:12px; color:var(--ink-soft);">
        ${resultados.length} resultado${resultados.length!==1?"s":""} para "${escapeHtml(q)}"${resultados.length>CAP?` (mostrando los primeros ${CAP})`:""}
      </div>
      ${mostrar.length===0 ? `<div style="padding:24px; text-align:center; font-size:13px; color:var(--ink-soft);">No se encontraron actividades.</div>` : mostrar.map(a=>{
        const p = programaById(a.programaId);
        return `<div onclick="irABusquedaResultado('${a.fecha}')" style="display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer;">
          <span style="width:9px; height:9px; border-radius:50%; background:${p.color}; flex-shrink:0;" title="${p.nombre}"></span>
          <span class="mono" style="font-size:11.5px; color:var(--ink-soft); width:110px; flex-shrink:0;">${a.fecha}${a.horaInicio?` · ${a.horaInicio}`:""}</span>
          <span style="font-size:13px; font-weight:600; flex:1; min-width:140px;">${escapeHtml(a.titulo)}</span>
          <span style="font-size:11.5px; color:var(--ink-soft);">${escapeHtml(a.organizacion||"")}</span>
        </div>`;
      }).join("")}
    </div>
  `;
}

 de los derechos humanos y sociales de las/os jóvenes, apuntando a fortalecer su protagonismo, toma de decisiones y reflexión-acción sobre su realidad, en la perspectiva de sujetos de derecho hacia la ciudadanía plena.<br/><br/><b>Enfoque pedagógico-didáctico:</b> la enseñanza tiene como punto de partida la realidad propia, la experiencia y su relación con la teoría y la práctica, combinando el trabajo colectivo con la articulación por áreas. La modalidad de taller/salón permite que circule de manera horizontal y democrática la palabra, construyendo el pensamiento crítico y la identidad de pertenencia.", "tiene_organizaciones": false, "gestion": "Funciona en centros propios del programa, no en organizaciones externas. Uno de esos centros (Barrio Rivadavia I) es además el que usa TABF prestado.", "coordinador": "Daniel Quiroz"}, "bajoflores": {"nombre": "TABF — Talleres Adolescentes del Bajo Flores", "brief": "El Programa Talleres para Adolescentes del Bajo Flores se constituye como una articulación de organizaciones sociales y comunitarias de la zona con el Estado, con el fin de promover espacios educativos con los y las adolescentes.", "tiene_organizaciones": true, "gestion": "No tiene sede propia: usa las instalaciones que le prestan 11 instituciones de la red (comedores, capillas, radio comunitaria, biblioteca, club, escuela y una sede de COOPA).", "coordinador": "Lorena Fernández"}, "turismo": {"nombre": "Turismo Social", "brief": "Sin reseña oficial disponible todavía. Actualmente con poca actividad, según lo indicado.", "tiene_organizaciones": false, "gestion": "Tiene sede propia (Parque Sarmiento, según la nómina de personal), todavía no incorporada a la base a la espera de confirmación. En las presentaciones de Desafío 2027 aparece nombrado como \"Turismo Recreativo\" — es el mismo programa; el nombre oficial sigue siendo Turismo Social.", "coordinador": "Alejandro Agazzi"}};
const MAPA_GESTIONES_PROGRAMA = {"adolescencias": [{"titulo": "Supervisión de talleres", "desc": "El tallerista responde a un Supervisor, que arma un informe mensual por institución y se lo pasa al Coordinador de Supervisores (a cargo de ~5 supervisores), quien responde a la Coordinadora del Programa, Patricia González Chans."}, {"titulo": "Pago mensual a organizaciones", "desc": "La organización cobra una mensualidad proporcional a la cantidad de talleres y de vacantes — no al presentismo real — para garantizar que los talleristas puedan cobrar. Con ese dinero, la organización les paga."}, {"titulo": "Convenio con UNTREF — clínicas deportivas", "desc": "Consentimiento informado a padres, cronograma, brief por clínica/institución, ejecución, síntesis de participación y cierre."}, {"titulo": "Alianzas estratégicas 2027", "desc": "<b>Red actual de articulación:</b> UNTREF (proyectos presentados, clínicas, cierre del Programa), UBA (articulación institucional), Banco Ciudad (articulación institucional), clubes (San Lorenzo, Racing, Argentinos Juniors), Radio Mitre (articulación y comunicación).<br/><br/><b>Líneas prioritarias de empresas aliadas:</b> tecnología e IA (Globant, Mercado Libre); empleabilidad y educación financiera (Banco Ciudad, Coca-Cola, Mercado Libre); deporte y vida saludable (River, San Lorenzo, Racing, Argentinos Juniors, UNTREF, UBA, Arcor); nuevas experiencias (teatros, radios, universidades, Secretaría de Cultura).<br/><br/><b>Cuatro líneas de acción concretas para 2027:</b><br/>• Adolescencia Te Prepara — primer empleo, educación financiera, orientación vocacional, mentorías, visitas a empresas.<br/>• Adolescencia Crea — inteligencia artificial, programación, audiovisual, podcast, comunicación, Hackatón Adolescencia.<br/>• Adolescencia Saludable — nutrición, deporte, hábitos saludables, primeros auxilios, prevención.<br/>• Adolescencia Conecta — universidades, empresas, medios, clubes profesionales, producción audiovisual, referentes.<br/><br/>Desafío 2027: consolidar las 10 alianzas estratégicas actuales, ampliar la red público-privada, y pasar de alianzas institucionales a experiencias y oportunidades concretas para los adolescentes."}, {"titulo": "Pago de becas", "desc": "Las adolescencias cobran este estímulo económico con el fin de garantizar la equidad material, incentivar la permanencia en los espacios de contención y eliminar las barreras socioeconómicas que dificultan su desarrollo pleno.<br/><br/>La beca no funciona como un salario ni como un subsidio discrecional, sino como una herramienta de política pública para asegurar que los jóvenes en situación de vulnerabilidad social puedan costear los viáticos, materiales y necesidades básicas asociadas a su participación en actividades educativas, culturales, tecnológicas o deportivas. De esta forma, el Estado promueve la autonomía, la inclusión y la restitución de derechos vulnerados.<br/><br/><b>Marco normativo regulatorio</b> — la entrega de estos fondos obligatorios se sustenta en tres niveles jurídicos:<br/>• <b>Tratados internacionales:</b> la Convención sobre los Derechos del Niño (con rango constitucional en Argentina), que obliga al Estado a disponer del \"máximo de los recursos disponibles\" para asegurar el desarrollo integral de las infancias y adolescencias.<br/>• <b>Leyes de protección integral:</b> Ley Nacional N° 26.061 (los niños, niñas y adolescentes son sujetos de derecho; mandata al Estado a implementar políticas activas frente a la exclusión social) y Ley N° 114 de la Ciudad de Buenos Aires (obliga al GCBA a aplicar programas públicos que garanticen el goce de derechos en condiciones de igualdad, dignidad y sin discriminación).<br/>• <b>Normativa de ejecución específica:</b> decretos porteños (Decreto N° 428/07 y resoluciones del Ministerio de Desarrollo Humano y Hábitat), que autorizan las partidas presupuestarias específicas y definen legalmente el beneficio como un estímulo nominal no remunerativo.<br/><br/><b>Circuito operativo — Programa Adolescencias</b><br/><br/>La inscripción es abierta, libre y gratuita, a través del sistema del Gobierno de la Ciudad.<br/><br/>Una vez cargadas todas las inscripciones, se realiza un proceso de selección que prioriza a las adolescencias con mayor situación de marginalidad y problemática social a la hora de asignar vacante. El programa cuenta con aproximadamente 7.000 vacantes.<br/><br/>Las y los seleccionados se registran en el <b>RIB</b> (sistema interno del Gobierno de la Ciudad), donde el personal administrativo carga los datos de identificación y contacto del adolescente (CUIT, dirección, teléfono, nombre completo, DNI, CUIL) y, cuando corresponde, los mismos datos de su representante.<br/><br/>Los y las adolescentes mayores de 13 años pueden cobrar la beca ellos mismos, mediante un CBU del Banco Ciudad, o a través de un representante legal (tutor/a). Los y las menores de 13 años requieren representante.<br/><br/>Con la información cargada en el RIB, la carga del pago en sí se realiza en el <b>PSOC</b>, otro sistema interno del Gobierno de la Ciudad. Ambos sistemas (RIB y PSOC) dan aviso a Tesorería, que habilita la acreditación del pago."}, {"titulo": "Por expediente (ingreso excepcional)", "desc": "Ingresa por expediente SADE. Se baja el formulario de ingreso (informe gráfico), se pasa a la coordinadora del programa por mail, se carga en un cuadro compartido (contacto con el adolescente, actividad elegida). Se arman los eleves que firma la Gerencia Operativa Legal, se vinculan al expediente y se remite al destinatario que lo envió."}, {"titulo": "Por oficio (pedidos 104 y requerimientos)", "desc": "La Dirección deriva el oficio al programa correspondiente con plazo previo al vencimiento. El programa arma la información, se valida que sea coherente con lo pedido, y se responde por GEDO firmado por la Gerencia Operativa Legal, revisado antes por la abogada de la Dirección General."}, {"titulo": "Derivación al Consejo de Derechos (vulneración de derechos)", "desc": "Ante una vulneración de derechos de un/a adolescente, el programa correspondiente eleva un informe social con los datos completos del adolescente y sus referentes, describiendo la situación que acredita la vulneración.<br/><br/>Se solicita a Mesa de Entradas de la DGPINA la carátula de expediente electrónico. El código de trata tiene dos referencias distintas, según la fuente:<br/>• <b>MDSG0703A</b> — según el mail de la abogada de la Dirección General.<br/>• <b>AJG00101A</b> (\"o similar\") — según el documento interno de circuitos de la Gerencia.<br/><br/>Se vinculan al expediente el informe social y los informes técnicos completos, firmados. El expediente pasa al usuario de Mesa de Entradas y se eleva desde la Gerencia Operativa Legal, dirigido a la Dirección General, que deriva a DGPDES o directamente al Consejo de Derechos de Niñas, Niños y Adolescentes."}], "lazos": [{"titulo": "Pago de becas", "desc": "Las adolescencias cobran este estímulo económico con el fin de garantizar la equidad material, incentivar la permanencia en los espacios de contención y eliminar las barreras socioeconómicas que dificultan su desarrollo pleno.<br/><br/>La beca no funciona como un salario ni como un subsidio discrecional, sino como una herramienta de política pública para asegurar que los jóvenes en situación de vulnerabilidad social puedan costear los viáticos, materiales y necesidades básicas asociadas a su participación en actividades educativas, culturales, tecnológicas o deportivas. De esta forma, el Estado promueve la autonomía, la inclusión y la restitución de derechos vulnerados.<br/><br/><b>Marco normativo regulatorio</b> — la entrega de estos fondos obligatorios se sustenta en tres niveles jurídicos:<br/>• <b>Tratados internacionales:</b> la Convención sobre los Derechos del Niño (con rango constitucional en Argentina), que obliga al Estado a disponer del \"máximo de los recursos disponibles\" para asegurar el desarrollo integral de las infancias y adolescencias.<br/>• <b>Leyes de protección integral:</b> Ley Nacional N° 26.061 (los niños, niñas y adolescentes son sujetos de derecho; mandata al Estado a implementar políticas activas frente a la exclusión social) y Ley N° 114 de la Ciudad de Buenos Aires (obliga al GCBA a aplicar programas públicos que garanticen el goce de derechos en condiciones de igualdad, dignidad y sin discriminación).<br/>• <b>Normativa de ejecución específica:</b> decretos porteños (Decreto N° 428/07 y resoluciones del Ministerio de Desarrollo Humano y Hábitat), que autorizan las partidas presupuestarias específicas y definen legalmente el beneficio como un estímulo nominal no remunerativo.<br/><br/><b>Circuito operativo:</b> Un/a adolescente elegible genera expediente, se cruza contra su cuenta bancaria, cambia de estado (elegibilidad, operativa, baja solicitada) y se procesa el pago mensual."}], "lideres": [{"titulo": "Insumos para campamentos", "desc": "Por cada campamento programado: pedido de insumos, compra, depósito y entrega."}, {"titulo": "Alianza con Radio Mitre", "desc": "A partir del taller de radio del programa, los y las jóvenes participan de la organización y producción de la propuesta \"Voces que Inspiran\", en articulación con Radio Mitre."}], "coopa": [], "bajoflores": [], "turismo": []};
const MAPA_GESTIONES_GENERALES = [{"id": "conv", "titulo": "Convenios y organizaciones", "desc": "La articulación con las organizaciones sociales se concreta a través de un Convenio. El ingreso de la propuesta se genera a través de un expediente, donde se envía a la DGTAL para la conformación del marco jurídico correspondiente. Posteriormente se remite a la firma del Ministerio de Desarrollo Humano y Hábitat (MDHyH). Una vez firmado, se procede al pago.<br/><br/><b>¿Por qué se trabaja con organizaciones sociales?</b><br/><br/><b>Democracia participativa y cogestión.</b> La Constitución de la CABA establece que la democracia de la Ciudad tiene carácter participativo. Los considerandos de los convenios recuperan este mandato: incorporar a las OSC permite un diseño de políticas públicas más democrático, plural y cercano a las necesidades reales del vecino.<br/><br/><b>Capilaridad territorial y especialización técnica.</b> Las organizaciones sociales poseen un \"saber hacer\" y un arraigo territorial que el aparato estatal no siempre logra de forma inmediata. El Estado firma convenios para potenciar y articular esas capacidades técnicas, descentralizando la ejecución de programas para llegar de forma más rápida y empática a la población vulnerable.<br/><br/><b>Corresponsabilidad en la protección de derechos.</b> En niñez y adolescencia (ámbito de la DGPINA), la Ley N.° 114 derriba el viejo modelo de patronato e instaura el principio de corresponsabilidad: la protección integral de derechos no es tarea exclusiva del sector público, sino una responsabilidad compartida entre el Estado, las familias y las organizaciones de la comunidad.<br/><br/><b>Marco jurídico estructurado</b><br/><pre class=\"mono\" style=\"font-size:11px; line-height:1.4; white-space:pre; overflow-x:auto; background:#fff; border-radius:6px; padding:10px; color:var(--ink);\">┌─────────────────────────────────────────┐\n│          Constitución de la CABA        │\n│   (Arts. 11, 32 y 39 - Participación)   │\n└────────────────────┬────────────────────┘\n                     ▼\n┌─────────────────────────────────────────┐\n│        Leyes de Fondo (CABA)            │\n│  - Ley N.° 114 (Protección Integral)    │\n│  - Ley N.° 6.684 (Ley de Ministerios)   │\n└────────────────────┬────────────────────┘\n                     ▼\n┌─────────────────────────────────────────┐\n│         Decretos y Resoluciones         │\n│  - Decreto N.° 1360/07 (Convenio Marco) │\n│  - Res. N.° 97/SECLYT/25 (Circuito)     │\n└─────────────────────────────────────────┘</pre><br/><b>Nivel constitucional:</b> la Constitución de la CABA obliga al Estado a garantizar canales de participación ciudadana y a fomentar las actividades de las entidades comunitarias sin fines de lucro.<br/><br/><b>Nivel legal de competencia:</b> la Ley N.° 6.684 encomienda al Ministerio de Desarrollo Humano y Hábitat la articulación de sus políticas con actores privados y del tercer sector. La Ley N.° 114 da el marco protectorio específico para que la DGPINA delegue o complemente la atención de adolescentes mediante estos instrumentos institucionales.<br/><br/><b>Nivel operativo y procedimental:</b> el Decreto N.° 1360/07 unifica las reglas mediante el \"Modelo de Convenio Marco de Cooperación\", resguardando la autonomía jurídica y técnica de la organización frente al Estado. La Resolución N.° 97/SECLYT/25 garantiza la transparencia del circuito digital, exigiendo dictámenes legales antes de que los fondos públicos sean girados.<br/><br/><span style=\"font-size:11px; color:var(--ink-soft);\">Fuentes: Constitución de la CABA · Ley N.° 114 · Ley N.° 6.684 · Decreto N.° 1360/07 · Resolución N.° 97/SECLYT/25 · documentosboletinoficial.buenosaires.gob.ar · mpfciudad.gob.ar</span>"}, {"id": "vpn", "titulo": "Accesos VPN", "desc": "<b>Por qué es obligatoria</b> — la VPN es el único puente técnico para acceder al Sistema de Administración de Documentos Electrónicos (SADE), canal obligatorio para tramitar expedientes, rendiciones y gestiones estatales (Decreto N° 589/09). Para los talleres y organizaciones que reciben apoyo económico, también es indispensable para acceder a los módulos de Planes Sociales y Subsidios (PSOCS) y al Registro de Identificación de Beneficiarios (RIB), exigido por la Resolución N° 557/SLYT/15 para fiscalizar y transparentar las prestaciones otorgadas por la Ciudad. La Agencia de Sistemas de Información (ASI) exige conexiones cifradas y validación nominal por CUIL para proteger los datos sensibles de los beneficiarios.<br/><br/><b>Circuito — pedido nuevo</b><br/>Programa Adolescencias envía por mail a RRHH: formulario, copia de convenio y copia de DNI → RRHH corrobora que el usuario corresponda a su cargo u oficio (control de personal), emite el ticket, y avisa a la coordinadora del Programa y a la ASI que está habilitado para continuar → la ASI deriva internamente a GoDi (sector propio dentro de la ASI) → GoDi habilita a cada usuario en el sistema de Carga de Asistencia y Acompañamiento del Programa Adolescencias → se entrega el acceso al Programa.<br/><br/><b>Circuito — prórroga</b><br/>Mismo ingreso por mail a RRHH (formulario, convenio, DNI) → RRHH corrobora y emite el ticket, avisa a la coordinadora y a la ASI → como el sistema ya está habilitado, la ASI extiende la vigencia 365 días más <i>sin derivar a GoDi</i> → avisa al Programa, que confirma la prórroga.<br/><br/><span style=\"font-size:11.5px; color:var(--warn);\">⚠ Documento marcado como BORRADOR por el propio equipo: el paso de la ASI en la prórroga (que no deriva a GoDi porque el sistema ya está habilitado) está señalado ahí mismo como inferencia, pendiente de confirmar.</span><br/><br/><b>Vigencia:</b> 365 días corridos, tanto en pedido nuevo como en prórroga.<br/><br/><span style=\"font-size:11px; color:var(--ink-soft);\">Fuentes: Decreto N° 589/09 · Resolución N° 557/SLYT/15 · Ley N° 2.956 (Fortalecimiento a Organizaciones Sociales) · normativa ASI (boletinoficial.buenosaires.gob.ar)</span>"}, {"id": "log", "titulo": "Logística de actividades y comunicación", "desc": "Cada programa calendariza el mes. De cada actividad sale un Brief que alimenta la solicitud de micro y la solicitud de comida (menú festivo, refrigerios, viandas). También se gestionan acá las solicitudes de piezas de comunicación (diplomas, folletos, afiches) por Google Form. Guadalupe Coll (RAP) hace el seguimiento de estas tres gestiones. El destino final de las solicitudes, una vez enviadas, no está documentado todavía."}, {"id": "aud", "titulo": "Auditorías", "desc": "En construcción."}, {"id": "diag", "titulo": "Diagnóstico de gestión 2026", "desc": "<b>Marzo (punto de partida):</b> presupuesto y pautas definidos con demora; inicio de talleres postergado y asignaciones a rehacer; documentación y registros descentralizados, con informalidad de información; asistencias incompletas y débil trazabilidad; equipo en proceso de reorganización.<br/><br/><b>Marzo–septiembre (respuesta de gestión):</b> acuerdo del 6% y reasignación de talleres; regularización de convenios, pagos, RIB y PSOC; ordenamiento documental y seguimiento de asistencias; clínicas deportivas, IA y mediciones antropométricas; replanificación de programas y presencia territorial.<br/><br/><b>Hoy — avances y próximos desafíos:</b> seis programas sostenidos; mayor control y trazabilidad de la información (falta mucho todavía); procesos internos más claros y ordenados; consolidar el equipo y el sistema de monitoreo; contar con presupuesto, circuitos y recursos anticipados.<br/><br/><b>Balance:</b> la Gerencia avanzó en ordenar y sostener la ejecución. El próximo salto requiere previsibilidad institucional — presupuesto oportuno, circuitos definidos y disponibilidad de recursos operativos.<br/><br/><b>Decisión 2027 por programa</b> (sostener / fortalecer / reformular), evaluada según tres preguntas: Impacto (¿a quiénes llegamos y qué oportunidades generamos?), Demanda (¿la necesidad que dio origen al programa sigue vigente?) y Gestión (¿qué debemos sostener, fortalecer o reformular?)."}];
const MAPA_INGRESO = {"expediente": {"titulo": "Por expediente (ingreso excepcional)", "desc": "Ingresa por expediente SADE. Se baja el formulario de ingreso (informe gráfico), se pasa a la coordinadora del programa por mail, se carga en un cuadro compartido (contacto con el adolescente, actividad elegida). Se arman los eleves que firma la Gerencia Operativa Legal, se vinculan al expediente y se remite al destinatario que lo envió."}, "oficio": {"titulo": "Por oficio (pedidos 104 y requerimientos)", "desc": "La Dirección deriva el oficio al programa correspondiente con plazo previo al vencimiento. El programa arma la información, se valida que sea coherente con lo pedido, y se responde por GEDO firmado por la Gerencia Operativa Legal, revisado antes por la abogada de la Dirección General."}, "derivacion": {"titulo": "Derivación al Consejo de Derechos (vulneración de derechos)", "desc": "Ante una vulneración de derechos de un/a adolescente, el programa correspondiente eleva un informe social con los datos completos del adolescente y sus referentes, describiendo la situación que acredita la vulneración.<br/><br/>Se solicita a Mesa de Entradas de la DGPINA la carátula de expediente electrónico. El código de trata tiene dos referencias distintas, según la fuente:<br/>• <b>MDSG0703A</b> — según el mail de la abogada de la Dirección General.<br/>• <b>AJG00101A</b> (\"o similar\") — según el documento interno de circuitos de la Gerencia.<br/><br/>Se vinculan al expediente el informe social y los informes técnicos completos, firmados. El expediente pasa al usuario de Mesa de Entradas y se eleva desde la Gerencia Operativa Legal, dirigido a la Dirección General, que deriva a DGPDES o directamente al Consejo de Derechos de Niñas, Niños y Adolescentes."}};

let mapaNav = { screen: "home" };

function mapaGoHome(){ mapaNav = { screen:"home" }; mapaOpenGestion=null; renderRoot(); }
function mapaGoTeam(){ mapaNav = { screen:"team" }; renderRoot(); }

async function cargarMapaOrgs(){
  if(mapaOrgsCache || mapaOrgsLoading) return;
  mapaOrgsLoading = true;
  const { data, error } = await sb.from("organizaciones")
    .select("id,nombre,nombre_alternativo,observaciones,sedes(id,nombre,direccion,barrio,comuna),convenios(numero,estado,fecha_inicio_real,fecha_fin_real),participacion_org_programa(programa_id,modalidad,tipo_actividad)")
    .order("nombre");
  mapaOrgsCache = error ? [] : data;
  mapaOrgsLoading = false;
  renderRoot();
}

function mapaBreadcrumb(items){
  return '<div class="breadcrumb">' + items.map((it,i) => {
    const isLast = i === items.length-1;
    return (i>0 ? '<span>/</span>' : '') + (isLast ? '<span>'+it.label+'</span>' : '<button onclick="'+it.action+'">'+it.label+'</button>');
  }).join('') + '</div>';
}

function mapaGestionesChips(lista, prefix){
  return '<div class="icon-row">' + lista.map((g,i) => {
    const key = prefix + "_" + i;
    return `<button class="icon-chip ${mapaOpenGestion===key?'open':''}" onclick="mapaToggleGestion('${key}')">⚙ ${g.titulo}</button>`;
  }).join('') + '</div>' +
  lista.map((g,i) => {
    const key = prefix + "_" + i;
    return mapaOpenGestion===key ? `<div class="gestion-detail">${g.desc}</div>` : '';
  }).join('');
}

function mapaRedactar(texto){
  let t = texto;
  MAPA_REDACT.forEach(([nombre, reemplazo]) => { t = t.split(nombre).join(reemplazo); });
  return t;
}

function mapaLimpiarHtml(s){
  return s.replace(/<pre[^>]*>/g, "\n").replace(/<\/pre>/g, "")
          .replace(/<br\/?>/g, " ").replace(/<b>|<\/b>/g, "")
          .replace(/<i>|<\/i>/g, "").replace(/<span[^>]*>/g, "").replace(/<\/span>/g, "")
          .replace(/•/g, "-");
}

    if(p.diagnostico){ body.push(`<p><b>Diagnóstico 2026 y desafío 2027:</b> ${p.diagnostico}</p>`); }
    if(gestiones.length){
      body.push(`<p><b>Gestiones propias de este programa:</b></p><ul>`);
      gestiones.forEach(g => body.push(`<li><b>${g.titulo}:</b> ${g.desc}</li>`));
      body.push(`</ul>`);
    }
    const filtradas = orgs.filter(o => (o.participacion_org_programa||[]).some(pp => pp.programa_id === id));
    if(filtradas.length){
      body.push(`<p><b>${p.tiene_organizaciones ? "Organizaciones" : "Lugares"}:</b></p><ul>`);
      filtradas.forEach(o => {
        const conv = (o.convenios||[])[0];
        const convTxt = conv ? ("convenio " + (conv.numero||"s/n") + (conv.fecha_inicio_real ? ", vigencia desde " + conv.fecha_inicio_real : "")) : "sin convenio cargado";
        body.push(`<li>${o.nombre} (${convTxt})</li>`);
      });
      body.push(`</ul>`);
    }
  });

  body.push(`<h2>3. Trámites y gestiones administrativas de la Gerencia</h2>`);
  body.push(`<p><i>Cuestiones de forma — trámites que la Gerencia gestiona, por fuera de la estructura principal de equipo y programas.</i></p>`);
  MAPA_GESTIONES_GENERALES.forEach(g => {
    body.push(`<h3>${g.titulo}</h3>`);
    body.push(`<p>${g.desc}</p>`);
  });

  const htmlDoc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>Informe GOPIA</title>
<style>
  body{font-family:Calibri,Arial,sans-serif; font-size:11pt; color:#22262B;}
  h1{font-size:20pt; color:#2D5F5A;}
  h2{font-size:15pt; color:#2D5F5A; margin-top:24pt; border-bottom:1pt solid #2D5F5A; padding-bottom:4pt;}
  h3{font-size:12.5pt; color:#22262B; margin-top:14pt;}
  p{line-height:1.4;}
  ul{margin-top:4pt;}
  li{margin-bottom:4pt;}
</style></head>
<body>${body.join("\n")}</body></html>`;

  const blob = new Blob(['\ufeff', htmlDoc], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "Informe_GOPIA.doc";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderTareas(){
  const orden = { urgente:0, alta:1, media:2, baja:3 };
  const pendientes = tareas.filter(t=>t.estado!=="completada")
    .slice().sort((a,b)=> (orden[a.prioridad]??9)-(orden[b.prioridad]??9) || (a.fechaLimite||"9999").localeCompare(b.fechaLimite||"9999"));
  const completadas = tareas.filter(t=>t.estado==="completada");
  return `
    <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:16px; max-width:680px;">
      ${!tareasLoaded ? `<div style="font-size:13px; color:var(--ink-soft);">Sincronizando…</div>` : ""}
      ${(tareasLoaded && pendientes.length===0) ? `<div style="font-size:13px; color:var(--ink-soft); margin-bottom:10px;">No hay tareas pendientes.</div>` : ""}
      ${pendientes.map(t=>tareaCardHtml(t)).join("")}
      <button class="navbtn" style="width:100%; padding:10px; font-size:13px; font-weight:600; margin-top:4px;" onclick="abrirNuevaTarea()">+ Nueva tarea</button>
      ${completadas.length>0 ? `
        <details style="margin-top:16px;">
          <summary style="cursor:pointer; font-size:12px; color:var(--ink-soft); font-weight:600;">Completadas (${completadas.length})</summary>
          <div style="margin-top:8px;">${completadas.map(t=>tareaCardHtml(t)).join("")}</div>
        </details>
      ` : ""}
    </div>
  `;
}

function tareaCardHtml(t){
  const pr = prioridadById(t.prioridad);
  const es = estadoTareaById(t.estado);
  const vencida = t.fechaLimite && t.estado!=="completada" && t.fechaLimite < dateKey(new Date());
  return `
    <div onclick="abrirEdicionTarea('${t.id}')" style="border:1px solid var(--line); border-left:4px solid ${pr.color}; border-radius:8px; padding:9px 12px; margin-bottom:8px; cursor:pointer; background:#fff;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
        <div style="font-size:13.5px; font-weight:700; ${t.estado==="completada"?"text-decoration:line-through; color:var(--ink-soft);":""}">${escapeHtml(t.titulo)}</div>
        <span style="font-size:10.5px; font-weight:700; white-space:nowrap; flex-shrink:0;">${pr.icon} ${pr.label}</span>
      </div>
      <div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; display:flex; flex-wrap:wrap; gap:10px;">
        <span>${es.icon} ${es.label}</span>
        ${t.responsable?`<span>👤 ${escapeHtml(t.responsable)}</span>`:""}
        ${t.fechaLimite?`<span class="mono" style="${vencida?"color:#C24A3D; font-weight:700;":""}">📅 ${t.fechaLimite}${vencida?" (vencida)":""}</span>`:""}
      </div>
      ${t.observaciones?`<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-style:italic;">${escapeHtml(t.observaciones)}</div>`:""}
    </div>
  `;
}

function renderSemana(dias){
  const inicio = inicioSemana(cursor);
  const dias7 = [];
  for(let i=0;i<7;i++){ const d=new Date(inicio); d.setDate(inicio.getDate()+i); dias7.push(d); }
  const today = dateKey(new Date());
  return `
    <div style="display:flex; flex-direction:column; gap:10px;">
      ${dias7.map(d=>{
        const key = dateKey(d);
        const items = (dias[key]||[]).slice().sort((a,b)=>(a.horaInicio||"").localeCompare(b.horaInicio||""));
        const tareasDia = tareas.filter(t=>t.fechaLimite===key && t.estado!=="completada");
        const isToday = key===today;
        return `
          <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:12px;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
              <div class="mono" style="font-size:12px; font-weight:700; color:${isToday?"#fff":"var(--ink)"}; background:${isToday?"var(--accent)":"transparent"}; padding:2px 8px; border-radius:6px;">${DIAS_SEMANA[(d.getDay()+6)%7]} ${d.getDate()}</div>
              <div style="font-size:11px; color:var(--ink-soft);">${MESES[d.getMonth()]}</div>
            </div>
            ${(items.length===0 && tareasDia.length===0) ? `<div style="font-size:12.5px; color:var(--ink-soft);">Sin actividades ni tareas.</div>` : ""}
            ${tareasDia.map(t=>tareaCardHtml(t)).join("")}
            ${agruparParaMostrar(items).map(miembros=>actividadCardHtmlGrupo(miembros,false)).join("")}
            <button class="navbtn" style="width:100%; padding:6px; font-size:12px; font-weight:600; margin-top:4px;" onclick="abrirNueva('${key}')">+ Agregar</button>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderAnio(dias){
  return `
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;">
      ${MESES.map((nombreMes, mIdx)=>{
        const grid = buildMonthGrid(cursor.getFullYear(), mIdx);
        return `<div onclick="irAMes(${cursor.getFullYear()},${mIdx})" style="background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:10px; cursor:pointer;">
          <div class="mono" style="font-size:12px; font-weight:700; margin-bottom:6px;">${nombreMes}</div>
          <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:2px;">
            ${grid.map(d=>{
              const key = dateKey(d);
              const inMonth = d.getMonth()===mIdx;
              const items = dias[key] || [];
              const colores = [...new Set(items.map(a=>a.programaId))].slice(0,3).map(id=>programaById(id).color);
              return `<div style="aspect-ratio:1; border-radius:3px; font-size:8.5px; display:flex; align-items:center; justify-content:center; opacity:${inMonth?1:0.25};
                background:${colores.length?`linear-gradient(90deg, ${colores.join(",")})`:"#F1F0EB"}; color:${colores.length?"#fff":"var(--ink-soft)"}; font-weight:${colores.length?700:400};">${d.getDate()}</div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function actividadCardHtmlGrupo(miembros, expanded){
  if(miembros.length===1) return actividadCardHtml(miembros[0], expanded);
  const a = miembros[0];
  const fondo = colorFondoGrupo(miembros);
  const siglas = miembros.map(m=>(programaById(m.programaId).sigla||programaById(m.programaId).corto)).join(" / ");
  const idsStr = miembros.map(m=>m.id).join(",");
  return `
    <div onclick="abrirGrupoIds('${idsStr}')" style="position:relative; border:1px solid var(--line); border-radius:8px; padding:10px 40px 10px 12px; margin-bottom:8px; cursor:pointer; background:#fff; min-height:92px;">
      <div style="position:absolute; top:0; right:0; bottom:0; width:34px; background:${fondo}; border-radius:0 7px 7px 0; display:flex; align-items:center; justify-content:center; overflow:hidden;">
        <span style="writing-mode:vertical-rl; text-orientation:mixed; color:#fff; font-size:8px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.3);">${siglas}</span>
      </div>
      <div style="font-size:10px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px;">🔗 Compartida entre ${miembros.length} programas</div>
      <div style="font-size:13.5px; font-weight:700;">${escapeHtml(a.titulo)}</div>
      ${a.sede ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">📍 ${escapeHtml(a.sede)}</div>` : ""}
      ${(a.direcciones&&a.direcciones.length) ? a.direcciones.map(d=>`<div style="font-size:11.5px; color:var(--ink-soft);">🧭 ${escapeHtml(d)}</div>`).join("") : ""}
      ${(a.horaInicio||a.horaFin) ? `<div class="mono" style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">${a.horaInicio||"—"}${a.horaFin?` a ${a.horaFin}`:""}</div>` : ""}
    </div>
  `;
}

function actividadCardHtml(a, expanded){
  const p = programaById(a.programaId);
  const estado = a.tramiteEstado ? estadoById(a.tramiteEstado) : null;
  return `
    <div onclick="abrirEdicion('${a.id}')" style="position:relative; border:1px solid ${p.color}55; border-radius:8px; padding:10px 34px 10px 12px; margin-bottom:8px; cursor:pointer; background:#fff; min-height:92px;">
      <div style="position:absolute; top:0; right:0; bottom:0; width:26px; background:${p.color}; border-radius:0 7px 7px 0; display:flex; align-items:center; justify-content:center; overflow:hidden;">
        <span style="writing-mode:vertical-rl; text-orientation:mixed; color:#fff; font-size:9px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap;">${p.sigla || p.corto}</span>
      </div>
      <div style="font-size:13.5px; font-weight:700;">${escapeHtml(a.titulo)}</div>
      ${a.sede ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">📍 ${escapeHtml(a.sede)}</div>` : ""}
      ${(a.direcciones&&a.direcciones.length) ? a.direcciones.map(d=>`<div style="font-size:11.5px; color:var(--ink-soft);">🧭 ${escapeHtml(d)}</div>`).join("") : ""}
      ${(a.horaInicio||a.horaFin) ? `<div class="mono" style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">${a.horaInicio||"—"}${a.horaFin?` a ${a.horaFin}`:""}</div>` : ""}
      ${a.organizacion ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">🏢 ${escapeHtml(a.organizacion)}</div>` : ""}
      ${(a.personas && expanded) ? `<div style="font-size:11.5px; color:var(--ink-soft);">👤 ${escapeHtml(a.personas)}</div>` : ""}
      ${(a.micros || (a.viandasLista&&a.viandasLista.some(v=>v.cantidad)) || a.refrigerios) ? `<div style="font-size:11.5px; color:var(--ink-soft);">${[
        a.micros?`🚌 Micros: ${a.micros}`:null,
        (a.viandasLista&&a.viandasLista.filter(v=>v.cantidad).length) ? `🍱 Viandas: ${a.viandasLista.filter(v=>v.cantidad).map(v=>`${v.cantidad}${v.tipo?` ${v.tipo}`:""}`).join(", ")}` : null,
        a.refrigerios?`🥪 Refrigerios: ${a.refrigerios}`:null,
      ].filter(Boolean).join(" · ")}</div>` : ""}
      ${estado ? `<div style="font-size:11px; margin-top:4px;">${estado.icon} ${estado.label}${a.proximoPaso?` — ${escapeHtml(a.proximoPaso)}`:""}</div>` : ""}
      ${(expanded && a.observaciones) ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-style:italic;">${escapeHtml(a.observaciones)}</div>` : ""}
    </div>
  `;
}

function renderModal(){
  const mc = document.getElementById("modal-container");
  if(!modalOpen){ mc.innerHTML = ""; return; }
  if(modalMode === "login"){ mc.innerHTML = loginModalHtml(); return; }
  if(modalKind === "grupo"){ mc.innerHTML = viewGrupoModalHtml(); return; }
  if(modalKind === "tarea"){
    mc.innerHTML = modalMode === "view" ? viewTareaModalHtml() : formTareaModalHtml();
    return;
  }
  if(modalMode === "view"){ mc.innerHTML = viewModalHtml(); return; }
  mc.innerHTML = formModalHtml();
}

function loginModalHtml(){
  return `
    <div onclick="cerrarModal()" style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="background:#fff; border-radius:14px; padding:24px; width:100%; max-width:360px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h2 style="font-size:17px; font-weight:700; margin:0;">Iniciar sesión</h2>
          <button onclick="cerrarModal()" style="font-size:18px;">✕</button>
        </div>
        <div style="margin-bottom:10px;"><label class="fieldLabel">Email</label>
          <input id="login-email" type="email" class="inputStyle" placeholder="tu-usuario@equipo" /></div>
        <div style="margin-bottom:14px;"><label class="fieldLabel">Contraseña</label>
          <input id="login-pass" type="password" class="inputStyle" onkeydown="if(event.key==='Enter') __submitLogin()" /></div>
        ${loginError ? `<div style="color:#B3413A; font-size:12.5px; margin-bottom:10px;">${escapeHtml(loginError)}</div>` : ""}
        <button style="width:100%; background:var(--accent); color:#fff; border-radius:8px; padding:10px; font-weight:700; font-size:14px;" onclick="__submitLogin()">Entrar</button>
      </div>
    </div>
  `;
}

function viewModalHtml(){
  const p = programaById(form.programaId);
  const estado = form.tramiteEstado ? estadoById(form.tramiteEstado) : null;
  return `
    <div onclick="cerrarModal()" style="position:fixed; inset:0; background:rgba(34,38,43,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;">
      <div onclick="event.stopPropagation()" style="position:relative; background:#fff; border-radius:14px; padding:22px 40px 22px 22px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto;">
        <div style="position:absolute; top:0; right:0; bottom:0; width:30px; background:${p.color}; border-radius:0 14px 14px 0; display:flex; align-items:center; justify-content:center; overflow:hidden;">
          <span style="writing-mode:vertical-rl; text-orientation:mixed; color:#fff; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap;">${p.sigla || p.corto}</span>
        </div>
        <button onclick="cerrarModal()" style="position:absolute; top:10px; left:14px; font-size:18px;">✕</button>
        <h2 style="font-size:18px; font-weight:700; margin:28px 0 12px 0;">${escapeHtml(form.titulo)}</h2>
        <div style="font-size:13px; color:var(--ink-soft); display:flex; flex-direction:column; gap:5px;">
          ${form.sede?`<div>📍 ${escapeHtml(form.sede)}</div>`:""}
          ${(form.direcciones&&form.direcciones.length) ? form.direcciones.filter(Boolean).map(d=>`<div>🧭 ${escapeHtml(d)}</div>`).join("") : ""}
          <div class="mono">${form.fecha}${form.horaInicio?` · ${form.horaInicio}${form.horaFin?` a ${form.horaFin}`:""}`:""}</div>
          ${form.organizacion?`<div>🏢 ${escapeHtml(form.organizacion)}</div>`:""}
          ${form.personas?`<div>👤 ${escapeHtml(form.personas)}</div>`:""}
          ${(form.micros || (form.viandasLista&&form.viandasLista.some(v=>v.cantidad)) || form.refrigerios) ? `<div>${[
            form.micros?`🚌 Micros: ${form.micros}`:null,
            (form.viandasLista&&form.viandasLista.filter(v=>v.cantidad).length) ? `🍱 Viandas: ${form.viandasLista.filter(v=>v.cantidad).map(v=>`${v.cantidad}${v.tipo?` ${v.tipo}`:""}`).join(", ")}` : null,
            form.refrigerios?`🥪 Refrigerios: ${form.refrigerios}`:null,
          ].filter(Boolean).join(" · ")}</div>` : ""}
          ${estado?`<div>${estado.icon} ${estado.label}${form.proximoPaso?` — ${escapeHtml(form.proximoPaso)}`:""}</div>`:""}
          ${form.observaciones?`<div style="font-style:italic;">${escapeHtml(form.observaciones)}</div>`:""}
        </div>
        <button style="width:100%; margin-top:18px; background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:9px; font-weight:700; font-size:13px;" onclick="${currentUser ? 'toggleModoEditor()' : 'abrirLogin()'}">${currentUser ? 'Activar modo editor' : 'Iniciar sesión para editar'}</button>
      </div>
    </div>
  `;
}

function formModalHtml(){
  return `

            <button type="button" onclick="setTipoRepeticion('normal')" style="flex:1; padding:8px; border-radius:7px; font-size:13px; font-weight:600; border:1.5px solid ${form.tipoRepeticion==='normal'?"var(--accent)":"var(--line)"}; background:${form.tipoRepeticion==='normal'?"var(--accent-soft)":"#fff"}; color:${form.tipoRepeticion==='normal'?"var(--accent)":"var(--ink-soft)"};">Jornada normal</button>
          </div>
        </div>

        ${!form.id ? `
        <div style="margin-bottom:10px;">
          <label class="fieldLabel">Programa(s) *</label>

        </div>

        <div class="stack-mobile" style="display:flex; gap:10px;">
          ${(!form.id && form.esCampamento) ? `
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Desde *</label>
            <input type="date" class="inputStyle" value="${form.fecha}" oninput="updateForm('fecha', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Hasta *</label>
            <input type="date" class="inputStyle" value="${form.fechaHasta}" oninput="updateForm('fechaHasta', this.value)" /></div>

          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Fecha *</label>
            <input type="date" class="inputStyle" value="${form.fecha}" oninput="updateForm('fecha', this.value)" /></div>
          `}
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Hora inicio</label>
            <input type="time" class="inputStyle" value="${form.horaInicio}" oninput="updateForm('horaInicio', this.value)" /></div>
          <div style="margin-bottom:10px; flex:1;"><label class="fieldLabel">Hora fin</label>
            <input type="time" class="inputStyle" value="${form.horaFin}" oninput="updateForm('horaFin', this.value)" /></div>
        </div>

        <div style="display:flex; align-items:center; gap:8px; margin:10px 0;">
          <input type="checkbox" id="fechas-sueltas" ${form.fechasSueltasActivo?"checked":""} onchange="toggleFechasSueltas(this.checked)" />
          <label for="fechas-sueltas" style="font-size:13px; font-weight:600;">📅 Se repite en varios días sueltos (no seguidos)</label>
        </div>

        ${form.fechasSueltasActivo ? `
        <div style="margin-bottom:10px;">
          <label class="fieldLabel">Fechas *</label>
          ${form.fechasSueltas.map((f,i)=>`

              <input type="date" class="inputStyle" value="${f}" oninput="actualizarFechaSuelta(${i}, this.value)" />

            </div>
          `).join("")}
          <button type="button" onclick="agregarFechaSuelta()" style="font-size:12px; font-weight:600; color:var(--accent);">+ Agregar otra fecha</button>
        </div>
